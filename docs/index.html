<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>meetnote — 회의 전개 시각화</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f2f2f3; --panel:#fff; --line:#e3e3e6; --line2:#eeeef0;
  --ink:#17181c; --ink2:#42444b; --dim:#8b8e96;
  --blue:#2f6bdd; --green:#1c7a4e; --red:#c53f2d; --amber:#c07d22; --gray:#9aa0a8; --gold:#e2562a;
  --rail:400px; --split:44%; --top:52px; --player:0px;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}

/* ---------- 상단 ---------- */
.top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:14px;font-weight:800;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--dim);font-weight:600}
.file{font-size:12.5px;color:var(--dim);max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--ink2);border:1px solid var(--line)}
.tbtn:hover{background:#f7f7f8}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg2{display:flex;padding:2px;border-radius:9px;background:#f1f1f3}
.seg2 button{height:26px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--dim)}
.seg2 button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,28,.1)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.prog .track{width:96px;height:3px;border-radius:99px;background:var(--line)}
.prog .fillp{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .25s}
body.idle .prog,body.idle .only-run,body.idle .seg2{display:none}
body.view-cards .prog,body.view-cards .only-run{display:none}

/* ---------- 본문 ---------- */
main{position:fixed;top:var(--top);left:0;right:0;bottom:var(--player);
  display:grid;grid-template-columns:var(--rail) 9px minmax(0,1fr)}
.rail{background:var(--panel);border-right:1px solid var(--line);
  display:grid;grid-template-rows:var(--split) 9px minmax(0,1fr);min-height:0}
.rz{position:relative;display:grid;place-items:center;background:var(--bg)}
.rz:before{content:"";border-radius:99px;background:#d6d7da}
.rz:hover:before{background:var(--dim)}
.rz-x{cursor:col-resize}.rz-x:before{width:3px;height:40px}
.rz-y{cursor:row-resize;background:var(--panel);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.rz-y:before{width:40px;height:3px}

/* 요약 패널 */
.digest{display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:5px;padding:10px 12px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--line);
  font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip b{font-weight:800;margin-left:4px;color:#aeb1b7}
.chip.on{color:#fff;background:var(--ink);border-color:var(--ink)}
.chip.on b{color:rgba(255,255,255,.6)}
.chip.c-decision.on{background:var(--gold);border-color:var(--gold)}
.chip.c-conditional.on{background:#e8873f;border-color:#e8873f}
.chip.c-open.on{background:#6f747c;border-color:#6f747c}
.chip.c-conflict.on{background:var(--red);border-color:var(--red)}
.chip.c-fun.on{background:#7b5cd6;border-color:#7b5cd6}
.dlist{flex:1;overflow:auto;padding:2px 10px 16px;display:flex;flex-direction:column;gap:7px}
.dc{padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--panel)}
.dc:hover{border-color:#c9cbd1;box-shadow:0 2px 10px rgba(20,22,28,.07)}
.dc .dk{font-size:9.5px;font-weight:800;letter-spacing:.07em;margin-bottom:4px}
.dc h5{font-size:13px;font-weight:750;line-height:1.45;letter-spacing:-.01em}
.dc .dm{margin-top:6px;font-size:11px;color:var(--dim)}
.dc.k-decision{border-left:3px solid var(--gold)} .dc.k-decision .dk{color:var(--gold)}
.dc.k-conditional{border-left:3px dashed var(--gold)} .dc.k-conditional .dk{color:#c9702f}
.dc.k-open{border-left:3px dotted #9aa0a8} .dc.k-open .dk{color:#6f747c}
.dc.k-conflict{border-left:3px dashed var(--red)} .dc.k-conflict .dk{color:var(--red)}
.dc.k-fun{border-left:3px solid #7b5cd6} .dc.k-fun .dk{color:#7b5cd6}
.dc .vs{margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.dc .vs span{padding-left:12px;position:relative;line-height:1.45}
.dc .vs span:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--blue)}
.dc .vs span+span:before{background:var(--red)}
.dc.k-fun .met{margin-top:6px;display:flex;gap:8px;font-size:11px;color:#7b5cd6;font-weight:700}
.empty{padding:24px 12px;text-align:center;font-size:12px;color:var(--dim)}

/* 원문 */
.srcbox{display:flex;flex-direction:column;min-height:0}
.rhead{padding:10px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.rhead h2{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--dim);white-space:nowrap}
.search{flex:1;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;background:#f3f3f5}
.search input{width:100%;font-size:12.5px}
.search input::placeholder{color:var(--dim)}
#qn{font-size:11px;color:var(--dim);white-space:nowrap}
#tr{flex:1;overflow:auto;padding:6px 8px 40px}

.seg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 9px;border-radius:11px;cursor:pointer}
.seg:hover{background:#f8f8f9}
.seg.src{box-shadow:inset 2px 0 0 var(--gold);background:#fefaf6}
.seg.cur{background:#fafafb}
.seg.fun{box-shadow:inset 2px 0 0 #7b5cd6}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:750;color:#fff;background:var(--c)}
.seg-h{display:flex;align-items:baseline;gap:6px}
.seg-h b{font-size:13.5px;font-weight:750}
.seg-h time{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.seg.cur .seg-h time{color:var(--ink)}
.seg-h .fb{font-size:10.5px;font-weight:800;color:#7b5cd6}
.seg p{font-size:13.5px;line-height:1.62;color:var(--ink2);margin-top:3px;transition:color .2s}
.seg mark{background:#ffe9a8;color:inherit;border-radius:3px}

/* 재생 중인 문장 — 글자 자체에 무지갯빛 */
@keyframes shimmer{to{background-position:-160% 0}}
.seg p.lit{
  font-weight:600;
  background-image:linear-gradient(100deg,#3f7ce8,#8b5cf6,#d9539b,#e8873f,#2f9e75,#3f7ce8);
  background-size:160% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shimmer 5.5s linear infinite;
}
@media (prefers-reduced-motion:reduce){.seg p.lit{animation:none}}

/* ---------- 캔버스 ---------- */
.stage{position:relative;overflow:hidden;background:var(--bg);touch-action:none}
body.view-cards .stage{display:none}
.stage.grab{cursor:grabbing}
#cv{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:1.7px;opacity:0;transition:opacity .35s}
#edges path.on{opacity:1}
#edges text{font:650 10.5px var(--font);opacity:0;transition:opacity .35s}
#edges text.on{opacity:1}
.e-raise{stroke:#b4b7bd}                            .l-raise{fill:#8b8e96}
.e-pro{stroke:var(--green)}                         .l-pro{fill:var(--green)}
.e-con{stroke:var(--red);stroke-dasharray:6 5}      .l-con{fill:var(--red)}
.e-condition{stroke:var(--amber);stroke-dasharray:3 4} .l-condition{fill:var(--amber)}
.e-resolve{stroke:var(--gold);stroke-width:2px}     .l-resolve{fill:var(--gold)}
.e-conflict{stroke:var(--red);stroke-width:2px;stroke-dasharray:7 5} .l-conflict{fill:var(--red)}
.e-flow{stroke:#c2c4c9;stroke-width:2.4px}

.frame{position:absolute;border:1.5px solid #dcdde1;border-radius:20px;background:rgba(255,255,255,.5);
  opacity:0;transition:opacity .4s}
.frame.in{opacity:1}
.fhead{position:absolute;left:20px;top:-13px;display:flex;align-items:center;gap:8px;
  padding:4px 12px;border-radius:99px;background:var(--panel);border:1px solid #dcdde1;white-space:nowrap}
.fhead b{font-size:14px;font-weight:800;letter-spacing:-.01em}
.fhead .no{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.fhead .pt{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:#f0f0f2;color:#6d727a}
.fhead time{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

/* 멀리서 보면 섹션 흐름만 */
.fbig{display:none;position:absolute;inset:0;padding:60px;flex-direction:column;justify-content:center;gap:26px}
.fbig .n{font-size:44px;font-weight:800;color:#b3b6bc;letter-spacing:.06em}
.fbig .t{font-size:86px;font-weight:800;line-height:1.18;letter-spacing:-.02em}
.fbig .s{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:700;color:#8b8e96}
.fbig .dot{width:34px;height:34px;border-radius:10px}
#cv.lod .fbig{display:flex}
#cv.lod .fhead,#cv.lod .node{opacity:0!important;pointer-events:none}
#cv.lod path:not(.e-flow),#cv.lod text{opacity:0!important}
#cv.lod .frame{background:#fff;border-color:#d3d4d9}

.node{position:absolute;width:228px;padding:11px 13px;border-radius:14px;background:var(--panel);
  border:1.5px solid var(--line);cursor:pointer;opacity:0;transform:scale(.94);
  transition:opacity .3s,transform .3s,box-shadow .18s}
.node.in{opacity:1;transform:none}
.node:hover{box-shadow:0 3px 14px rgba(20,22,28,.14)}
.node .k{font-size:9.5px;font-weight:800;letter-spacing:.07em;margin-bottom:4px;color:var(--dim)}
.node h4{font-size:13.5px;font-weight:750;line-height:1.45;letter-spacing:-.01em}
.node p{margin-top:5px;font-size:11.5px;line-height:1.55;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .m{margin-top:8px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.node .m .d{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;font-weight:750;color:#fff;background:var(--c,#9aa0a8)}

.node.issue{width:252px;background:var(--ink);border-color:var(--ink);color:#fff}
.node.issue .k{color:rgba(255,255,255,.55)}
.node.issue h4{font-size:15px;font-weight:800}
.node.issue p,.node.issue .m{color:rgba(255,255,255,.66)}
.node.position{border-color:var(--blue);border-width:2px}
.node.position .k{color:var(--blue)}
.node.pro{border-color:var(--green)}
.node.pro .k{color:var(--green)}
.node.con{border-color:var(--red);border-style:dashed}
.node.con .k{color:var(--red)}
.node.condition{border-color:var(--amber);border-style:dashed}
.node.condition .k{color:var(--amber)}
.node.open{width:252px;border-color:#b6b9bf;border-style:dotted;background:#f4f4f6}
.node.open .k{color:#7b7f87}
.node.decision{width:252px;background:var(--gold);border-color:var(--gold);color:#fff;
  box-shadow:0 4px 18px rgba(226,86,42,.24)}
.node.decision .k{color:rgba(255,255,255,.72)}
.node.decision h4{font-size:14.5px;font-weight:800}
.node.decision p,.node.decision .m{color:rgba(255,255,255,.82)}
.node.conditional{width:252px;border:2px dashed var(--gold);color:var(--gold)}
.node.conditional h4{font-size:14.5px;font-weight:800;color:var(--gold)}
.node.conditional .k{color:var(--gold)}
.node.conditional p{color:#8a6042}
.node.live{box-shadow:0 0 0 3px rgba(23,24,28,.12)}
.node.sel{box-shadow:0 0 0 3px rgba(226,86,42,.34)}
.node.playing{box-shadow:0 0 0 3px rgba(47,107,221,.28)}
.far .node p,.far .node .m{display:none}

/* ---------- 카드 뷰 ---------- */
.cards{display:none;overflow:auto;padding:16px 16px 60px;background:var(--bg)}
body.view-cards .cards{display:block}
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));align-items:start}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px 14px}
.sc>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.sc .no{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.sc h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sc .pt{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:#f0f0f2;color:#6d727a}
.sc>header time{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.sc .q{padding:9px 11px;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
.sc .q em{display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.07em;color:rgba(255,255,255,.55);margin-bottom:3px}
.sc .q b{font-size:13.5px;font-weight:750;line-height:1.45}
.sc ul{list-style:none;margin-top:9px}
.sc li{position:relative;padding:6px 0 6px 13px;cursor:pointer;border-radius:8px}
.sc li:hover{background:#f7f7f9}
.sc li:before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:99px}
.sc li>span{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;margin-bottom:2px}
.sc li>b{display:block;font-size:13px;font-weight:700;line-height:1.5}
.sc li>i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:3px}
.sc li ul{margin-top:2px;margin-left:9px;border-left:1px solid var(--line2);padding-left:7px}
.sc li.position:before{background:var(--blue)} .sc li.position>span{color:var(--blue)}
.sc li.pro:before{background:var(--green)} .sc li.pro>span{color:var(--green)}
.sc li.con:before{background:var(--red)} .sc li.con>span{color:var(--red)}
.sc li.condition:before{background:var(--amber)} .sc li.condition>span{color:var(--amber)}
.sc li.open:before{background:#9aa0a8} .sc li.open>span{color:#6f747c}
.sc .cf{margin-top:9px;padding:8px 11px;border-radius:10px;border:1.5px dashed var(--red);
  font-size:12px;line-height:1.55;color:var(--ink2)}
.sc .cf em{font-style:normal;font-weight:800;color:var(--red);font-size:10px;letter-spacing:.06em;display:block;margin-bottom:3px}
.sc .res{margin-top:10px;padding:10px 12px;border-radius:11px;cursor:pointer}
.sc .res em{display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.07em;margin-bottom:3px}
.sc .res b{font-size:13.5px;font-weight:800;line-height:1.45}
.sc .res.decision{background:var(--gold);color:#fff}
.sc .res.decision em{color:rgba(255,255,255,.75)}
.sc .res.conditional{border:2px dashed var(--gold);color:var(--gold)}
.sc .res.open{border:1.5px dotted #b6b9bf;background:#f4f4f6;color:#5f636b}

/* ---------- 범례 · 줌 ---------- */
.legend{position:absolute;left:14px;top:12px;z-index:6;display:flex;flex-wrap:wrap;gap:5px 12px;
  padding:8px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.legend b{font-weight:650}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}
.zoom{position:absolute;right:14px;bottom:14px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;
  border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.zoom button{width:28px;height:28px;border-radius:7px;font-size:14px;color:var(--dim)}
.zoom button:hover{background:#f2f2f4;color:var(--ink)}
.zoom .lv{width:44px;text-align:center;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.zoom .fit{width:auto;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.lodtip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;padding:6px 13px;
  border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:650;
  color:var(--dim);opacity:0;transition:opacity .3s;pointer-events:none}
#cv.lod~.lodtip{opacity:1}

/* ---------- 드롭존 ---------- */
.drop{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:var(--bg)}
body.idle .drop,.drop.over{display:grid}
.drop.over{background:#eaf0fd}
.dz{width:min(580px,86vw);text-align:center;padding:44px 34px;border-radius:20px;
  border:1.5px dashed #c9cbd1;background:var(--panel)}
.drop.over .dz{border-color:var(--blue)}
.dz h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.dz .sub{margin-top:9px;font-size:13.5px;line-height:1.7;color:var(--dim)}
.dz .btns{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dz .big{height:38px;padding:0 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700}
.dz .ghost{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink2)}
.dz .note{margin-top:16px;font-size:11.5px;line-height:1.6;color:#a7aab1}

.toast{position:fixed;left:50%;bottom:calc(var(--player) + 22px);transform:translate(-50%,14px);z-index:30;
  max-width:88vw;padding:11px 16px;border-radius:12px;background:var(--ink);color:#fff;
  font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  box-shadow:0 6px 24px rgba(20,22,28,.24)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast em{font-style:normal;color:rgba(255,255,255,.62);font-weight:600;margin-left:8px}

/* ---------- 플레이어 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:22;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--panel);border-top:1px solid var(--line)}
body.noaudio .player{display:none}
.player #pp{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.bar{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer}
.bar .rail2{position:absolute;left:0;right:0;height:4px;border-radius:99px;background:var(--line)}
.bar .fill{position:absolute;left:0;height:4px;width:0;border-radius:99px;background:var(--ink)}
.bar .mk{position:absolute;top:2px;width:8px;height:8px;margin-left:-4px;border-radius:99px;
  background:#7b5cd6;border:1.5px solid #fff}
.tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.now{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--dim)}

/* ---------- 모바일 ---------- */
.tabs{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;bottom:calc(var(--player) + 48px)}
  .rail,.rz-x{display:none}
  body.tab-src .rail{display:grid}
  body.tab-src .stage,body.tab-src .cards{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:var(--player);height:48px;z-index:21;
    background:var(--panel);border-top:1px solid var(--line)}
  body.idle .tabs{display:none}
  .tabs button{flex:1;font-size:12.5px;font-weight:700;color:var(--dim)}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}

}

      음성(.m4a)을 같이 놓으면 재생 위치가 연결됩니다. 파일은 브라우저 안에서만 처리됩니다.</p>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const d = document.createElement(t); if (c) d.className = c; if (h != null) d.innerHTML = h; return d; };
const svgEl = (t, a) => { const n = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const esc = s => (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const mmss = t => { t = Math.max(0, Math.round(t)); const h = t / 3600 | 0, m = (t % 3600) / 60 | 0, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const secs = s => String(s).split(':').reverse().reduce((a, v, i) => a + (+v) * [1, 60, 3600][i], 0);

const OX = 300, OY = 1000, LOD = .34;
const au = $('#au');
let TRANS = [], SEGN = [], NODES = [], EDGES = [], FRAMES = [], REVEAL = [], FUN = [], MAP = null;
let bounds = { x0: 0, y0: 0, w: 1, h: 1 };
let view = { x: 0, y: 0, z: .8 }, curSeg = -1, curLine = null, audioOK = false, avatar = {}, selected = null;

const KIND_KO = { issue: '쟁점', position: '주장', pro: '근거·동의', con: '반론·우려',
  condition: '조건', open: '미결', decision: '결론 · 확정', conditional: '결론 · 조건부' };
const EDGE_KO = { raise: '주장', pro: '근거', con: '반론', condition: '조건', resolve: '결론', conflict: '대립' };
const EDGE_OF = { position: 'raise', pro: 'pro', con: 'con', condition: 'condition', open: 'condition', issue: 'raise' };

/* ================= 1. 전사 파싱 ================= */
const RE_HEAD = /^(\S{1,10})\s+((?:\d{1,2}:)?\d{1,2}:\d{2})\s*$/;
function parseTxt(text) {
  const segs = []; let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/^﻿/, '').trim();
    const m = line.match(RE_HEAD);
    if (m) { cur = { t: secs(m[2]), s: m[1], l: [] }; segs.push(cur); return; }
    if (!line || !cur) return;
    cur.l.push(line);
  });
  const out = [];
  segs.forEach(s => {
    const p = out[out.length - 1];
    if (p && p.s === s.s && s.t - p.t < 30) p.l.push(...s.l); else out.push(s);
  });
  return out;
}
/* 문장별 시각 — 발언 구간을 글자 수 비율로 나눈다 */
function lineTimes() {
  TRANS.forEach((s, i) => {
    const end = i + 1 < TRANS.length ? TRANS[i + 1].t : s.t + 30;
    const total = s.l.reduce((a, l) => a + l.length, 0) || 1;
    let acc = s.t;
    s.lt = s.l.map(l => { const d = (end - s.t) * l.length / total; const r = [acc, acc + d]; acc += d; return r; });
  });
}

/* ================= 2. 웃음 · 동조가 몰린 순간 ================= */
const LAUGH = /ㅋㅋ|ㅎㅎ|웃기|웃었|웃음|재밌|재미있|미쳤|미친|대박|개꿀|장난 아니|또라이|귀여|아름답|짱|웃겨/g;
const AGREE = /^(맞아|맞아요|맞습니다|맞죠|그치|그러니까|좋아|좋다|좋습니다|좋네|오케이|그래|진짜|인정|완전|대박|와)/;
function funMoments(segs) {
  const cand = [];
  for (let i = 0; i < segs.length; i++) {
    const win = [];
    for (let j = i; j < segs.length && segs[j].t < segs[i].t + 75; j++) win.push(segs[j]);
    if (win.length < 4) continue;
    const text = win.map(s => s.l.join(' ')).join(' ');
    const laughs = (text.match(LAUGH) || []).length;
    const reacts = win.filter(s => { const x = s.l.join(' '); return x.length < 34 && AGREE.test(x); }).length;
    const people = new Set(win.map(s => s.s)).size;
    const score = laughs * 3 + reacts * 2 + people * 1.6 + Math.min(win.length, 12) * .4;
    if (laughs >= 2 && people >= 3) cand.push({ i, t: win[0].t, t1: win[win.length - 1].t, score, laughs, reacts, people, win });
  }
  cand.sort((a, b) => b.score - a.score);
  const out = [];
  cand.forEach(c => {
    if (out.length >= 5) return;
    if (out.some(o => c.t < o.t1 + 30 && c.t1 > o.t - 30)) return;
    /* 반응 문장은 짧을수록 그 순간을 잘 드러낸다 */
    const lines = [];
    c.win.forEach(s => s.l.forEach(l => { LAUGH.lastIndex = 0; if (LAUGH.test(l) && l.length > 5) lines.push([l, s.s]); }));
    lines.sort((x, y) => x[0].length - y[0].length);
    const hit = lines[0] || [c.win[0].l[0] || '', c.win[0].s];
    c.title = hit[0].length > 58 ? hit[0].slice(0, 57) + '…' : hit[0];
    c.who = hit[1];
    out.push(c);
  });
  return out.sort((a, b) => a.t - b.t);
}

/* ================= 3. IBIS 맵 → 그래프 ================= */
function build(map) {
  const nodes = [], edges = [], frames = [], reveal = [];
  map.sections.forEach(sec => {
    const byId = {}, mine = [];
    const push = o => { o.sec = sec; nodes.push(o); mine.push(o); byId[o.id] = o; return o; };
    sec.nodes.forEach(n => push(Object.assign({}, n, { t: secs(n.t), at: (n.at || []).map(secs) })));
    mine.forEach(n => { if (n.parent) { n.p = byId[n.parent]; if (n.p) (n.p.kids = n.p.kids || []).push(n); } });

    const r = sec.resolution;
    const res = r && push(Object.assign({}, r, { id: sec.no + '-res', t: secs(r.t), at: (r.at || []).map(secs) }));

    mine.forEach(n => { if (n.p) edges.push({ a: n.p, b: n, kind: EDGE_OF[n.kind] || 'raise', label: EDGE_KO[EDGE_OF[n.kind] || 'raise'] }); });
    sec.conflictPairs = [];
    (sec.conflicts || []).forEach(([x, y]) => {
      if (byId[x] && byId[y]) { edges.push({ a: byId[x], b: byId[y], kind: 'conflict', label: '대립', both: true });
        sec.conflictPairs.push([byId[x], byId[y]]); }
    });
    if (res) (r.from || []).map(id => byId[id]).filter(Boolean)
      .forEach(n => edges.push({ a: n, b: res, kind: 'resolve', label: '' }));

    const roots = mine.filter(n => !n.p);
    let slot = 0;
    const walk = (n, depth) => {
      n.col = depth;
      const kids = (n.kids || []).sort((a, b) => a.t - b.t);
      if (!kids.length) { n.ly = slot * 142; slot++; }
      else { kids.forEach(k => walk(k, depth + 1)); n.ly = (kids[0].ly + kids[kids.length - 1].ly) / 2; }
    };
    roots.sort((a, b) => a.t - b.t).forEach(n => walk(n, 0));
    const maxCol = Math.max(...mine.map(n => n.col));
    if (res) { res.col = maxCol + 1; res.ly = (Math.min(...mine.map(n => n.ly)) + Math.max(...mine.map(n => n.ly))) / 2; }

    const all = res ? mine.concat(res) : mine;
    const frame = { sec, nodes: all, res, cols: (res ? maxCol + 1 : maxCol) + 1 };
    frames.push(frame);
    sec.frame = frame; sec.byId = byId;

    const done = new Set(), order = [], rest = all.slice().sort((a, b) => a.t - b.t);
    while (rest.length) {
      const i = rest.findIndex(n => !n.p || done.has(n.p.id));
      const n = rest.splice(i < 0 ? 0 : i, 1)[0];
      done.add(n.id); order.push(n);
    }
    reveal.push({ frame });
    order.forEach(n => reveal.push({ node: n }));
  });

  for (let i = 1; i < frames.length; i++) {
    const prev = frames[i - 1].nodes[frames[i - 1].nodes.length - 1];
    const next = frames[i].nodes.find(n => n.kind === 'issue') || frames[i].nodes[0];
    if (prev && next) edges.push({ a: prev, b: next, kind: 'flow' });
  }
  return { nodes, edges: edges.filter(e => e.a && e.b), frames, reveal };
}

/* ================= 4. 섹션 배치 ================= */
const COL = 296, PAD = 26, HEAD = 30, GAPX = 104, GAPY = 128;
function layout(g) {
  g.frames.forEach(f => {
    const ys = f.nodes.map(n => n.ly);
    f.h = Math.max(...ys) - Math.min(...ys) + 142 + PAD * 2 + HEAD;
    f.w = (f.cols - 1) * COL + 252 + PAD * 2;
  });
  const S = g.frames.reduce((a, f) => a + f.w + GAPX, 0);
  const H = Math.max(...g.frames.map(f => f.h)) + GAPY;
  const ROWW = Math.max(3600, Math.min(9000, Math.sqrt(2.1 * S * H)));
  let x = 0, y = 0, rowH = 0;
  g.frames.forEach(f => {
    const ys = f.nodes.map(n => n.ly), y0 = Math.min(...ys);
    if (x && x + f.w > ROWW) { x = 0; y += rowH + GAPY; rowH = 0; }
    f.x = x; f.y = y;
    f.nodes.forEach(n => { n.x = x + PAD + n.col * COL; n.y = y + PAD + HEAD + (n.ly - y0); });
    rowH = Math.max(rowH, f.h); x += f.w + GAPX;
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  g.frames.forEach(f => {
    x0 = Math.min(x0, f.x); y0 = Math.min(y0, f.y);
    x1 = Math.max(x1, f.x + f.w); y1 = Math.max(y1, f.y + f.h);
  });
  bounds = { x0: x0 + OX - 80, y0: y0 + OY - 80, w: x1 - x0 + 160, h: y1 - y0 + 160 };
}

/* ================= 5. 그리기 ================= */
const ARROW = { raise: '#b4b7bd', pro: '#1c7a4e', con: '#c53f2d', condition: '#c07d22', resolve: '#e2562a', conflict: '#c53f2d', flow: '#c2c4c9' };
const RESDOT = { decision: '#e2562a', conditional: '#e8873f', open: '#9aa0a8' };
function defs() {
  const d = svgEl('defs');
  Object.entries(ARROW).forEach(([k, c]) => ['e', 's'].forEach(side => {
    const m = svgEl('marker', { id: 'ar-' + k + '-' + side, markerWidth: 9, markerHeight: 9,
      refX: side === 'e' ? 7.5 : 1.5, refY: 3, orient: 'auto', markerUnits: 'userSpaceOnUse' });
    m.append(svgEl('path', { d: side === 'e' ? 'M0,0 L8,3 L0,6 Z' : 'M8,0 L0,3 L8,6 Z', fill: c }));
    d.append(m);
  }));
  return d;
}
function render(g) {
  const cv = $('#cv'), sv = $('#edges');
  [...cv.children].forEach(c => { if (c !== sv) c.remove(); });
  sv.textContent = ''; sv.append(defs());

  g.frames.forEach(f => {
    const d = el('div', 'frame');
    d.style.cssText = `left:${f.x + OX}px;top:${f.y + OY}px;width:${f.w}px;height:${f.h}px`;
    const s = f.sec, rk = f.res ? f.res.kind : 'open';
    d.append(el('div', 'fhead',
      `<span class="no">논의 ${String(s.no).padStart(2, '0')}</span><b>${esc(s.title)}</b>`
      + `<span class="pt">${esc(s.part)}</span><time>${esc(s.t)}–${esc(s.t1)}</time>`));
    d.append(el('div', 'fbig',
      `<div class="n">논의 ${String(s.no).padStart(2, '0')} · ${esc(s.part)}</div>`
      + `<div class="t">${esc(s.title)}</div>`
      + `<div class="s"><span class="dot" style="background:${RESDOT[rk]}"></span>`
      + `${KIND_KO[rk] || '미결'} · ${esc(s.t)}–${esc(s.t1)}</div>`));
    f.dom = d; cv.append(d);
  });

  g.nodes.forEach(n => {
    const d = el('div', 'node ' + n.kind);
    d.style.left = (n.x + OX) + 'px'; d.style.top = (n.y + OY) + 'px';
    d.innerHTML = `<div class="k">${KIND_KO[n.kind] || ''}</div><h4>${esc(n.title)}</h4>`
      + (n.note ? `<p>${esc(n.note)}</p>` : '')
      + `<div class="m"><span class="d" style="--c:${avatar[n.who] || '#9aa0a8'}">${esc((n.who || '').slice(0, 1))}</span>`
      + `${esc(n.who || '')} · ${mmss(n.t)}</div>`;
    d.onclick = () => selectNode(n);
    n.dom = d; cv.append(d);
  });

  g.edges.forEach(e => {
    const A = e.a, B = e.b, aw = A.dom.offsetWidth, ah = A.dom.offsetHeight, bh = B.dom.offsetHeight;
    let d, lx, ly;
    if (e.kind === 'conflict') {
      const up = A.y <= B.y ? A : B, dn = A.y <= B.y ? B : A, uh = up.dom.offsetHeight;
      if (Math.abs(A.x - B.x) < 12) {
        const cx = up.x + OX + up.dom.offsetWidth / 2;
        d = `M ${cx} ${up.y + OY + uh + 3} L ${cx} ${dn.y + OY - 3}`;
        lx = cx + 24; ly = (up.y + OY + uh + dn.y + OY) / 2 + 4;
      } else {
        const ax = A.x + OX, ay = A.y + OY + ah / 2, bx = B.x + OX, by = B.y + OY + bh / 2, off = 60;
        d = `M ${ax} ${ay} C ${ax - off} ${ay}, ${Math.min(ax, bx) - off} ${by}, ${bx} ${by}`;
        lx = Math.min(ax, bx) - off + 24; ly = (ay + by) / 2;
      }
    } else {
      const ax = A.x + OX + aw, ay = A.y + OY + ah / 2, bx = B.x + OX, by = B.y + OY + bh / 2;
      if (bx < ax) {
        const m = Math.min(A.y + OY, B.y + OY) - 74;
        d = `M ${ax} ${ay} C ${ax + 140} ${ay}, ${ax + 140} ${m}, ${ax} ${m} L ${bx} ${m} C ${bx - 140} ${m}, ${bx - 140} ${by}, ${bx} ${by}`;
        lx = (ax + bx) / 2; ly = m - 9;
      } else {
        const dx = Math.max(46, (bx - ax) * .55);
        d = `M ${ax} ${ay} C ${ax + dx} ${ay}, ${bx - dx} ${by}, ${bx} ${by}`;
        lx = (ax + bx) / 2; ly = (ay + by) / 2 - 8;
      }
    }
    e.path = svgEl('path', { d, class: 'e-' + e.kind, 'marker-end': `url(#ar-${e.kind}-e)` });
    if (e.both) e.path.setAttribute('marker-start', `url(#ar-${e.kind}-s)`);
    sv.append(e.path);
    if (e.label) {
      e.text = svgEl('text', { x: lx, y: ly, class: 'l-' + e.kind, 'text-anchor': 'middle' });
      e.text.textContent = e.label; sv.append(e.text);
    }
  });
  sv.style.width = (bounds.x0 + bounds.w + 300) + 'px';
  sv.style.height = (bounds.y0 + bounds.h + 300) + 'px';
  NODES = g.nodes; EDGES = g.edges; FRAMES = g.frames; REVEAL = g.reveal;
}

/* ================= 6. 카드 뷰 ================= */
function renderCards() {
  const w = $('#cgrid'); w.textContent = '';
  if (!MAP) return;
  MAP.sections.forEach(sec => {
    const a = el('article', 'sc');
    a.append(el('header', null,
      `<span class="no">논의 ${String(sec.no).padStart(2, '0')}</span><h3>${esc(sec.title)}</h3>`
      + `<span class="pt">${esc(sec.part)}</span><time>${esc(sec.t)}–${esc(sec.t1)}</time>`));
    const nodes = sec.frame.nodes;
    const issue = nodes.find(n => n.kind === 'issue');
    if (issue) {
      const q = el('div', 'q', `<em>쟁점</em><b>${esc(issue.title)}</b>`);
      q.onclick = () => selectNode(issue); a.append(q);
    }
    const listOf = (parent, depth) => {
      const kids = nodes.filter(n => n.p === parent && n.kind !== 'issue');
      if (!kids.length) return null;
      const ul = el('ul');
      kids.sort((x, y) => x.t - y.t).forEach(n => {
        const li = el('li', n.kind,
          `<span>${KIND_KO[n.kind]}</span><b>${esc(n.title)}</b>`
          + `<i>${esc(n.who || '')} · ${mmss(n.t)}</i>`);
        li.onclick = e => { e.stopPropagation(); selectNode(n); };
        const sub = listOf(n, depth + 1); if (sub) li.append(sub);
        ul.append(li);
      });
      return ul;
    };
    const tree = issue && listOf(issue, 0); if (tree) a.append(tree);
    (sec.conflictPairs || []).forEach(([x, y]) => {
      a.append(el('div', 'cf', `<em>대립</em>${esc(x.title)} <b>↔</b> ${esc(y.title)}`));
    });
    const r = sec.frame.res;
    if (r) {
      const d = el('div', 'res ' + r.kind, `<em>${KIND_KO[r.kind]}</em><b>${esc(r.title)}</b>`);
      d.onclick = () => selectNode(r); a.append(d);
    }
    w.append(a);
  });
}

/* ================= 7. 요약 패널 ================= */
const GROUPS = [
  { id: 'decision', ko: '확정' }, { id: 'conditional', ko: '조건부' }, { id: 'open', ko: '미결' },
  { id: 'conflict', ko: '대립' }, { id: 'fun', ko: '하이라이트' }
];
let group = 'decision';
function digestItems(g) {
  if (g === 'fun') return FUN;
  if (g === 'conflict') {
    const out = [];
    (MAP ? MAP.sections : []).forEach(s => (s.conflictPairs || []).forEach(p => out.push({ sec: s, pair: p })));
    return out;
  }
  return NODES.filter(n => n.kind === g).sort((a, b) => a.t - b.t);
}
function renderDigest() {
  const cw = $('#chips'); cw.textContent = '';
  GROUPS.forEach(gr => {
    const n = digestItems(gr.id).length;
    const b = el('button', 'chip c-' + gr.id + (group === gr.id ? ' on' : ''), `${gr.ko}<b>${n}</b>`);
    b.onclick = () => { group = gr.id; renderDigest(); };
    cw.append(b);
  });
  const w = $('#dlist'); w.textContent = '';
  const items = digestItems(group);
  if (!items.length) { w.append(el('div', 'empty', '해당하는 항목이 없습니다')); return; }

  if (group === 'fun') {
    items.forEach(f => {
      const d = el('div', 'dc k-fun',
        `<div class="dk">웃음 · 반응이 몰린 순간</div><h5>${esc(f.title)}</h5>`
        + `<div class="met"><span>😄 ${f.laughs}</span><span>👥 ${f.people}명</span><span>💬 반응 ${f.reacts}</span></div>`
        + `<div class="dm">${esc(f.who || '')} · ${mmss(f.t)}–${mmss(f.t1)}</div>`);
      d.onclick = () => highlightRange(f.t, f.t1, true);
      w.append(d);
    });
    return;
  }
  if (group === 'conflict') {
    items.forEach(c => {
      const d = el('div', 'dc k-conflict',
        `<div class="dk">대립</div><h5>${esc(c.sec.title)}</h5>`
        + `<div class="vs"><span>${esc(c.pair[0].title)}</span><span>${esc(c.pair[1].title)}</span></div>`
        + `<div class="dm">논의 ${String(c.sec.no).padStart(2, '0')} · ${esc(c.sec.t)}–${esc(c.sec.t1)}</div>`);
      d.onclick = () => { selectNode(c.pair[0]); c.pair.forEach(n => n.dom.classList.add('sel')); };
      w.append(d);
    });
    return;
  }
  items.forEach(n => {
    const d = el('div', 'dc k-' + n.kind,
      `<div class="dk">${KIND_KO[n.kind]}</div><h5>${esc(n.title)}</h5>`
      + `<div class="dm">논의 ${String(n.sec.no).padStart(2, '0')} · ${esc(n.sec.title)} · ${esc(n.who || '')} ${mmss(n.t)}</div>`);
    d.onclick = () => selectNode(n);
    w.append(d);
  });
}

/* ================= 8. 시간순 전개 ================= */
let timer = null, step = 0, speed = 2, paused = false;
function play() {
  clearTimeout(timer);
  if (paused) return;
  if (step >= REVEAL.length) return done();
  const it = REVEAL[step++];
  $('#fillp').style.width = (step / REVEAL.length * 100) + '%';
  $('#pn').textContent = `${step} / ${REVEAL.length}`;
  if (it.frame) {
    it.frame.dom.classList.add('in');
    ensureVisible(it.frame.x, it.frame.y, it.frame.w, it.frame.h);
    timer = setTimeout(play, 620 / speed); return;
  }
  const n = it.node;
  n.dom.classList.add('in');
  EDGES.forEach(e => {
    if ((e.b === n && e.a.dom.classList.contains('in')) || (e.both && e.a === n && e.b.dom.classList.contains('in'))) {
      e.path.classList.add('on'); if (e.text) e.text.classList.add('on');
    }
  });
  NODES.forEach(o => o.dom.classList.remove('live'));
  n.dom.classList.add('live');
  ensureVisible(n.x, n.y, n.dom.offsetWidth, n.dom.offsetHeight);
  timer = setTimeout(play, (/decision|conditional|open/.test(n.kind) ? 900 : 560) / speed);
}
function done() {
  NODES.forEach(o => o.dom.classList.remove('live'));
  const c = k => NODES.filter(x => x.kind === k).length;
  toast(`✓ 회의 전개 정리 완료<em>논의 ${FRAMES.length} · 주장 ${c('position')} · 반론 ${c('con')} · 확정 ${c('decision')} · 조건부 ${c('conditional')} · 미결 ${c('open')} · 대립 ${EDGES.filter(e => e.kind === 'conflict').length}</em>`, 6000);
  fit(false);
}
function toast(html, ms) {
  const t = $('#toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
$('#pause').onclick = e => {
  paused = !paused; e.currentTarget.textContent = paused ? '▶ 이어보기' : '❚❚ 일시정지';
  if (!paused) play();
};
$('#speed').onclick = e => { speed = { 1: 2, 2: 4, 4: 1 }[speed]; e.currentTarget.textContent = speed + '×'; };
$('#replay').onclick = () => {
  clearTimeout(timer); step = 0; paused = false; $('#pause').textContent = '❚❚ 일시정지';
  NODES.forEach(n => n.dom.classList.remove('in', 'live', 'playing', 'sel'));
  FRAMES.forEach(f => f.dom.classList.remove('in'));
  EDGES.forEach(e => { e.path.classList.remove('on'); if (e.text) e.text.classList.remove('on'); });
  fit(true); play();
};
document.querySelectorAll('.seg2 button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg2 button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('view-cards', b.dataset.view === 'cards');
});

/* ================= 9. 노드 ↔ 원문 ================= */
function selectNode(n) {
  selected = n;
  NODES.forEach(o => o.dom.classList.toggle('sel', o === n));
  const [a, b] = n.at && n.at.length === 2 ? n.at : [n.t, n.t + 45];
  highlightRange(a, b, false);
  if (!document.body.classList.contains('view-cards') && n.dom.classList.contains('in')) centerOn(n);
}
function highlightRange(a, b, fromFun) {
  let first = null;
  [...$('#tr').children].forEach((d, i) => {
    const on = TRANS[i].t >= a && TRANS[i].t < b;
    d.classList.toggle('src', on);
    if (on && !first) first = d;
  });
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (innerWidth <= 900) showTab('src');
  seekTo(a, true);
  if (audioOK) au.play().catch(() => {});
  if (fromFun) NODES.forEach(o => o.dom.classList.remove('sel'));
}

/* ================= 10. 팬 · 줌 ================= */
const vp = $('#vp'), cv = $('#cv');
function apply() {
  cv.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  $('#zlv').textContent = Math.round(view.z * 100) + '%';
  cv.classList.toggle('far', view.z < .52 && view.z >= LOD);
  cv.classList.toggle('lod', view.z < LOD);
}
function zoomAt(cx, cy, nz) {
  nz = Math.min(1.6, Math.max(.06, nz));
  view.x = cx - (cx - view.x) * (nz / view.z);
  view.y = cy - (cy - view.y) * (nz / view.z);
  view.z = nz; apply();
}
function fit(initial) {
  const r = vp.getBoundingClientRect(), padT = 92, padB = 62, padX = 26;
  const aw = r.width - padX * 2, ah = r.height - padT - padB;
  if (initial && FRAMES.length) {
    view.z = .72;
    view.x = padX - (FRAMES[0].x + OX) * view.z + 20;
    view.y = padT + 20 - (FRAMES[0].y + OY) * view.z;
  } else {
    view.z = Math.max(.06, Math.min(1, Math.min(aw / bounds.w, ah / bounds.h)));
    view.x = padX - bounds.x0 * view.z + (aw - bounds.w * view.z) / 2;
    view.y = padT - bounds.y0 * view.z + (ah - bounds.h * view.z) / 2;
  }
  apply();
}
function ensureVisible(x, y, w, h) {
  const r = vp.getBoundingClientRect();
  const sx = (x + OX) * view.z + view.x, sy = (y + OY) * view.z + view.y;
  const sw = w * view.z, sh = h * view.z;
  const mx = Math.min(200, r.width * .2), my = Math.min(140, r.height * .18);
  let need = false;
  if (sx < mx) { view.x += mx - sx; need = true; } else if (sx + sw > r.width - mx) { view.x -= sx + sw - (r.width - mx); need = true; }
  if (sy < my + 60) { view.y += my + 60 - sy; need = true; } else if (sy + sh > r.height - my) { view.y -= sy + sh - (r.height - my); need = true; }
  if (need) { cv.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)'; apply(); setTimeout(() => cv.style.transition = '', 520); }
}
function centerOn(n) {
  const r = vp.getBoundingClientRect();
  if (view.z < LOD) view.z = .7;
  view.x = r.width / 2 - (n.x + OX + 120) * view.z;
  view.y = r.height / 2 - (n.y + OY + 55) * view.z;
  cv.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)'; apply();
  setTimeout(() => cv.style.transition = '', 380);
}
$('#zin').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.z * 1.3); };
$('#zout').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.z / 1.3); };
$('#zfit').onclick = () => fit(false);

let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.node,.zoom,.legend')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, id: e.pointerId };
  vp.setPointerCapture(e.pointerId); vp.classList.add('grab');
});
vp.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); apply();
});
['pointerup', 'pointercancel'].forEach(ev => vp.addEventListener(ev, () => { drag = null; vp.classList.remove('grab'); }));
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  if (e.ctrlKey || e.metaKey) zoomAt(cx, cy, view.z * Math.exp(-e.deltaY / 220));
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });
const pts = new Map();
vp.addEventListener('pointerdown', e => pts.set(e.pointerId, e));
vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  if (pts.size === 2) {
    drag = null;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (vp._pd) { const r = vp.getBoundingClientRect();
      zoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, view.z * d / vp._pd); }
    vp._pd = d;
  }
});
['pointerup', 'pointercancel'].forEach(ev => vp.addEventListener(ev, e => { pts.delete(e.pointerId); if (pts.size < 2) vp._pd = 0; }));

/* ================= 11. 원문 ================= */
const AVCOLOR = ['#2f7d63', '#4a6da8', '#8a5a86', '#a8703c', '#5f6b7a', '#3f7d8a'];
function renderTranscript() {
  const w = $('#tr'); w.textContent = '';
  const funAt = new Set(FUN.map(f => f.i));
  TRANS.forEach((s, i) => {
    const d = el('div', 'seg'); d.id = 'seg' + i;
    if (funAt.has(i)) d.classList.add('fun');
    const av = el('span', 'av', esc(s.s.slice(0, 1)));
    av.style.setProperty('--c', avatar[s.s] || '#5f6b7a');
    const body = el('div');
    body.append(el('div', 'seg-h', `<b>${esc(s.s)}</b><time>${mmss(s.t)}</time>`
      + (funAt.has(i) ? '<span class="fb">😄 하이라이트</span>' : '')));
    s.l.forEach(line => body.append(el('p', null, esc(line))));
    d.append(av, body);
    d.onclick = () => { seekTo(s.t, true); if (audioOK) au.play().catch(() => {}); };
    w.append(d);
  });
  applySearch();
}
$('#q').oninput = applySearch;
function applySearch() {
  const q = $('#q').value.trim(), segs = $('#tr').children;
  if (!q) {
    [...segs].forEach((d, i) => { d.hidden = false; paint(d, TRANS[i], null); });
    $('#qn').textContent = ''; return;
  }
  let n = 0;
  [...segs].forEach((d, i) => {
    const hit = TRANS[i].l.some(l => l.includes(q)) || TRANS[i].s.includes(q);
    d.hidden = !hit; if (hit) { n++; paint(d, TRANS[i], q); }
  });
  $('#qn').textContent = n + '건';
}
function paint(d, seg, q) {
  const ps = d.querySelectorAll('p');
  seg.l.forEach((line, i) => { ps[i].innerHTML = q ? esc(line).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(line); });
}

/* ================= 12. 오디오 ================= */
function seekTo(t, quiet) {
  t = Math.max(0, t);
  if (audioOK) au.currentTime = t;
  mark(t, true, quiet);
}
$('#pp').onclick = () => { if (audioOK) au.paused ? au.play() : au.pause(); };
au.onplay = () => $('#pp').textContent = '❚❚';
au.onpause = () => $('#pp').textContent = '▶';
au.onloadedmetadata = () => {
  $('#dur').textContent = mmss(au.duration);
  audioOK = true; document.body.classList.remove('noaudio'); offsets(); marks();
};
$('#bar').onclick = e => {
  const b = e.currentTarget.getBoundingClientRect();
  seekTo((e.clientX - b.left) / b.width * (au.duration || dur()));
};
au.ontimeupdate = () => mark(au.currentTime, false);
const dur = () => au.duration || (TRANS.length ? TRANS[TRANS.length - 1].t + 30 : 1);
function marks() {
  const w = $('#marks'); w.textContent = '';
  FUN.forEach(f => { const d = el('div', 'mk'); d.style.left = (f.t / dur() * 100) + '%';
    d.title = '웃음이 몰린 순간 · ' + mmss(f.t); w.append(d); });
}
function mark(t, force, quiet) {
  $('#fill').style.width = (t / dur() * 100) + '%';
  $('#cur').textContent = mmss(t);
  let lo = 0, hi = SEGN.length - 1, i = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (SEGN[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
  const seg = TRANS[i];
  if (i !== curSeg || force) {
    const prev = document.getElementById('seg' + curSeg); if (prev) prev.classList.remove('cur');
    curSeg = i;
    const now = document.getElementById('seg' + i);
    if (now) {
      now.classList.add('cur');
      if (!quiet) now.scrollIntoView({ block: 'center', behavior: force ? 'auto' : 'smooth' });
      $('#now').textContent = `${seg.s} · ${seg.l[0] || ''}`;
    }
    let hit = null;
    NODES.forEach(n => {
      const on = n.at && n.at.length === 2 && t >= n.at[0] && t < n.at[1];
      n.dom.classList.toggle('playing', !!on);
      if (on && !hit) hit = n;
    });
    if (hit && !quiet && hit !== selected && hit.dom.classList.contains('in')) centerOn(hit);
  }
  /* 문장 단위 하이라이트 */
  if (seg && seg.lt) {
    let li = seg.lt.findIndex(r => t >= r[0] && t < r[1]);
    if (li < 0) li = t >= seg.t ? seg.lt.length - 1 : 0;
    const box = document.getElementById('seg' + i);
    const p = box && box.querySelectorAll('p')[li];
    if (p !== curLine) { if (curLine) curLine.classList.remove('lit'); if (p) p.classList.add('lit'); curLine = p; }
  }
}

/* ================= 13. 파일 받기 ================= */
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); take([...e.dataTransfer.files]); });
$('#pick').onclick = () => $('#fi').click();
$('#newfile').onclick = () => document.body.classList.add('idle');
$('#fi').onchange = e => take([...e.target.files]);
$('#sample').onclick = () => load('data/2026-06-15.ibis.json');

async function load(url) {
  const map = await (await fetch(url)).json();
  const segs = (await (await fetch(map.meeting.transcript)).json()).segments;
  start(segs, map, map.meeting.title + ' · ' + map.meeting.date, map.meeting.audio);
}
async function take(files) {
  const txt = files.find(f => /\.(txt|json)$/i.test(f.name) && !/\.ibis\.json$/i.test(f.name));
  const snd = files.find(f => /^audio\//.test(f.type) || /\.(m4a|mp3|wav|aac|ogg)$/i.test(f.name));
  const mapf = files.find(f => /\.ibis\.json$/i.test(f.name));
  if (!txt) { toast(snd ? '음성만으로는 내용을 읽지 못합니다 · 전사 txt를 함께 넣어주세요' : '전사 .txt 파일을 넣어주세요', 4200); return; }
  let segs, map = null;
  try {
    const raw = await txt.text();
    segs = /\.json$/i.test(txt.name) ? (JSON.parse(raw).segments || JSON.parse(raw)) : parseTxt(raw);
  } catch { segs = null; }
  if (!segs || segs.length < 5) { toast('발언을 읽지 못했습니다 · “이름 00:00” 형식인지 확인해주세요', 4200); return; }
  if (mapf) { try { map = JSON.parse(await mapf.text()); } catch {} }
  if (!map) {
    const base = txt.name.replace(/\.(txt|json)$/i, '').replace(/\.transcript$/i, '');
    try { const r = await fetch(`data/${base}.ibis.json`); if (r.ok) map = await r.json(); } catch {}
  }
  start(segs, map, txt.name, snd ? URL.createObjectURL(snd) : null);
}

function start(segs, map, name, audioSrc) {
  TRANS = segs; SEGN = segs.map(s => s.t); curSeg = -1; curLine = null; selected = null; MAP = map;
  avatar = {}; [...new Set(segs.map(s => s.s))].forEach((p, i) => avatar[p] = AVCOLOR[i % AVCOLOR.length]);
  $('#fname').textContent = name;
  document.body.classList.remove('idle'); drop.classList.remove('over');
  lineTimes(); FUN = funMoments(segs);

  if (map) { const g = build(map); layout(g); render(g); }
  else { NODES = []; EDGES = []; FRAMES = []; REVEAL = []; render({ nodes: [], edges: [], frames: [] }); }
  renderTranscript(); renderCards(); group = 'decision'; renderDigest(); marks();

  audioOK = false; document.body.classList.add('noaudio'); offsets();
  if (audioSrc) { au.src = audioSrc; au.onerror = () => { audioOK = false; document.body.classList.add('noaudio'); offsets(); }; }

  clearTimeout(timer); step = 0; paused = false; $('#pause').textContent = '❚❚ 일시정지';
  if (!map) {
    toast('이 회의의 정리 맵이 없어 원문만 표시합니다 · <b>.ibis.json</b>을 함께 넣어주세요', 6000);
    if (innerWidth <= 900) showTab('src');
    return;
  }
  fit(true);
  toast(map.headline, 4200);
  setTimeout(play, 900);
}

/* ================= 14. 나머지 ================= */
(function resizers() {
  const root = document.documentElement.style;
  const saved = k => localStorage.getItem(k);
  if (saved('mn.rail')) root.setProperty('--rail', saved('mn.rail'));
  if (saved('mn.split')) root.setProperty('--split', saved('mn.split'));
  const drag = (h, move, reset) => {
    h.addEventListener('pointerdown', e => {
      h.setPointerCapture(e.pointerId);
      const mv = ev => move(ev);
      const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
    });
    h.addEventListener('dblclick', reset);
  };
  drag($('#rzx'), e => { const w = Math.min(680, Math.max(280, e.clientX));
    root.setProperty('--rail', w + 'px'); localStorage.setItem('mn.rail', w + 'px'); },
    () => { root.setProperty('--rail', '400px'); localStorage.removeItem('mn.rail'); });
  drag($('#rzy'), e => {
    const box = document.querySelector('.rail').getBoundingClientRect();
    const p = Math.min(78, Math.max(14, (e.clientY - box.top) / box.height * 100));
    root.setProperty('--split', p.toFixed(1) + '%'); localStorage.setItem('mn.split', p.toFixed(1) + '%'); },
    () => { root.setProperty('--split', '44%'); localStorage.removeItem('mn.split'); });
})();
function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.body.classList.toggle('tab-src', name === 'src');
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function offsets() {
  document.documentElement.style.setProperty('--player',
    document.body.classList.contains('noaudio') ? '0px' : '56px');
}
addEventListener('resize', () => apply());
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); audioOK ? (au.paused ? au.play() : au.pause()) : $('#pause').click(); }
  if (e.key === 'ArrowLeft') seekTo((au.currentTime || 0) - 5);
  if (e.key === 'ArrowRight') seekTo((au.currentTime || 0) + 5);
});
offsets();
