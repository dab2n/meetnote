<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>meetnote</title>
<style>
/* 폰트 — 모바일 앱과 같은 SF Pro +KR. 파일은 넣지 않고 설치된 것을 쓴다 */
@font-face{font-family:SFKR;font-weight:400;src:local("SF Pro +KR Display Regular"),local("SFProKR-Regular")}
@font-face{font-family:SFKR;font-weight:500;src:local("SF Pro +KR Display Medium"),local("SFProKR-Medium")}
@font-face{font-family:SFKR;font-weight:600;src:local("SF Pro +KR Display Semibold"),local("SFProKR-Semibold")}
@font-face{font-family:SFKR;font-weight:700;src:local("SF Pro +KR Display Bold"),local("SFProKR-Bold")}
:root{
  --bg:#fcfcfe; --card:#f2f5fa; --card2:#f5f6f8; --chip:#e4eaf2; --line:#dee0e6; --line2:#d7dff1;
  --ink:#050a0a; --ink2:#3b3b3b; --navy:#2d3b48; --dim:#757575; --dim2:#a3a3a3; --dark:#222a2a;
  --blue:#4b87e9; --red:#e0443e; --amber:#d9892b; --green:#2f9e5b; --violet:#8a6fd1; --grey:#8d9299;
  --ease:cubic-bezier(.3,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 SFKR,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
[hidden]{display:none!important}
svg{display:block;flex:none}
.tap{transition:transform .15s,opacity .15s}.tap:active{transform:scale(.97);opacity:.8}

/* ---------- 뼈대: 왼쪽 사이드바 + 본문 ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px;border-right:1px solid #eef0f4;background:var(--bg)}
.proj{position:relative}
.proj>button{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;font-size:22px;font-weight:600;letter-spacing:-.48px;max-width:100%}
.proj>button:hover{background:var(--card)}
.proj>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu{position:absolute;z-index:30;top:46px;left:4px;width:236px;padding:6px;border-radius:16px;background:#fff;
  box-shadow:0 0 0 1px rgba(40,39,51,.06),0 18px 40px rgba(40,39,51,.14);animation:pop .22s var(--ease)}
.pmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.pmenu button:hover{background:var(--card)}
.pmenu button.on{background:var(--chip);color:var(--navy);font-weight:600}
.pmenu i{font-style:normal;font-size:12px;color:var(--dim2)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:44px;color:var(--dim);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--card)}
.nav a.on{background:var(--chip);color:var(--navy);font-weight:600}
.slist{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:2px;scrollbar-width:none}
.slist h6{font-size:12px;font-weight:500;color:var(--dim2);padding:0 12px 6px}
.slist a{display:block;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink2)}
.slist a:hover{background:var(--card)}
.slist a.on{background:var(--card);color:var(--ink);font-weight:600}
.slist a b{display:block;font-weight:inherit;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist a time{font-size:11.5px;color:var(--dim2)}
.new{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;background:var(--dark);color:#fff;font-weight:600;text-decoration:none}
.new:hover{background:var(--ink)}
main{min-width:0;padding:34px 40px 140px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- 공통 조각 ---------- */
.h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.3}
.sub{margin-top:6px;color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sec{margin-top:40px}
.sec>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec>header h2{font-size:16px;font-weight:500;color:var(--dim);letter-spacing:-.16px}
.sec>header h2 b{margin-left:6px;color:var(--ink2);font-weight:600}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{height:32px;padding:0 14px;border-radius:99px;color:var(--dim2);font-size:13px;font-weight:500}
.pills button:hover{color:var(--ink2)}
.pills button.on{background:var(--chip);color:var(--navy);font-weight:600}
.kd{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:var(--dark);color:#fff;font-size:11.5px;font-weight:600}
.kd+.kd{background:var(--chip);color:var(--navy)}
.st{font-size:11.5px;font-weight:600;white-space:nowrap;font-style:normal}
.st.decision{color:var(--blue)} .st.conditional{color:var(--amber)} .st.open{color:var(--grey)}
.empty{padding:26px;border-radius:16px;background:var(--card2);color:var(--dim2);text-align:center;font-size:13px}

/* 할 일 카드 — 모바일 홈 '나의 할 일'의 방사형 그라데이션 */
.todos{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.todo{scroll-snap-align:start;height:224px;display:flex;flex-direction:column;justify-content:space-between;padding:20px;border-radius:24px;
  border:1.5px solid rgba(255,255,255,.2);text-align:left;transition:transform .25s var(--ease),box-shadow .25s}
.todo:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(40,39,51,.1)}
.todo .top{display:flex;justify-content:space-between;align-items:flex-start;min-height:28px;font-size:12px;font-weight:500;color:var(--ink2)}
.todo .due{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:600}
.todo .top em{font-style:normal;color:rgba(5,10,10,.45)}
.todo{cursor:pointer}
.tool{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;border:.6px solid #fff;box-shadow:0 1px 4px rgba(40,39,51,.12);transition:transform .2s var(--ease)}
.tool:hover{transform:scale(1.12)}
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mt{display:flex;gap:4px;margin-top:4px}
.mt a{display:grid;place-items:center;width:40px;height:32px;border-radius:9px;transition:background .2s}
.mt a:hover{background:var(--card)}
.mt a.on{background:var(--dark)}
.mt img{width:20px;height:20px}
.meis{display:inline-flex;align-items:center;gap:5px}
.avi{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;color:#fff;font-size:11px;font-weight:600;flex:none;box-shadow:0 0 0 1.5px #fff}
.stk{display:inline-flex;margin-right:6px}.stk .avi+.avi{margin-left:-8px}
.tg{margin:-4px 0 12px}
.tg button{display:inline-flex;align-items:center;height:44px;padding:0 14px 0 8px;color:var(--dim2)}
.tg button:not(.on) .stk{opacity:.5}
.tg button.on{background:var(--card);color:var(--ink2);font-weight:500}
.cs .c .by{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:4px}
img.av{object-fit:cover}
.todo h3{margin-top:14px;font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.todo .bt{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;margin:0 -8px -4px;border-radius:10px;font-size:12px;font-weight:500;color:var(--ink2);text-align:left}
.todo .bt:hover{background:rgba(255,255,255,.5)}
.todo .bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.todo .bt i{font-style:normal;white-space:nowrap}
.todo .bt svg{margin-left:auto}
.g0{background:radial-gradient(60% 60% at 50% 40%,#87d1ff 0%,#aedeff 49%,#d6ebff 98%)}
.g1{background:radial-gradient(55% 55% at 50% 50%,#d8be49 0%,#e5d872 50%,#f1f29a 100%)}
.g2{background:radial-gradient(85% 70% at 50% 45%,#43bde6 25%,#5ec9ea 39%,#79d5ee 52%,#afecf5 79%,#fefde7 97%)}
.g3{background:radial-gradient(85% 70% at 50% 45%,#ff9e80 25%,#ffb696 45%,#ffd2ba 65%,#ffe8d6 82%,#fef8ec 97%)}
.g4{background:radial-gradient(80% 70% at 50% 46%,#cad9df 62%,#ece4e4 87%,#fdf3e6 100%)}
.g5{background:radial-gradient(80% 70% at 50% 46%,#d6d0e8 62%,#e8e2f0 87%,#f8f3fa 100%)}
.own{font-style:normal;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:600}
.own.none{background:transparent;border:1px dashed rgba(5,10,10,.2);color:rgba(5,10,10,.5);font-weight:500}

/* 리스트 카드 — 회의·안건 */
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border-radius:16px;background:var(--card);text-align:left;text-decoration:none;color:inherit;transition:background .2s}
.row:hover{background:var(--chip)}
.row .tx{flex:1;min-width:0}
.row .meta{font-size:12.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.row .meta i{font-style:normal;color:var(--dim2)}
.row h3{margin-top:4px;font-size:16px;font-weight:500;letter-spacing:-.2px}
.row p{margin-top:2px;font-size:13px;color:var(--dim)}
.row .nw{font-size:13px;font-weight:600;color:var(--blue)}
.row .cm{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.grid2.fold>:nth-child(n+7){display:none}
.more{margin-top:10px;width:100%;height:44px;border-radius:14px;background:var(--card2);color:var(--dim);font-size:13px;font-weight:500}
.more:hover{background:var(--chip);color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.grp+.grp{margin-top:28px}
.grp h4{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.grp h4 i{font-style:normal;font-weight:500;color:var(--dim2)}

/* ---------- 회의 페이지 ---------- */
.mhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:2px;margin:-6px 0 12px -8px;padding:6px 8px;border-radius:10px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{background:var(--card)}
.player{display:flex;align-items:center;gap:8px;height:44px;padding:4px 16px 4px 4px;border-radius:99px;background:linear-gradient(90deg,#e4eaf2,#f5f8ff);min-width:260px}
.player button{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(40,39,51,.1)}
.player time{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.player .bar{flex:1;height:3px;border-radius:2px;background:#d4dbe6;position:relative;cursor:pointer}
.player .bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--dark)}
.tabs{margin-top:22px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.mgrid{margin-top:18px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;align-items:start}
.only-narrow{display:none}
.mgrid.solo{grid-template-columns:minmax(0,1fr)}
/* 요약 시트 — 모바일 요약 모달의 그라데이션 */
.sheet{border-radius:24px;padding:28px 28px 30px;background:linear-gradient(180deg,#e4eaf2 0%,#e4eaf2 70%,#fdf8f8 100%);box-shadow:0 -10px 30px rgba(40,39,51,.06)}
.sheet h5{font-size:16px;font-weight:600;letter-spacing:-.16px;margin-bottom:12px}
.sheet hr{border:0;border-top:1px solid #cfd8ea;margin:26px 0}
.brief p{font-size:16px;line-height:1.65;color:var(--ink2)}
.brief .kinds{display:flex;gap:4px;margin-bottom:10px}
.focus{margin-top:14px;display:grid;gap:2px}
.focus button{display:flex;align-items:baseline;gap:10px;padding:7px 10px;margin:0 -10px;border-radius:10px;text-align:left;font-size:13.5px}
.focus button:hover{background:rgba(255,255,255,.55)}
.focus b{font-size:11.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.focus span{flex:1}
.brief .line{font-size:17px;font-weight:600;line-height:1.6;letter-spacing:-.2px}
.brief .story{margin-top:12px;display:grid;gap:9px}
.brief .story p{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.sheet h5 em{margin-left:6px;font-style:normal;font-size:12px;font-weight:500;color:var(--dim)}
.groups{display:grid;gap:22px}
.gp{padding-top:4px}
.gp h6{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.gp h6 i{display:grid;place-items:center;min-width:32px;height:32px;padding:0 10px;border-radius:10px;background:var(--c,#c7d3e4);color:var(--ink);font-style:normal;font-size:13px;font-weight:700}
.gp h6 b{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--dim2)}
.gp+.gp{border-top:1px solid #cfd8ea;padding-top:22px}
.iss{padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(40,39,51,.04)}
.iss+.iss{margin-top:10px}
/* 쟁점 문장 — 이 카드에서 가장 크고 진하게, 왼쪽에 색 막대 */
.qq{cursor:pointer;padding-left:14px;border-left:3px solid var(--c,#c7d3e4)}
.qq h4{font-size:18px;font-weight:700;line-height:1.5;letter-spacing:-.3px}
.qq:hover h4{text-decoration:underline;text-decoration-color:rgba(5,10,10,.18);text-underline-offset:4px}
.qm{margin-top:5px;display:flex;gap:10px;font-size:11.5px;color:var(--dim2)}
.qm time{font-variant-numeric:tabular-nums}
.flow{margin-top:12px;display:grid;gap:8px;padding-left:17px}
.flow p{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.75;color:var(--ink2);cursor:pointer;padding:4px 8px;margin:-4px -8px;border-radius:10px}
.flow p:hover{background:rgba(255,255,255,.7)}
.flow p span{flex:1}
.flow p time{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.flow p:hover time{opacity:1}
.res{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff;display:grid;gap:3px;cursor:pointer;box-shadow:0 0 0 1px rgba(40,39,51,.04)}
.res:hover{box-shadow:0 0 0 1px rgba(40,39,51,.1)}
.res em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.res b{font-size:15px;font-weight:600;line-height:1.55;letter-spacing:-.2px}
.res.none{color:var(--dim)}
.fx{margin-top:10px;display:flex;gap:6px;align-items:center}
.cmb{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:99px;font-size:12px;color:var(--dim);background:rgba(255,255,255,.5)}
.cmb:hover{background:#fff;color:var(--ink2)}
.tlist{display:grid;gap:2px}
.tlist button{display:flex;align-items:baseline;gap:10px;padding:9px 10px;margin:0 -10px;border-radius:10px;text-align:left}
.tlist button:hover{background:rgba(255,255,255,.55)}
.tlist span{flex:1;font-size:14.5px;font-weight:500}
.tlist .own{background:#fff;font-size:11.5px}
.tlist time{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.carry{display:grid;gap:6px}
.carry div{display:flex;gap:10px;font-size:14px} .carry i{font-style:normal;font-size:11.5px;color:var(--dim2);white-space:nowrap;margin-top:2px}

/* 원문 */
.tr{position:sticky;top:20px;height:calc(100vh - 40px);display:flex;flex-direction:column;border-radius:24px;background:#fff;box-shadow:0 0 0 1px #eef0f4}
.mgrid.solo .tr{position:static;height:auto;box-shadow:none;background:transparent}
.trh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid #f0f2f6}
.trh h5{font-size:14px;font-weight:600;flex:1}
.srch{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:99px;background:var(--card);flex:1;max-width:260px}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13px}
.srch i{font-style:normal;font-size:11.5px;color:var(--dim2);white-space:nowrap}
.segs{flex:1;overflow:auto;padding:8px 16px 40px;scrollbar-width:thin}
.mgrid.solo .segs{padding:8px 0 40px}
.seg{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;transition:opacity .3s}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:#fff}
.seg .who{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.seg .who button{font-size:12.5px;font-weight:400;color:var(--dim2);font-variant-numeric:tabular-nums}
.seg .who button:hover{color:var(--blue)}
.seg p{font-size:14px;line-height:1.6;color:var(--ink2)}
.seg.now .who button{color:var(--blue);font-weight:600}
.segs.dim .seg:not(.src){opacity:.35}
/* 쟁점을 누르면 그 구간이 왼쪽→오른쪽으로 칠해진다 — 모바일과 같은 그라데이션 */
.seg.src p{background-image:linear-gradient(90deg,#fa0004 27%,#e5db69 91%,#9de3ff),linear-gradient(#3b3b3b,#3b3b3b);background-repeat:no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep .8s var(--ease) both}
@keyframes sweep{from{background-size:0% 100%,100% 100%}to{background-size:100% 100%,100% 100%}}
mark{background:#fffbc9;color:inherit;border-radius:2px}
mark.on{background:#ffe27a;box-shadow:0 0 0 1.5px #ffe27a}
mark.ev{background:linear-gradient(transparent 55%,#ffe27a 55%);box-shadow:none}
.map{margin-top:18px;height:calc(100vh - 210px);min-height:520px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px #eef0f4;background:#fff}
.map iframe{width:100%;height:100%;border:0}

/* 댓글 시트 — 웹에서는 오른쪽에서 */
.dim-bg{position:fixed;inset:0;z-index:50;background:rgba(5,10,10,.18);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.cs{position:fixed;z-index:51;top:12px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));display:flex;flex-direction:column;border-radius:24px;
  background:linear-gradient(180deg,#e4eaf2 0%,#e4eaf2 70%,#fdf8f8 100%);box-shadow:0 20px 50px rgba(40,39,51,.18);animation:slide .4s var(--ease) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.cs header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 6px;font-size:15px;font-weight:600}
.cs .ctx{padding:6px 22px 16px}
.cs .ctx small{font-size:12px;color:var(--dim)} .cs .ctx h3{margin-top:2px;font-size:18px;font-weight:600;letter-spacing:-.3px}
.cs .ctx a{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--blue);text-decoration:none}
.cs .list{flex:1;overflow:auto;padding:0 22px;display:grid;align-content:start;gap:8px}
.cs .c{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;position:relative}
.cs .c time{display:block;margin-top:2px;font-size:11.5px;color:var(--dim2)}
.cs .c button{position:absolute;top:8px;right:10px;color:var(--dim2);font-size:12px}
.cs form{display:flex;gap:8px;padding:14px 16px 16px}
.cs form input{flex:1;height:44px;padding:0 16px;border-radius:99px;border:0;background:#fff;outline:none;font-size:14px}

@keyframes coverDown{from{clip-path:inset(0 0 100% 0 round 0 0 40px 40px)}to{clip-path:inset(0 0 0 0)}}
@keyframes coverUp{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0 round 0 0 40px 40px)}}

<body>
<div class="app">
  <aside class="side">
    <div class="proj"><button id="pbtn" class="tap"><span id="pname">…</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="pmenu" id="pmenu" hidden></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="slist" id="slist"></div>
    <a class="new tap" href="map.html" title="전사 파일을 넣어 새 회의를 정리합니다">＋ 새 회의 정리</a>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="bnav" id="bnav"></div>

<script src="ut.js"></script>
<script>
/* ================= 0. 조각 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const secs = v => { if (typeof v === 'number') return v; const p = String(v || '0').split(':').map(Number); return p.reduce((a, b) => a * 60 + b, 0); };
const mmss = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const dur = d => { const s = secs(d), h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const dkey = d => { const [y, m, dd] = String(d || '').split('.').map(Number); return (y || 0) * 1e4 + (m || 0) * 100 + (dd || 0); };
const fdate = d => { const [y, m, dd] = String(d || '').split('.').map(Number); if (!y) return d || '';
  const w = '일월화수목금토'[new Date(y, m - 1, dd).getDay()]; return `${y}.${String(m).padStart(2, '0')}.${String(dd).padStart(2, '0')} ${w}`; };
const enc = u => u.split('/').map(encodeURIComponent).join('/');
const NOCACHE = { cache: 'no-store' };
const LOCALSRV = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
const KO = { issue: '쟁점', position: '주장', pro: '근거', con: '반론', concern: '우려', condition: '조건', open: '미결', decision: '확정', conditional: '조건부' };
const TAGC = ['#c7d3e4', '#d5e3d0', '#f1e1b8', '#b8d4f1', '#e7d3e6', '#dcd6ef'];
const AVC = ['#f18fd8', '#6fa8f5', '#7cc49a', '#e8b04b', '#9a8ce6', '#ef8a74', '#5cc3d9', '#a3a9b0'];
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const I = {
  home: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  folder: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  cmt: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 3.5c3.9 0 7 2.6 7 5.8s-3.1 5.8-7 5.8c-.8 0-1.6-.1-2.3-.3L4 16.5l.9-3.1C3.7 12.3 3 10.9 3 9.3 3 6.1 6.1 3.5 10 3.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  arrow: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m-4-4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  play: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
  pause: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zm5 0h3v11H9z" fill="currentColor"/></svg>',
  mic: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="7" y="2.5" width="6" height="10" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 16V4m-5 5l5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* ================= 1. 데이터 ================= */
const D = { index: [], projects: [], maps: {}, trans: {}, alias: null };
/* 이름을 바꾸면 조사도 새 이름에 맞춰 고친다 (일여는 → 하린은) */
const reEsc = escRe;
const JOSA = [['으로', '로'], ['이랑', '랑'], ['이라', '라'], ['이에요', '예요'], ['이었', '였'], ['은', '는'], ['이', '가'], ['을', '를'], ['과', '와'], ['아', '야']];
/* 받침이 있으면 은·이·을·으로. 영문으로 끝나면 읽을 때 모음으로 끝나는 쪽이 자연스럽다(Project → 프로젝트) */
const hasJong = s => { const c = s.charCodeAt(s.length - 1);
  return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : false; };
function aliasRules(cfg) {
  const keep = (cfg.keep || []).slice().sort((a, b) => b.length - a.length);
  const pairs = Object.entries(cfg.aliases || {}).sort((a, b) => b[0].length - a[0].length);
  const tail = JOSA.flat().sort((a, b) => b.length - a.length).map(reEsc).join('|');
  return { keep, subs: pairs.map(([from, to]) => [new RegExp(reEsc(from) + '(' + tail + ')?', 'g'), to]) };
}
function applyAlias(text, R) {
  if (!R || !R.subs.length) return text;
  const box = [];
  R.keep.forEach(k => { text = text.split(k).join('\u0000' + (box.push(k) - 1) + '\u0000'); });
  R.subs.forEach(([re, to]) => {
    text = text.replace(re, (m, j) => {
      if (!j) return to;
      const pair = JOSA.find(p => p.includes(j));
      return to + (pair ? pair[hasJong(to) ? 0 : 1] : j);
    });
  });
  return text.replace(/\u0000(\d+)\u0000/g, (m, i) => box[+i]);
}
/* 전사문에 나온 실제 이름·브랜드는 화면에 쓰지 않는다 — 불러올 때 바꿔 둔다 (data/people.json) */
const alias = o => (D.alias ? JSON.parse(applyAlias(JSON.stringify(o), D.alias)) : o);
async function getMap(m) {
  if (!D.maps[m.id]) D.maps[m.id] = fetch(enc(m.map), NOCACHE).then(r => r.json()).then(alias);
  return D.maps[m.id];
}
async function getTrans(m) {
  if (!D.trans[m.id]) D.trans[m.id] = getMap(m).then(async map => map.segments
    || alias((await (await fetch(enc(map.meeting.transcript), NOCACHE)).json()).segments));
  return D.trans[m.id];
}
const nfc = x => String(x).normalize('NFC');           /* 맥 파일명은 NFD 로 온다 */
const meetingOf = id => D.index.find(m => nfc(m.id) === nfc(id));
/* 회의 이름 — 프로젝트에 별칭이 있으면 그 이름으로 보여준다 (모바일 디자인과 같게) */
const titleOf = (m, p) => { const t = ((p || CUR.p || {}).titles) || {}; return t[nfc(m.id)] || t[m.id] || m.title; };
const projOf = id => D.projects.find(p => p.meetings.some(x => nfc(x) === nfc(id))) || D.projects[0];
const inProj = p => p.meetings.map(meetingOf).filter(Boolean).sort((a, b) => dkey(b.date) - dkey(a.date));
/* 왼쪽 카드·스레드와 같은 메모 저장소를 쓴다 (map.html 과 공유) */
const notes = id => store.get('mn.local.' + id) || { edits: {}, notes: {} };
const cmts = (id, key) => ((notes(id).notes[key] || {}).cs || []);
function putCmts(id, key, cs) {
  const L = notes(id); L.notes[key] = Object.assign({ rx: {}, cs: [] }, L.notes[key], { cs });
  if (!cs.length && !Object.keys(L.notes[key].rx).length) delete L.notes[key];
  store.set('mn.local.' + id, L);
}

async function boot() {
  try { D.alias = aliasRules(await (await fetch('data/people.json', NOCACHE)).json()); } catch {}
  try { D.index = (await (await fetch('data/index.json', NOCACHE)).json()).meetings || []; } catch {}
  try { D.projects = (await (await fetch('data/projects.json', NOCACHE)).json()).projects || []; } catch {}
  D.projects = D.projects.map(p => ({ ...p, meetings: p.meetings.map(meetingOf).filter(Boolean).map(m => m.id) }));
  const known = new Set(D.projects.flatMap(p => p.meetings));
  const rest = D.index.filter(m => !known.has(m.id)).map(m => m.id);
  if (rest.length) D.projects.push({ id: 'etc', name: '기타 회의', meetings: rest });
  D.projects = D.projects.filter(p => p.meetings.length);
  addEventListener('hashchange', route);
  route();
}

/* ================= 2. 길찾기 ================= */
/* 사용성 테스트 기록용 화면 이름 (ut.js) */
const screenName = () => ASK ? 'ask'
  : CUR.kind === 'home' ? (CUR.mode === 'team' ? 'home_team' : 'home_my')
  : CUR.kind === 'list' ? (CUR.by === 'agenda' ? 'list_agenda' : 'list_new')
  : CUR.kind === 'meeting' ? 'meeting_' + (['src', 'map'].includes(CUR.tab) ? CUR.tab : 'sum') : 'home_my';
const utNav = () => window.UT && UT.nav(screenName(), CUR.kind === 'meeting' ? CUR.id : '');
const utAct = (t, l) => window.UT && UT.act(t, l);
/* #/p/<프로젝트>  ·  #/p/<프로젝트>/list  ·  #/m/<회의>/<요약|원문|맵> */
let CUR = {};
function route() {
  const [, kind, a, b] = decodeURIComponent(location.hash).split('/');
  let p, page;
  if (kind === 'm' && meetingOf(a)) { p = projOf(a); page = { kind: 'meeting', id: meetingOf(a).id, tab: b || 'sum' }; }
  else {
    p = D.projects.find(x => x.id === a) || D.projects.find(x => x.id === store.get('mn.project')) || D.projects[0];
    page = { kind: b === 'list' ? 'list' : 'home', mode: b === 'team' ? 'team' : 'my' };
  }
  if (!p) { $('#view').innerHTML = '<div class="empty">아직 정리된 회의가 없어요. 왼쪽 아래 ＋ 새 회의 정리로 시작하세요.</div>'; return; }
  store.set('mn.project', p.id);
  const same = CUR.p === p && CUR.kind === page.kind && CUR.id === page.id && CUR.mode === page.mode;
  CUR = { p, ...page };
  side();
  if (same && page.kind === 'meeting') return meetingTab(page.tab);
  scrollTo(0, 0);
  ({ home, list, meeting: meetingPage })[page.kind](p, page);
  if (page.kind !== 'meeting') utNav();      /* 회의는 탭이 정해진 뒤 meetingTab 에서 기록한다 */
}
const go = h => { location.hash = h; };

function side() {
  const { p } = CUR;
  $('#pname').textContent = p.name;
  const menu = $('#pmenu');
  menu.innerHTML = D.projects.map(x => `<button class="${x === p ? 'on' : ''}" data-p="${esc(x.id)}">${esc(x.name)}<i>회의 ${x.meetings.length}</i></button>`).join('');
  menu.onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; menu.hidden = true; go('#/p/' + b.dataset.p); };
  $('#pbtn').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  const nav = [['home', '홈', `#/p/${p.id}`, I.home], ['list', '회의록', `#/p/${p.id}/list`, I.folder]];
  const on = k => CUR.kind === k || (k === 'list' && CUR.kind === 'meeting');
  $('#nav').innerHTML = nav.map(([k, t, h, ic]) => `<a href="${esc(h)}" class="tap ${on(k) ? 'on' : ''}">${ic}${t}</a>`).join('');
  $('#bnav').innerHTML = `<nav>${nav.map(([k, t, h, ic]) => `<a href="${esc(h)}" class="${on(k) ? 'on' : ''}">${ic}${t}</a>`).join('')}</nav>
    <button class="fab tap" id="fab" aria-label="물어보기">✦</button>`;
  $('#fab').onclick = e => openAsk(e.currentTarget);
  $('#slist').innerHTML = `<h6>회의</h6>` + inProj(p).map(m =>
    `<a href="#/m/${esc(m.id)}" class="${CUR.id === m.id ? 'on' : ''}"><b>${esc(titleOf(m, p))}</b><time>${esc(fdate(m.date))}</time></a>`).join('');
}
addEventListener('click', e => { if (!e.target.closest('.proj')) $('#pmenu').hidden = true; });

/* ================= 3. 홈 — 다음 해야 할 일 · 미해결 안건 · 최근 회의 ================= */
/* 나 · 팀 — 모바일 홈처럼 나뉜다. projects.json 의 me · teams 가 있을 때만 */
const avatarOf = (p, name) => (p && p.avatars || {})[name];
function av(p, name, size = 28) {
  const src = avatarOf(p, name);
  return src ? `<img class="avi" src="${esc(src)}" alt="${esc(name)}" style="width:${size}px;height:${size}px">`
    : `<span class="avi" style="width:${size}px;height:${size}px;background:${AVC[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length]}">${esc([...name][0] || '?')}</span>`;
}
/* 할 일이 어느 팀 것인가 — 사람 이름, 파트 이름(ID·UX), 전원 */
const teamsOf = (p, owner) => (p.teams || []).filter(t => owner === '전원' || owner === t.part || owner === t.name || t.members.includes(owner));
/* 나의 할 일 = 내 이름 · 전원 · 우리 팀 단위(UX 처럼 파트로 맡긴 것). 같은 팀 다른 사람 이름으로 맡은 건 빼고 */
const isMine = (p, d) => { const t = (p.teams || []).find(x => x.members.includes(p.me));
  return d.owner === p.me || d.owner === '전원' || !!t && (d.owner === t.part || d.owner === t.name); };

/* 업무 도구 — 할 일이 특정 도구를 떠올리게 하면 카드 오른쪽 위에 그 로고를 둥글게 단다. 누르면 그 도구가 열린다 */
const TOOLS = [
  { re: /메일|튜터님께|요청 보내|연락/, name: 'Gmail', url: 'https://mail.google.com/', logo: '<img src="assets/gmail.png" alt="" style="width:16px;height:13px;object-fit:contain">' },
  { re: /장표|슬라이드|발표 자료/, name: 'Google Slides', url: 'https://docs.google.com/presentation/',
    logo: '<svg width="11" height="14" viewBox="0 0 16 20"><path d="M2 0h8l6 6v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2z" fill="#f4b400"/><path d="M10 0l6 6h-4a2 2 0 0 1-2-2z" fill="#f8d56b"/><rect x="3.5" y="9" width="9" height="6" rx=".8" fill="none" stroke="#fff" stroke-width="1.5"/></svg>' },
  { re: /피그마|figma|레퍼런스|와이어프레임|로고/i, name: 'Figma', url: 'https://www.figma.com/files/',
    logo: '<svg width="10" height="15" viewBox="0 0 38 57"><path fill="#1abcfe" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/><path fill="#0acf83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/><path fill="#ff7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/><path fill="#f24e1e" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/><path fill="#a259ff" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/></svg>' },
  { re: /온라인으로 모여|화상|온라인 회의/, name: 'Google Meet', url: 'https://meet.google.com/',
    logo: '<svg width="15" height="12" viewBox="0 0 20 16"><rect y="2" width="13" height="12" rx="2.5" fill="#00ac47"/><path d="M13 6.5l6-4v11l-6-4z" fill="#00832d"/></svg>' },
  { re: /일정 (잡|정하)|날짜 정하/, name: 'Google Calendar', url: 'https://calendar.google.com/',
    logo: '<svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3" fill="#fff" stroke="#4285f4" stroke-width="1.6"/><path d="M1 5h14" stroke="#4285f4" stroke-width="1.6"/><text x="8" y="13" font-size="7" font-weight="700" text-anchor="middle" fill="#4285f4" font-family="Arial">31</text></svg>' },
];
const toolOf = d => TOOLS.find(t => t.re.test(d.text));

async function home(p, page) {
  const ms = inProj(p), maps = await Promise.all(ms.map(getMap));
  if (CUR.p !== p || CUR.kind !== 'home') return;
  const mode = p.me ? page.mode : 'all';
  /* 같은 회의를 두 번 정리한 경우가 있어 같은 할 일은 최근 회의 것 하나만 */
  const seen = new Set();
  const todos = ms.flatMap((m, i) => (maps[i].todos || []).map(d => ({ ...d, m, i })))
    .filter(d => { const k = d.text + '|' + d.owner; if (seen.has(k)) return false; seen.add(k); return true; });
  const all = ms.flatMap((m, i) => maps[i].sections.filter(s => s.resolution).map(s => ({ s, m })));
  const opens = mode === 'team' ? all : all.filter(x => x.s.resolution.kind !== 'decision');
  const v = $('#view');
  const toggle = p.me ? `<div class="mt">
      <a href="#/p/${esc(p.id)}" class="${mode === 'my' ? 'on' : ''}" aria-label="나"><img src="assets/me-${mode === 'my' ? 'on' : 'off'}.svg" alt=""></a>
      <a href="#/p/${esc(p.id)}/team" class="${mode === 'team' ? 'on' : ''}" aria-label="팀"><img src="assets/team-${mode === 'team' ? 'on' : 'off'}.svg" alt=""></a></div>` : '';
  const title = { my: '나의 할 일', team: '할 일', all: '다음 해야 할 일' }[mode];
  v.innerHTML = `
    <div class="hh"><div><h1 class="h1">${esc(p.name)}</h1>
      <div class="sub"><span>회의 ${ms.length}개</span><span>최근 ${esc(fdate(ms[0].date))}</span>${p.me ? `<span class="meis">${mode === 'my' ? `${av(p, p.me, 18)}${esc(p.me)} (나)` : `<span class="stk">${p.teams.flatMap(t => t.members).map(n => av(p, n, 18)).join('')}</span>팀 전체`}</span>` : ''}</div></div>${toggle}</div>
    <section class="sec"><header><h2>${title}<b id="tn"></b></h2></header>
      <div class="pills tg" id="ow"></div><div class="todos" id="todos"></div></section>
    <section class="sec"><header><h2>${mode === 'team' ? '팀 피드' : '미해결 안건'}<b>${opens.length}</b></h2>
      ${mode === 'team' ? `<div class="pills" id="fd"></div>` : ''}</header>
      <div class="grid2" id="opens">${opens.map(({ s, m }, k) => `
        <button class="row tap" data-o="${k}"><div class="tx"><div class="meta">${esc(titleOf(m))}<i>· 논의 ${s.no}</i></div>
          <h3>${esc(s.resolution.title)}</h3></div>
          <span class="st ${s.resolution.kind}">${KO[s.resolution.kind]}</span>
          <span class="cm">${I.cmt}${cmts(m.id, s.no + '-res').length || ''}</span></button>`).join('') || '<div class="empty">모두 결론이 났어요</div>'}</div>
      ${opens.length > 6 ? `<button class="more tap" id="more">${opens.length - 6}개 더 보기</button>` : ''}</section>
    <section class="sec"><header><h2>최근 회의</h2><a class="back" style="margin:0" href="#/p/${esc(p.id)}/list">전체 보기</a></header>
      <div class="rows">${ms.slice(0, 3).map((m, i) => meetRow(m, maps[i], i === 0)).join('')}</div></section>`;

  /* 할 일 묶음 — 나: 내 것만 / 팀: 팀 칩으로 고른다 / 설정 없는 프로젝트: 담당자 칩 */
  let groups;
  if (mode === 'my') groups = [{ key: 'me', list: todos.filter(d => isMine(p, d)) }];
  else if (mode === 'team') {
    groups = p.teams.map(t => ({ key: t.name, chip: `<span class="stk">${t.members.map(n => av(p, n)).join('')}</span>${esc(t.name)}`, list: todos.filter(d => teamsOf(p, d.owner).includes(t)) }));
    const rest = todos.filter(d => !teamsOf(p, d.owner).length);
    if (rest.length) groups.push({ key: 'rest', chip: '담당 미정', list: rest });
  } else {
    const owners = [...new Set(todos.map(d => d.owner).filter(Boolean))];
    groups = [{ key: '', chip: '전체', list: todos }, ...owners.map(o => ({ key: o, chip: esc(o), list: todos.filter(d => d.owner === o) }))];
  }
  const myTeam = (p.teams || []).find(t => t.members.includes(p.me));
  let cur = store.get('mn.group.' + p.id + mode);
  if (!groups.some(g => g.key === cur)) cur = mode === 'team' && myTeam ? myTeam.name : groups[0].key;
  const draw = () => {
    const g = groups.find(x => x.key === cur), list = g.list;
    $('#tn').textContent = list.length;
    $('#ow').innerHTML = groups.length > 1 ? groups.map(x => `<button class="${x.key === cur ? 'on' : ''}" data-w="${esc(x.key)}">${x.chip}</button>`).join('') : '';
    $('#todos').innerHTML = list.map((d, k) => todoCard(d, k)).join('') || '<div class="empty">정리된 할 일이 없어요</div>';
    $('#todos').onclick = e => {
      if (e.target.closest('.tool')) return;                 /* 로고는 도구를 연다 */
      const c = e.target.closest('[data-k]'); if (!c) return;
      const d = list[+c.dataset.k]; openEvidence(d.m.id, d.ev, d.who, d.t);   /* 이 할 일이 나온 자리로 */
    };
  };
  $('#ow').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; cur = b.dataset.w; store.set('mn.group.' + p.id + mode, cur); draw();
    utAct(cur === 'Team UX' ? 'team-ux' : 'group', cur + ' 할 일'); };
  draw();
  /* 팀 피드 — 확정 · 조건부 · 미결로 걸러 본다 */
  let kind = '';
  const feed = () => {
    const list = opens.filter(x => !kind || x.s.resolution.kind === kind);
    $('#opens').innerHTML = list.map(({ s, m }, k) => `
      <button class="row tap" data-o="${opens.indexOf(opens.find(y => y.s === s && y.m === m))}"><div class="tx"><div class="meta">${esc(titleOf(m))}<i>· 논의 ${s.no}</i></div>
        <h3>${esc(s.resolution.title)}</h3></div>
        <span class="st ${s.resolution.kind}">${KO[s.resolution.kind]}</span>
        <span class="cm">${I.cmt}${cmts(m.id, s.no + '-res').length || ''}</span></button>`).join('') || '<div class="empty">해당하는 안건이 없어요</div>';
    if ($('#fd')) $('#fd').innerHTML = [['', '전체'], ['decision', '확정'], ['conditional', '조건부'], ['open', '미결']]
      .map(([k, t]) => `<button class="${k === kind ? 'on' : ''}" data-f="${k}">${t} ${k ? opens.filter(x => x.s.resolution.kind === k).length : opens.length}</button>`).join('');
    bindOpens();
    const mm = $('#more');
    if (mm) mm.hidden = list.length <= 6;
    $('#opens').classList.toggle('fold', list.length > 6 && !$('#opens').dataset.all);
  };
  if ($('#fd')) $('#fd').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; kind = b.dataset.f; delete $('#opens').dataset.all; feed(); };
  const more = $('#more');
  if (more) { $('#opens').classList.add('fold'); more.onclick = () => { $('#opens').dataset.all = '1'; $('#opens').classList.remove('fold'); more.hidden = true; }; }
  if (mode === 'team') feed();
  /* 모바일처럼 — 나의 홈에서는 안건을 누르면 그 회의로, 팀 홈에서는 의견을 남긴다 */
  function bindOpens() {
    v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const { s, m } = opens[+b.dataset.o];
      mode === 'my' ? go(`#/m/${m.id}/sum/${s.no}`) : commentSheet(m, s, () => home(p, page));
    });
  }
  bindOpens();
}
/* 좌상단 마감 기한 · 우상단 업무 도구 · 좌하단은 이 할 일이 나온 자리(눌러서 원문으로) */
const todoCard = (d, k) => { const t = toolOf(d);
  return `<div class="todo tap g${k % 6}" data-k="${k}">
  <div><div class="top"><span class="due">${esc(d.due || '다음 회의까지')}</span>
    ${t ? `<a class="tool" href="${t.url}" target="_blank" rel="noopener" title="${esc(t.name)} 열기">${t.logo}</a>` : ''}</div>
  <h3>${esc(d.text)}</h3></div>
  <button class="bt" data-src="${k}" title="이 말이 나온 자리로"><span>${esc(titleOf(d.m))}</span><i>· ${esc(d.t)}</i>${I.arrow}</button></div>`; };
const meetRow = (m, map, isNew) => `<a class="row tap" href="#/m/${esc(m.id)}"><div class="tx">
  <div class="meta">${esc(fdate(m.date))}<i>•</i>${esc(dur(m.duration))}${(map && map.brief && map.brief.kind || []).map(k => `<i>· ${esc(k)}</i>`).join('')}</div>
  <h3>${esc(titleOf(m))}</h3>${map && map.brief && map.brief.line ? `<p>${esc(map.brief.line)}</p>` : ''}</div>${isNew ? '<span class="nw">new</span>' : ''}</a>`;

/* ================= 4. 회의록 — 최신순 · 안건별 ================= */
async function list(p) {
  const ms = inProj(p), maps = await Promise.all(ms.map(getMap));
  if (CUR.p !== p || CUR.kind !== 'list') return;
  let by = store.get('mn.by') || 'new';
  const v = $('#view');
  CUR.by = by;
  const draw = () => {
    let body;
    CUR.by = by;
    if (by === 'new') body = `<div class="rows">${ms.map((m, i) => meetRow(m, maps[i], i === 0)).join('')}</div>`;
    else {
      const all = ms.flatMap((m, i) => maps[i].sections.map(s => ({ s, m })));
      body = ['open', 'conditional', 'decision'].map(k => {
        const g = all.filter(x => (x.s.resolution || {}).kind === k);
        return g.length ? `<div class="grp"><h4><span class="st ${k}">${KO[k]}</span><i>${g.length}</i></h4><div class="grid2">${g.map(({ s, m }) => {
          const iss = s.nodes.find(n => n.kind === 'issue');
          return `<a class="row tap" href="#/m/${esc(m.id)}/sum/${s.no}"><div class="tx"><div class="meta">${esc(titleOf(m))}<i>· 논의 ${s.no}</i></div>
            <h3>${esc(iss ? iss.title : s.title)}</h3><p>${esc(s.resolution.title)}</p></div></a>`; }).join('')}</div></div>` : '';
      }).join('');
    }
    v.innerHTML = `<h1 class="h1">${esc(p.name)}</h1><div class="sub"><span>회의 ${ms.length}개</span></div>
      <div class="pills" style="margin-top:26px" id="by"><button class="${by === 'new' ? 'on' : ''}" data-b="new">최신순</button><button class="${by === 'agenda' ? 'on' : ''}" data-b="agenda">안건별</button></div>
      <div style="margin-top:16px">${body}</div>`;
    $('#by').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; by = b.dataset.b; store.set('mn.by', by); draw(); utNav(); };
  };
  draw();
}

/* ================= 5. 회의 페이지 — 요약 · 원문 · 관계 맵 ================= */
let M = null;   /* 지금 열린 회의 {m, map, segs} */
async function meetingPage(p, page) {
  const m = meetingOf(page.id);
  const [map, segs] = await Promise.all([getMap(m), getTrans(m)]);
  if (CUR.id !== m.id) return;
  M = { m, map, segs };
  const who = [...new Set(segs.map(s => s.s))];
  const v = $('#view');
  v.innerHTML = `
    <a class="back" href="#/p/${esc(p.id)}/list">${I.back}회의록</a>
    <div class="mhead"><div><h1 class="h1">${esc(titleOf(m))}</h1>
      <div class="sub"><span>${esc(fdate(map.meeting.date))}</span><span>${esc(dur(map.meeting.duration))}</span>
        <span>참석 ${who.map(esc).join(' · ')}</span></div></div>
      <div class="player" id="player" hidden><button id="pp" aria-label="재생">${I.play}</button><time id="pt">0:00</time><div class="bar" id="pb"><i></i></div><time>${esc(map.meeting.duration)}</time></div></div>
    <div class="tabs"><div class="pills" id="mtabs">
      <button data-t="sum">요약</button><button data-t="map">관계 맵</button><button data-t="src" class="only-narrow">원문</button></div></div>
    <div id="mbody"></div>`;
  $('#mtabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) go(`#/m/${m.id}/${b.dataset.t}`); };
  audio(map);
  meetingTab(page.tab);
}
function meetingTab(tab) {
  const { m, map, segs } = M;
  CUR.tab = tab; utNav();
  const focusNo = +decodeURIComponent(location.hash).split('/')[4] || 0;
  document.querySelectorAll('#mtabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const body = $('#mbody');
  /* 원문은 늘 왼쪽에 둔다. 오른쪽에 요약이나 관계 맵. 좁은 화면에서는 원문이 따로 한 탭 */
  const inner = tab === 'map'
    ? `<div class="map"><iframe src="map.html?m=${encodeURIComponent(m.id)}&view=map&embed=1&norail=1" title="관계 맵"></iframe></div>`
    : summaryHTML(map);
  body.innerHTML = `<div class="mgrid ${tab === 'src' ? 'solo' : ''}">${transHTML(segs)}${tab === 'src' ? '' : inner}</div>`;
  if (tab === 'sum') bindSummary(map);
  bindTrans();
  if (focusNo) { const el = body.querySelector(`[data-no="${focusNo}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); pickSection(map.sections.find(s => s.no === focusNo), false); } }
  if (PENDING) { const x = PENDING; PENDING = null; setTimeout(() => showEv(x.ev, x.who, x.t), 60); }
}

function summaryHTML(map) {
  const b = map.brief || {}, todos = map.todos || [];
  /* 논의를 상위 카테고리로 묶는다 — 카테고리가 없으면 논의 하나씩 */
  const groups = [];
  map.sections.forEach((sec, i) => {
    const key = sec.group || sec.title;
    const g = groups.find(x => x.key === key);
    (g || groups[groups.push({ key, i, list: [] }) - 1]).list.push(sec);
  });
  return `<div class="sheet">
    <div class="brief"><h5>한 줄 브리핑</h5>
      ${(b.kind || []).length ? `<div class="kinds">${b.kind.map(k => `<span class="kd">${esc(k)}</span>`).join('')}</div>` : ''}
      <p class="line">${esc(b.line || map.headline || '')}</p>
      ${(b.story || []).length ? `<div class="story">${b.story.map(x => `<p>${esc(x)}</p>`).join('')}</div>` : ''}</div>
    <hr>
    <h5>논의 쟁점<em>${groups.length}</em></h5>
    <div class="groups">${groups.map((g, gi) => `<section class="gp" style="--c:${TAGC[gi % TAGC.length]}">
      <h6><i>${String(gi + 1).padStart(2, '0')}</i>${esc(g.key)}<b>논의 ${g.list.length}</b></h6>
      ${g.list.map(sec => issueHTML(sec)).join('')}</section>`).join('')}</div>
    ${todos.length ? `<hr><h5>다음 해야 할 일</h5><div class="tlist">${todos.map((d, k) => `<button data-td="${k}"><span>${esc(d.text)}</span>
      <em class="own ${d.owner ? '' : 'none'}">${esc(d.owner || '담당 미정')}</em><time>${esc(d.t)}</time></button>`).join('')}</div>` : ''}
    ${(map.carry || []).length ? `<hr><h5>다음 회의로 넘어가는 것</h5><div class="carry">${map.carry.map(c => `<div><i>${esc(c.part)}</i><span>${esc(c.label)}</span></div>`).join('')}</div>` : ''}
  </div>`;
}
/* 논의 한 개 — 쟁점 문장을 앞세우고, 오간 이야기는 문장으로, 결론은 따로 */
function issueHTML(s) {
  const iss = s.nodes.find(n => n.kind === 'issue'), r = s.resolution || {};
  const nc = cmts(M.m.id, s.no + '-res').length;   /* 의견 달기는 홈의 팀 피드에서 */
  return `<article class="iss" data-no="${s.no}">
    <div class="qq" data-sec="${s.no}"><h4>${esc(iss ? iss.title : s.title)}</h4>
      <div class="qm"><time>${esc(s.t)}~${esc(s.t1)}</time><span>${esc(s.part)}</span></div></div>
    ${(s.flow || []).length ? `<div class="flow">${s.flow.map(x => typeof x === 'string'
      ? `<p>${esc(x)}</p>`
      : `<p data-at="${esc(x.t)}" data-no="${s.no}"><span>${esc(x.text)}</span><time>${esc(x.t)}</time></p>`).join('')}</div>` : ''}
    <div class="res" data-ev="${s.no}"><em class="st ${r.kind}">${KO[r.kind] || ''}</em><b>${esc(r.title || '결론 없이 넘어갔어요')}</b></div>
    ${nc ? `<div class="fx"><span class="cmb">${I.cmt}홈에 남긴 의견 ${nc}</span></div>` : ''}
  </article>`;
}
function bindSummary(map) {
  const body = $('#mbody');
  body.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => pickSection(map.sections.find(s => s.no === +b.dataset.sec), true));
  body.querySelectorAll('[data-at]').forEach(b => b.onclick = () => {      /* 이 문장이 오간 자리 */
    const sec = map.sections.find(s => s.no === +b.dataset.no);
    pickSection(sec, true, secs(b.dataset.at));
  });
  body.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => {      /* 결론이 나온 말 */
    const sec = map.sections.find(s => s.no === +b.dataset.ev), r = sec.resolution || {};
    const from = (r.from || []).map(id => sec.nodes.find(n => n.id === id)).filter(Boolean);
    const n = from[from.length - 1];
    n && n.ev ? showEv(n.ev, n.who, n.t) : pickSection(sec, true, secs(r.t));
  });
  body.querySelectorAll('[data-td]').forEach(b => b.onclick = () => { const d = map.todos[+b.dataset.td]; showEv(d.ev, d.who, d.t); });
}

/* ---------- 원문 ---------- */
function transHTML(segs) {
  const avatar = {}; [...new Set(segs.map(s => s.s))].forEach((p, i) => avatar[p] = AVC[i % AVC.length]);
  const pic = n => avatarOf(CUR.p, n);
  return `<section class="tr"><div class="trh"><h5>원문</h5>
      <label class="srch">${I.search}<input id="q" placeholder="발언 검색" autocomplete="off"><i id="qn"></i></label></div>
    <div class="segs" id="segs">${segs.map((g, i) => `<div class="seg" data-i="${i}">${pic(g.s) ? `<img class="av" src="${esc(pic(g.s))}" alt="">` : `<span class="av" style="background:${avatar[g.s]}">${esc([...g.s][0])}</span>`}
      <div><div class="who">${esc(g.s)}<button data-seek="${g.t}">${mmss(g.t)}</button></div>${g.l.map((l, li) => `<p data-li="${li}">${esc(l)}</p>`).join('')}</div></div>`).join('')}</div></section>`;
}
let HITS = [], HIT = 0;
function bindTrans() {
  const q = $('#q'), box = $('#segs');
  box.onclick = e => { const b = e.target.closest('[data-seek]'); if (b) seek(+b.dataset.seek); };
  const run = () => {
    clearMarks();
    const v = q.value.trim(); HITS = []; HIT = 0;
    if (v) {
      const re = new RegExp(v.split(/\s+/).map(escRe).join('\\s*'), 'gi');
      const split = new RegExp(`(${re.source})`, 'gi');
      box.querySelectorAll('p').forEach(p => {
        const t = p.textContent; if (!t.match(re)) return;
        p.innerHTML = t.split(split).map((x, i) => i % 2 ? `<mark>${esc(x)}</mark>` : esc(x)).join('');
        HITS.push(...p.querySelectorAll('mark'));
      });
    }
    $('#qn').textContent = v ? (HITS.length ? `1/${HITS.length}` : '없음') : '';
    jump();
  };
  const jump = () => { HITS.forEach((h, i) => h.classList.toggle('on', i === HIT)); if (HITS[HIT]) HITS[HIT].scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  q.oninput = run;
  q.onkeydown = e => { if (e.key === 'Enter' && HITS.length) { HIT = (HIT + (e.shiftKey ? HITS.length - 1 : 1)) % HITS.length; $('#qn').textContent = `${HIT + 1}/${HITS.length}`; jump(); } };
}
function clearMarks() {
  const box = $('#segs'); if (!box) return;
  box.classList.remove('dim');
  box.querySelectorAll('.seg.src').forEach(s => s.classList.remove('src'));
  box.querySelectorAll('mark').forEach(mk => { const p = mk.parentNode; p.textContent = p.textContent; });
}
const narrow = () => matchMedia('(max-width:860px)').matches;
/* 쟁점을 누르면 그 논의 구간이 원문에서 칠해진다 */
function pickSection(s, scroll, at) {
  if (!s) return;
  if (narrow() && scroll && !$('.mgrid.solo')) { go(`#/m/${M.m.id}/src`); setTimeout(() => pickSection(s, true, at), 80); return; }
  clearMarks();
  const a = secs(s.t), b = secs(s.t1), box = $('#segs');
  let first = null, want = null;
  M.segs.forEach((g, i) => {
    if (g.t >= a && g.t < b) { const el = box.children[i]; el.classList.add('src'); first = first || el;
      if (at != null && g.t <= at) want = el; }
  });
  box.classList.add('dim');
  const go_ = want || first;
  if (go_) go_.scrollIntoView({ block: at != null ? 'center' : 'start', behavior: 'smooth' });
}
/* 노드·할 일을 누르면 그 사람이 한 말의 그 구절만 짚는다 */
function showEv(ev, who, t) {
  if (narrow() && !$('.mgrid.solo')) { PENDING = { ev, who, t }; go(`#/m/${M.m.id}/src`); return; }
  clearMarks();
  const re = ev && new RegExp(ev.trim().split(/\s+/).map(escRe).join('\\s+'));
  const near = secs(t);
  const cand = M.segs.map((g, i) => [g, i]).filter(([g]) => (!who || g.s === who) && re && g.l.some(l => re.test(l)))
    .sort((x, y) => Math.abs(x[0].t - near) - Math.abs(y[0].t - near));
  if (!cand.length) { const i = M.segs.findIndex(g => g.t >= near); if (i >= 0) $('#segs').children[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const [g, i] = cand[0], li = g.l.findIndex(l => re.test(l));
  const p = $('#segs').children[i].querySelector(`p[data-li="${li}"]`);
  const m = re.exec(g.l[li]);
  p.innerHTML = esc(g.l[li].slice(0, m.index)) + `<mark class="ev">${esc(m[0])}</mark>` + esc(g.l[li].slice(m.index + m[0].length));
  p.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
let PENDING = null;
function openEvidence(id, ev, who, t) { PENDING = { ev, who, t }; go(`#/m/${id}/${narrow() ? 'src' : 'sum'}`); }

/* ---------- 음성 (있을 때만) ---------- */
let AU = null;
function audio(map) {
  if (AU) { AU.pause(); AU = null; }
  if (!map.meeting.audio) return;
  const a = AU = new Audio(enc(map.meeting.audio)); a.preload = 'metadata';
  $('#player').hidden = false;                          /* m4a 는 메타데이터가 끝에 있어 늦게 뜬다 — 먼저 보이고, 못 읽으면 숨긴다 */
  a.onerror = () => { if (a === AU && $('#player')) $('#player').hidden = true; };
  const tick = () => {
    if (a !== AU || !$('#pt')) return;
    $('#pt').textContent = mmss(a.currentTime);
    $('#pb i').style.width = (a.currentTime / (a.duration || 1) * 100) + '%';
    const box = $('#segs'); if (!box) return;
    let k = -1; M.segs.forEach((g, i) => { if (g.t <= a.currentTime) k = i; });
    box.querySelectorAll('.seg.now').forEach(x => x.classList.remove('now')); if (k >= 0) box.children[k].classList.add('now');
  };
  a.ontimeupdate = tick;
  a.onplay = a.onpause = () => { $('#pp').innerHTML = a.paused ? I.play : I.pause; };
  $('#pp').onclick = () => a.paused ? a.play() : a.pause();
  $('#pb').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); a.currentTime = (e.clientX - r.left) / r.width * (a.duration || 0); };
}
function seek(t) { if (AU && !$('#player').hidden) { AU.currentTime = t; AU.play(); } }

/* ---------- 의견 시트 (미해결 안건) ---------- */
function commentSheet(m, s, after) {
  const key = s.no + '-res', me = CUR.p && CUR.p.me;
  const bg = document.createElement('div'); bg.className = 'dim-bg';
  const sh = document.createElement('aside'); sh.className = 'cs';
  const close = () => { bg.remove(); sh.remove(); removeEventListener('keydown', onk); after && after(); };
  const onk = e => { if (e.key === 'Escape') close(); };
  const draw = () => {
    const cs = cmts(m.id, key);
    sh.innerHTML = `<header>의견<button aria-label="닫기">${I.x}</button></header>
      <div class="ctx"><small>${esc(titleOf(m))} · 논의 ${s.no} · <span class="st ${s.resolution.kind}">${KO[s.resolution.kind]}</span></small><h3>${esc(s.resolution.title)}</h3>
        <a href="#/m/${esc(m.id)}/sum/${s.no}">회의에서 보기 →</a></div>
      <div class="list">${cs.map((c, i) => `<div class="c">${me ? `<b class="by">${av(CUR.p, me, 22)}나</b>` : ''}${esc(c.text)}<time>${esc(c.at)}</time><button data-d="${i}">지우기</button></div>`).join('') || '<div class="empty" style="background:rgba(255,255,255,.5)">아직 의견이 없어요</div>'}</div>
      <form><input placeholder="의견 남기기" autofocus><button>남기기</button></form>`;
    sh.querySelector('header button').onclick = close;
    sh.querySelector('.ctx a').onclick = close;
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const x = cmts(m.id, key); x.splice(+b.dataset.d, 1); putCmts(m.id, key, x); draw(); });
    sh.querySelector('form').onsubmit = e => {
      e.preventDefault(); const v = e.target.querySelector('input').value.trim(); if (!v) return;
      putCmts(m.id, key, [...cmts(m.id, key), { text: v, at: new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) }]);
      utAct('comment', `의견 등록: ${v.slice(0, 30)}`);
      draw();
    };
    sh.querySelector('input').focus();
  };
  bg.onclick = close; addEventListener('keydown', onk);
  document.body.append(bg, sh); draw();
  utAct('comment-open', `${s.resolution.title} 의견창`);
}

/* ================= 6. AI 물어보기 ================= */
/* 모바일의 '전원 버튼 길게 누르기' 대신: 화면 아래 떠 있는 입력줄을 누르거나 ⌘K / Ctrl+K.
   흰 블러 막이 누른 자리에서 원형으로 번지는 연출은 그대로 가져온다. 답은 이 맥의 Claude 구독(/ask)으로. */
let ASK = null;
function openAsk(from) {
  if (ASK) return;
  const r = from ? from.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight - 50, width: 0, height: 0 };
  const scope = CUR.kind === 'meeting' ? { label: titleOf(M.m), ms: [M.m] } : { label: `${CUR.p.name} 전체 회의`, ms: inProj(CUR.p) };
  const o = document.createElement('div'); o.className = 'ask';
  o.style.setProperty('--px', (r.left + r.width / 2) + 'px'); o.style.setProperty('--py', (r.top + r.height / 2) + 'px');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  o.innerHTML = `<button class="x" aria-label="닫기">${I.x}</button><div class="in">
    <div class="scope"><b class="spark">✦</b>물어볼 범위 <b>${esc(scope.label)}</b></div>
    <form><input placeholder="무엇이든 물어보세요" autocomplete="off">
      ${SR ? `<button type="button" class="mic" aria-label="말로 묻기">${I.mic}</button>` : ''}<button class="go" aria-label="묻기">${I.up}</button></form>
    ${LOCALSRV ? '' : '<div class="warn">AI 답변은 이 맥에서 연 로컬 주소(127.0.0.1:8787/notes/)에서만 동작해요. 구독 안에서만 돌리기 위해서예요.</div>'}
    <div id="ans"></div></div>`;
  document.body.append(o); ASK = o;
  utAct('ask-open', '물어보기 열기');
  const inp = o.querySelector('input'); setTimeout(() => inp.focus(), 250);
  o.querySelector('.x').onclick = closeAsk;
  o.querySelector('form').onsubmit = e => { e.preventDefault(); const q = inp.value.trim(); if (q) { utAct('ask', `질문: ${q.slice(0, 30)}`); askRun(q, scope); } };
  const mic = o.querySelector('.mic');
  if (mic) mic.onclick = () => {
    const rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true;
    mic.classList.add('on');
    rec.onresult = e => { inp.value = [...e.results].map(x => x[0].transcript).join(''); if (e.results[e.results.length - 1].isFinal) { rec.stop(); o.querySelector('form').requestSubmit(); } };
    rec.onend = rec.onerror = () => mic.classList.remove('on');
    rec.start();
  };
}
function closeAsk() { if (!ASK) return; const o = ASK; ASK = null; o.classList.add('out'); setTimeout(() => o.remove(), 380); }
async function askRun(q, scope) {
  const box = ASK.querySelector('#ans');
  box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="think"><i></i><i></i><i></i></div></div>`;
  if (!LOCALSRV) { box.querySelector('.think').outerHTML = '<div class="aa">여기서는 답할 수 없어요.</div>'; return; }
  try {
    /* 여러 회의를 한 번에 물으면 회의마다 머리말 줄을 끼워 구분한다 */
    const parts = await Promise.all(scope.ms.map(async m => ({ m, segs: await getTrans(m), map: await getMap(m) })));
    const segs = parts.length === 1 ? parts[0].segs : parts.flatMap(x => [{ s: '—', t: 0, l: [`[회의: ${titleOf(x.m)} · ${x.m.date}]`] }, ...x.segs]);
    const map = parts.length === 1 ? parts[0].map : { sections: parts.flatMap(x => x.map.sections.map(s => ({ ...s, title: `[${titleOf(x.m)}] ${s.title}` }))) };
    const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, segments: segs, map }) });
    const a = await r.json();
    if (!r.ok) throw new Error(a.error || r.status);
    if (!ASK) return;
    box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="aa" id="aa"></div><div class="cites" id="ci"></div></div>`;
    utAct('ask-answer', (a.answer || '').slice(0, 40));
    await typeOut($('#aa'), a.answer || '답을 찾지 못했어요.');
    const cites = (a.cites || []).map(c => ({ ...c, m: (parts.find(x => x.segs.some(g => g.s === c.who && g.l.some(l => l.includes(c.quote)))) || parts[0]).m }));
    if (cites.length && ASK) {
      $('#ci').innerHTML = `<h6>근거가 된 발언</h6>` + cites.map((c, i) => `<button class="cite" data-i="${i}" style="animation-delay:${i * 60}ms">
        <small><b>${esc(c.who)}</b> · ${esc(c.t)}${parts.length > 1 ? ` · ${esc(titleOf(c.m))}` : ''}</small><p>“${esc(c.quote)}”</p></button>`).join('');
      $('#ci').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; const c = cites[+b.dataset.i]; closeAsk(); openEvidence(c.m.id, c.quote, c.who, c.t); };
    }
  } catch (e) {
    if (ASK) box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="warn">답을 받지 못했어요 · ${esc(e.message || e)}</div></div>`;
  }
}
function typeOut(el, text) {
  const t0 = performance.now();                        /* 경과 시간으로 글자 수를 정한다 — 탭이 뒤에 있어도 밀리지 않게 */
  return new Promise(res => { const step = () => { if (!ASK) return res();
    const n = Math.min(text.length, Math.floor((performance.now() - t0) / 18));
    el.innerHTML = esc(text.slice(0, n)) + (n < text.length ? '<span class="caret"></span>' : ''); if (n < text.length) setTimeout(step, 18); else res(); }; step(); });
}
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); ASK ? closeAsk() : openAsk($('#fab')); }
  else if (e.key === 'Escape' && ASK) closeAsk();
});

boot().then(() => {
  if (window.UT && UT.on) UT.mount({ screen: screenName, ctx: () => (CUR.kind === 'meeting' ? CUR.id : ''), reload: () => { CUR = {}; } });
});
</script>
</body>
