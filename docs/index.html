<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEWTON 회의록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#15161a; --ink2:#2c3038; --sub:#5f636b; --dim:#8d919a; --line:rgba(23,24,28,.10); --line2:rgba(23,24,28,.055);
  /* 상태 */
  --confirmed:#00806a; --conditional:#c07a10; --open:#6b7280; --concern:#c8433c; --proposal:#2f6bdd;
  --ux:#4a6785; --id:#6b6579; --bx:#7b6065; --team:#54706c;
  /* 글라스 */
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.4); --edge:rgba(255,255,255,.78);
  --shadow:0 10px 34px rgba(24,26,34,.09), 0 1px 2px rgba(24,26,34,.05);
  --blur:saturate(180%) blur(22px);
  /* 레이아웃 (드래그로 바뀜) */
  --rail:400px; --split:42%;
  --top:52px; --tabs:52px; --player:58px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-size:15px;line-height:1.62;letter-spacing:-.022em;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(1100px 640px at 8% -12%, #ffe4d8 0%, rgba(255,228,216,0) 62%),
    radial-gradient(900px 560px at 92% -6%, #dfeaff 0%, rgba(223,234,255,0) 60%),
    radial-gradient(760px 640px at 60% 110%, #e8f3ec 0%, rgba(232,243,236,0) 60%),
    #f2f2f4;
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.04em}
mark{background:rgba(255,214,120,.75);border-radius:3px;padding:0 1px}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- 타이포 위계 ----------
   L1 회의 제목 30 · L2 노드 제목 20(핵심 23) · L3 결론·갭 제목 15.5
   섹션 라벨 12/800 · 본문 14.5 · 메타 11.5                                   */
.t-label{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--dim)}
.t-meta{font-size:11.5px;color:var(--dim);font-weight:600}

/* ---------- 상단 ---------- */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:40;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:rgba(255,255,255,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--edge)}
.brand{font-size:13.5px;font-weight:800;white-space:nowrap;letter-spacing:-.03em}
.brand small{display:block;font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:0}
.meetsel{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
select{font:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--edge);border-radius:99px;
  padding:5px 10px;background:rgba(255,255,255,.6)}

/* ---------- 뼈대 ---------- */
main{position:fixed;top:var(--top);left:0;right:0;bottom:var(--player);display:grid;
  grid-template-columns:var(--rail) 10px minmax(0,1fr);padding:14px;gap:0}
.left{display:grid;grid-template-rows:var(--split) 10px minmax(0,1fr);min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;flex:none}
.pane-head h2{font-size:14px;font-weight:800}
.pane-body{overflow:auto;min-height:0;padding:0 14px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.right{overflow:auto;min-height:0;padding:0 6px 40px 14px;-webkit-overflow-scrolling:touch}

/* 크기 조절 손잡이 */
.rz{position:relative;display:grid;place-items:center}
.rz:before{content:"";border-radius:99px;background:rgba(23,24,28,.14);transition:background .15s,transform .15s}
.rz:hover:before,.rz.on:before{background:var(--proposal);transform:scale(1.15)}
.rz-x{cursor:col-resize}
.rz-x:before{width:4px;height:44px}
.rz-y{cursor:row-resize}
.rz-y:before{width:44px;height:4px}

/* ---------- 왼쪽 위: 한눈에 보는 결론 ---------- */
.stgroup{margin-bottom:16px}
.stgroup>h3{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--st);margin:0 2px 8px;
  letter-spacing:.02em}
.stgroup>h3 i{width:16px;height:0;border-top:2px var(--stline) var(--st);font-style:normal;flex:none}
.stgroup>h3 em{font-style:normal;color:var(--dim);font-weight:700;font-size:10.5px}
.oc{display:block;width:100%;text-align:left;background:var(--glass2);
  border:1px var(--stline) color-mix(in srgb,var(--st) 42%,transparent);
  border-radius:14px;padding:11px 13px;margin-bottom:7px;backdrop-filter:blur(10px);transition:.14s}
.oc:hover{background:rgba(255,255,255,.72);border-color:var(--st);transform:translateY(-1px)}
.oc b{display:block;font-size:14px;font-weight:750;line-height:1.4;letter-spacing:-.035em}
.oc span{display:block;font-size:12px;color:var(--sub);line-height:1.5;margin-top:4px}
.oc .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
.oc .tags i{font-style:normal;font-size:10px;font-weight:700;color:var(--sub);background:rgba(23,24,28,.05);
  border-radius:5px;padding:2px 5px}
.s-decided{--st:var(--confirmed);--stline:solid}
.s-conditional{--st:var(--conditional);--stline:dashed}
.s-open{--st:var(--open);--stline:dotted}
.s-action{--st:var(--proposal);--stline:solid}
.s-concern{--st:var(--concern);--stline:dashed}
.s-proposal{--st:var(--proposal);--stline:solid}
.s-question{--st:var(--sub);--stline:dotted}
.s-agree{--st:var(--confirmed);--stline:solid}

/* ---------- 왼쪽 아래: 원문 ---------- */
.srchead{display:flex;align-items:center;gap:8px;padding:0 16px 10px;flex:none}
.search{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--edge);background:rgba(255,255,255,.55);
  border-radius:99px;padding:6px 13px}
.search input{border:0;outline:0;font:inherit;font-size:13px;width:100%;background:none}
.search .n{font-size:11px;color:var(--dim);white-space:nowrap}
.tog{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--edge);border-radius:99px;
  padding:4px 9px;background:rgba(255,255,255,.45);white-space:nowrap}
.tog.on{color:var(--proposal);border-color:color-mix(in srgb,var(--proposal) 45%,transparent);background:rgba(47,107,221,.10)}

.seg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;padding:11px 10px;border-radius:14px;
  cursor:pointer;scroll-margin:80px;border:1px solid transparent}
.seg+.seg{margin-top:2px}
.seg:hover{background:rgba(255,255,255,.55)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:750;
  color:#fff;background:var(--c);box-shadow:0 2px 6px color-mix(in srgb,var(--c) 40%,transparent);
  letter-spacing:-.03em}
.seg-h{display:flex;align-items:baseline;gap:7px;margin-bottom:3px;min-height:30px;align-items:center}
.seg-h b{font-size:14px;font-weight:750;letter-spacing:-.035em}
.seg-h time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.seg-h .role{font-size:10px;font-weight:750;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.seg p{margin:0;font-size:14px;line-height:1.68;color:var(--ink2);word-break:keep-all}
.seg p+p{margin-top:1px}
.seg.cur{background:rgba(255,255,255,.8);border-color:var(--edge);box-shadow:0 6px 22px rgba(24,26,34,.09)}
.seg.cur .seg-h time{color:var(--proposal);font-weight:700}
.seg.hit{background:rgba(255,246,224,.65)}

/* ---------- 오른쪽 문서 ---------- */
.mhead{padding:24px 26px 22px;margin-bottom:14px}
.mno{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim)}
.mhead h1{font-size:30px;font-weight:800;line-height:1.22;margin:7px 0 10px}
.mhead p{margin:0;color:var(--sub);font-size:15px;line-height:1.6;max-width:66ch}
.mmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{font-size:11.5px;color:var(--sub);border:1px solid var(--edge);border-radius:99px;padding:3px 10px;
  background:rgba(255,255,255,.5)}
.chip b{font-weight:750;color:var(--ink)}

.threads{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.threads::-webkit-scrollbar{display:none}
.th{flex:none;max-width:230px;text-align:left;padding:9px 12px;border-radius:14px;background:var(--glass2);
  border:1px var(--stline) color-mix(in srgb,var(--st) 40%,transparent);backdrop-filter:blur(10px);transition:.14s}
.th:hover{background:rgba(255,255,255,.72)}
.th.on{background:#fff;border-color:var(--st);box-shadow:var(--shadow)}
.th em{font-style:normal;display:block;font-size:9.5px;font-weight:800;color:var(--st);letter-spacing:.04em}
.th b{display:block;font-size:12.5px;font-weight:700;line-height:1.35;margin-top:2px;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th span{display:block;font-size:10.5px;color:var(--conditional);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:11px 16px;margin-bottom:8px;font-size:11px;color:var(--sub)}
.legend div{display:flex;align-items:center;gap:6px}
.legend i{width:20px;height:0;font-style:normal;flex:none}
.lg-solid{border-top:2px solid var(--confirmed)}
.lg-dash{border-top:2px dashed var(--conditional)}
.lg-dot{border-top:2px dotted var(--open)}
.lg-red{border-top:2px dashed var(--concern)}

.sec{display:flex;align-items:baseline;gap:10px;margin:34px 4px 14px;padding-bottom:9px;
  border-bottom:1px solid var(--line)}
.sec h2{font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--dim)}
.sec span{font-size:11.5px;color:var(--dim)}

/* 시간순 흐름 */
.group{display:grid;grid-template-columns:70px minmax(0,1fr);gap:16px;padding-bottom:14px}
.axis{position:relative;padding-top:20px}
.axis .t{font-size:12px;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums;padding-left:24px;
  text-align:left;letter-spacing:-.02em}
.axis .t em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);font-weight:600}
.axis:after{content:"";position:absolute;left:12px;top:48px;bottom:-14px;width:0;border-left:1px dashed rgba(23,24,28,.16)}
.group:last-of-type .axis:after{display:none}
.axis .dot{position:absolute;left:6px;top:22px;width:13px;height:13px;border-radius:50%;
  background:rgba(255,255,255,.92);border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.t-ux{--accent:var(--ux)}.t-id{--accent:var(--id)}.t-bx{--accent:var(--bx)}.t-team{--accent:var(--team)}

.card{padding:18px 20px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);
  box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card.root{border-left:3px solid var(--accent);cursor:pointer}
.card.playing{background:rgba(255,255,255,.88);box-shadow:0 0 0 3px rgba(47,107,221,.14),0 16px 44px rgba(47,107,221,.16)}
.node-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:10px}
.node-head h3{font-size:20px;font-weight:750;line-height:1.3}
.group.key .node-head h3{font-size:23px;font-weight:800}
.part{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:1px 6px;
  background:rgba(255,255,255,.5)}
.who{font-size:11.5px;color:var(--dim);font-weight:600}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px;color:var(--ink2)}
.pts li{padding-left:13px;position:relative}
.pts li:before{content:"";position:absolute;left:0;top:.75em;width:6px;height:0;border-top:1px solid var(--dim)}
.pts b{font-weight:750;color:var(--ink)}

.edge{height:24px;margin-left:28px;position:relative;display:flex;align-items:center}
.edge:before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px var(--eline) var(--ecolor)}
.edge span{margin-left:14px;font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--ecolor);
  background:rgba(255,255,255,.65);border:1px solid var(--edge);border-radius:99px;padding:1px 8px}
.e-support{--eline:solid;--ecolor:var(--confirmed)}
.e-oppose{--eline:dashed;--ecolor:var(--concern)}
.e-change{--eline:dashed;--ecolor:var(--conditional)}
.e-derive{--eline:dotted;--ecolor:var(--open)}

.sub{margin-left:28px;width:fit-content;max-width:calc(100% - 28px);padding:12px 15px;border-radius:16px;
  background:var(--glass2);backdrop-filter:blur(12px);
  border:1px var(--stline) color-mix(in srgb,var(--st) 38%,transparent);font-size:14px;color:var(--ink2);line-height:1.6}
.sub b.k{display:inline-block;font-size:10px;font-weight:800;color:var(--st);letter-spacing:.03em;margin-right:8px;
  border:1px var(--stline) color-mix(in srgb,var(--st) 45%,transparent);border-radius:99px;padding:1px 8px;
  vertical-align:1px}
.sub i{font-style:normal;color:var(--dim);font-size:11.5px;font-weight:700}
.sub strong,.pts strong{font-weight:750;color:var(--ink)}
.state{margin-left:28px;width:fit-content;max-width:calc(100% - 28px);padding:14px 17px;border-radius:16px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1.5px var(--stline) var(--st);
  display:flex;gap:10px;align-items:baseline;box-shadow:0 6px 22px rgba(24,26,34,.07)}
.state b{font-size:10.5px;font-weight:800;color:var(--st);white-space:nowrap;letter-spacing:.03em}
.state span{font-size:15px;font-weight:700;letter-spacing:-.035em}
.quote{margin-top:12px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;font-size:13px;
  color:#4a4f58;line-height:1.6;background:rgba(255,255,255,.36);border:1px solid var(--edge)}
.quote:hover{background:rgba(255,255,255,.62)}
.quote em{font-style:normal;display:block;color:var(--dim);font-size:10.5px;font-weight:700;margin-bottom:3px}

/* 협업 갭 */
.gap{padding:20px 22px;margin-bottom:14px}
.gap .tag{font-size:10.5px;font-weight:800;color:var(--concern);letter-spacing:.03em}
.gap h3{font-size:18px;font-weight:750;margin:5px 0 8px}
.gsteps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-top:16px}
.gstep{position:relative}
.gstep+.gstep:before{content:"";position:absolute;left:-17px;top:12px;width:9px;height:0;
  border-top:2px dashed var(--concern);opacity:.55}
.gstep+.gstep:after{content:"";position:absolute;left:-9px;top:9px;border:3px solid transparent;
  border-left-color:var(--concern);opacity:.55}
.gstep h4{font-size:10.5px;color:var(--dim);font-weight:800;margin-bottom:6px;letter-spacing:.02em}
.gstep .src{font-size:11.5px;font-weight:800;color:var(--st);margin-bottom:5px}
.gstep blockquote{margin:0 0 6px;font-size:13.5px;line-height:1.55;padding-left:10px;
  border-left:2px var(--stline) color-mix(in srgb,var(--st) 45%,transparent)}
.gstep p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.55}
.cause{margin-top:16px;padding-top:11px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub)}
.cause b{color:var(--ink);font-size:12px;font-weight:800}

/* 다음 행동 */
.tasks{padding:8px 22px 16px}
.task{display:grid;grid-template-columns:126px minmax(0,1fr) 96px;gap:14px;padding:13px 0;font-size:14px;
  border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:0}
.task b{font-size:12.5px;font-weight:800}
.task span{color:var(--ink2)}
.task em{font-style:normal;font-size:11.5px;color:var(--dim);text-align:right}
.notice{margin:16px 6px 0;font-size:11.5px;color:var(--dim);line-height:1.65}

.at{font-size:10.5px;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;
  border:1px solid var(--edge);border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.6)}
.at:hover{color:var(--proposal);border-color:color-mix(in srgb,var(--proposal) 45%,transparent)}
.at:before{content:"▶ ";font-size:8px;vertical-align:1px}
body.noaudio .at:before{content:"↳ "}
body.filtered .dim{opacity:.2}

/* ---------- 플레이어 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--player);display:flex;align-items:center;gap:12px;
  padding:0 16px calc(env(safe-area-inset-bottom));background:rgba(255,255,255,.6);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--edge)}
.play{width:34px;height:34px;border-radius:50%;background:rgba(23,24,28,.9);color:#fff;display:grid;place-items:center;
  flex:none;font-size:12px;box-shadow:0 4px 14px rgba(24,26,34,.25)}
.bar{position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer}
.bar .track{width:100%;height:4px;background:rgba(23,24,28,.10);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:rgba(23,24,28,.75);width:0}
.tt{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.now{font-size:11.5px;color:var(--dim);max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{font-size:11px;color:var(--sub);border:1px solid var(--edge);border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.5)}
body.noaudio .play,body.noaudio .rate{display:none}
body.noaudio .now{display:block;max-width:none}

/* ---------- 모바일 ---------- */
.tabs{display:none}
@media (max-width:1240px){
  .gsteps{grid-template-columns:1fr;gap:20px}
  .gstep+.gstep:before{left:0;top:-14px;width:0;height:8px;border-top:0;border-left:2px dashed var(--concern)}
  .gstep+.gstep:after{left:-3px;top:-7px;border-left-color:transparent;border-top-color:var(--concern)}
}
@media (max-width:900px){
  main{position:static;display:block;padding:calc(var(--top) + var(--tabs) + 10px) 12px calc(var(--player) + 20px)}
  .left{display:block}
  .rz{display:none}
  .pane{margin-bottom:12px}
  .pane-body{overflow:visible;min-height:0}
  #src .pane-body{max-height:70vh;overflow:auto}
  .right{overflow:visible;padding:0}
  .col{display:none}.col.show{display:block}
  .tabs{display:flex;position:fixed;top:var(--top);left:0;right:0;height:var(--tabs);z-index:35;
    background:rgba(255,255,255,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--edge);padding:8px 12px;gap:8px}
  .tabs button{flex:1;border-radius:99px;font-size:12.5px;font-weight:750;color:var(--sub);border:1px solid transparent}
  .tabs button.on{color:var(--ink);background:rgba(255,255,255,.8);border-color:var(--edge);box-shadow:var(--shadow)}
  .group{grid-template-columns:1fr;gap:8px}
  .axis{padding-top:0;display:flex;align-items:center;gap:8px}
  .axis:after{display:none}
  .axis .dot{position:static;flex:none}
  .axis .t{padding-left:0}
  .axis .t em{display:inline;margin-left:6px}
  .mhead{padding:18px 18px 16px}
  .mhead h1{font-size:23px}
  .mhead p{font-size:14px}
  .node-head h3{font-size:18px}
  .group.key .node-head h3{font-size:20px}
  .task{grid-template-columns:1fr;gap:2px}
  .task em{text-align:left}
  .meetsel label{display:none}
  select{max-width:44vw}
  .now{display:none}
  .edge{margin-left:20px;height:22px}
  .sub,.state{margin-left:20px;max-width:calc(100% - 20px)}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand" id="brand">meetnote<small>회의 기록</small></div>
  <div class="meetsel"><label for="msel">회의</label><select id="msel"></select></div>
</div>

<nav class="tabs">
  <button data-tab="sum" class="on">결론</button>
  <button data-tab="src">원문</button>
  <button data-tab="doc">회의록</button>
</nav>

<main>
  <div class="left">
    <section class="pane glass col show" id="sum">
      <div class="pane-head"><h2>한눈에 보는 결론</h2><span class="t-meta" id="sumn"></span></div>
      <div class="pane-body" id="sumbody"></div>
    </section>
    <div class="rz rz-y" id="rzy" title="드래그해서 높이 조절 · 더블클릭 초기화"></div>
    <section class="pane glass col" id="src">
      <div class="pane-head"><h2>원문 기록</h2><span class="t-meta">눌러서 그 시각으로</span>
        <button class="tog on" id="follow" style="margin-left:auto">자동 따라가기</button></div>
      <div class="srchead">
        <div class="search"><input id="q" placeholder="원문에서 찾기 (예: 부스트, 발목)" spellcheck="false"><span class="n" id="qn"></span></div>
      </div>
      <div class="pane-body" id="tr"></div>
    </section>
  </div>
  <div class="rz rz-x" id="rzx" title="드래그해서 너비 조절 · 더블클릭 초기화"></div>
  <section class="right col" id="doc"></section>
</main>

<div class="player">
  <button class="play" id="pp" aria-label="재생">▶</button>
  <span class="tt" id="cur">0:00</span>
  <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
  <span class="tt" id="dur">0:00</span>
  <span class="now" id="now"></span>
  <button class="rate" id="rate">1.0×</button>
  <audio id="au" preload="metadata"></audio>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const secs = t => String(t).split(':').reduce((a, b) => a * 60 + +b, 0);
const mmss = s => (s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0')
                             : Math.floor(s / 60)) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

const ST = { decided: '확정', conditional: '조건부', open: '미결', action: '다음 행동', concern: '우려' };
const STANCE = { proposal: '제안', agree: '동의', conditional: '조건부 동의', concern: '우려·반론', question: '질문', open: '미결' };
const EDGE = { proposal: ['e-derive', '제안'], agree: ['e-support', '동의'], conditional: ['e-change', '조건부'],
               concern: ['e-oppose', '반론'], question: ['e-derive', '질문'], open: ['e-derive', '미결'] };
const AVCOLOR = ['#2f7d63', '#4a6da8', '#8a5a86', '#a8703c', '#5f6b7a', '#3f7d8a'];
const au = $('#au');
let DATA, TRANS = [], SEGN = [], meta, curSeg = -1, filter = null, audioOK = true, avatar = {};

/* ---------- 크기 조절 ---------- */
(function resizers() {
  const root = document.documentElement.style;
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const rail = get('mn.rail'), split = get('mn.split');
  if (rail) root.setProperty('--rail', rail);
  if (split) root.setProperty('--split', split);

  const drag = (handle, move, reset) => {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add('on');
      const mv = ev => move(ev);
      const up = () => { handle.classList.remove('on');
        handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up);
    });
    handle.addEventListener('dblclick', reset);
  };
  drag($('#rzx'), e => {
    const w = Math.min(720, Math.max(280, e.clientX - 14));
    root.setProperty('--rail', w + 'px'); set('mn.rail', w + 'px');
  }, () => { root.setProperty('--rail', '400px'); set('mn.rail', '400px'); });
  drag($('#rzy'), e => {
    const box = $('.left').getBoundingClientRect();
    const p = Math.min(80, Math.max(15, (e.clientY - box.top) / box.height * 100));
    root.setProperty('--split', p.toFixed(1) + '%'); set('mn.split', p.toFixed(1) + '%');
  }, () => { root.setProperty('--split', '42%'); set('mn.split', '42%'); });
})();

/* ---------- 로드 ---------- */
(async function boot() {
  meta = await (await fetch('data/meetings.json')).json();
  $('#brand').innerHTML = `${meta.project}<small>meetnote 회의 기록</small>`;
  Object.keys(meta.people).forEach((p, i) => avatar[p] = AVCOLOR[i % AVCOLOR.length]);
  const sel = $('#msel');
  meta.meetings.forEach(m => sel.append(new Option(`${m.no}차 · ${m.date} ${m.title}`, m.id)));
  sel.value = new URLSearchParams(location.search).get('m') || meta.meetings[0].id;
  sel.onchange = () => load(sel.value);
  load(sel.value);
})();

async function load(id) {
  const m = meta.meetings.find(x => x.id === id);
  const [d, t] = await Promise.all([
    fetch(`data/${id}.json`).then(r => r.json()),
    fetch(`data/${id}.transcript.json`).then(r => r.json()).catch(() => ({ segments: [] }))
  ]);
  DATA = d; DATA.m = m; TRANS = t.segments; SEGN = TRANS.map(s => s.t);
  audioOK = true; document.body.classList.remove('noaudio');
  au.src = m.audio; $('#dur').textContent = mmss(m.durationSec);
  document.title = `${m.date} ${m.title} · ${meta.project}`;
  renderSummary(); renderDoc(); renderTranscript();
  history.replaceState(null, '', `?m=${id}`);
}

function anchor(t) {
  const b = el('button', 'at', mmss(secs(t)));
  b.onclick = e => { e.stopPropagation(); seek(secs(t)); };
  return b;
}
const tag = (n, id) => { if (id) n.dataset.thread = id; return n; };

/* ---------- 왼쪽 위: 결론 ---------- */
function renderSummary() {
  const w = $('#sumbody'); w.textContent = '';
  $('#sumn').textContent = `${DATA.outcomes.length}개 항목`;
  ['decided', 'conditional', 'open', 'action'].forEach(st => {
    const items = DATA.outcomes.filter(o => o.status === st);
    if (!items.length) return;
    const g = el('section', `stgroup s-${st}`);
    g.append(el('h3', null, `<i></i>${ST[st]} <em>${items.length}</em>`));
    items.forEach(o => {
      const c = tag(el('button', `oc s-${st}`), o.thread);
      c.append(el('b', null, esc(o.title)), el('span', null, esc(o.body)));
      const tags = el('div', 'tags');
      o.meta.forEach(x => tags.append(el('i', null, esc(x))));
      if (o.t) tags.append(anchor(o.t));
      c.append(tags);
      c.onclick = () => o.t && seek(secs(o.t));
      g.append(c);
    });
    w.append(g);
  });
}

/* ---------- 오른쪽: 회의록 ---------- */
function renderDoc() {
  const d = DATA, m = d.m, w = $('#doc'); w.textContent = '';

  const h = el('header', 'mhead glass');
  h.append(el('div', 'mno', `MEETING ${String(m.no).padStart(2, '0')}`),
    el('h1', null, esc(m.title)), el('p', null, esc(d.headline)));
  const mm = el('div', 'mmeta');
  [`${m.date} ${m.time}`, m.duration, `${m.people.length}인`,
    ...m.people.map(p => `<b>${p}</b> ${meta.people[p] ? meta.people[p].part : ''}`)]
    .forEach(x => mm.append(el('span', 'chip', x)));
  h.append(mm); w.append(h);

  const ts = el('div', 'threads');
  meta.threads.forEach(th => {
    const step = th.steps.filter(s => s.m === DATA.id).pop();
    const st = step ? step.status : 'open';
    const b = el('button', `th s-${st}`);
    b.append(el('em', null, `${th.part} · ${ST[st]}`), el('b', null, esc(th.label)));
    if (th.carry) b.append(el('span', null, '↳ ' + esc(th.carry)));
    b.onclick = () => setFilter(filter === th.id ? null : th.id, b, step);
    ts.append(b);
  });
  w.append(ts);

  w.append(el('div', 'legend glass', `
    <div><i class="lg-solid"></i>실선 · 합의·확정</div>
    <div><i class="lg-dash"></i>파선 · 조건부·수정</div>
    <div><i class="lg-dot"></i>점선 · 제안·미결</div>
    <div><i class="lg-red"></i>붉은 파선 · 반대·우려</div>`));

  w.append(el('div', 'sec', '<h2>시간순 논의</h2><span>제안 → 반론 → 수정 → 결론이 이어진 순서</span>'));

  d.flow.forEach(e => {
    const part = { UX: 't-ux', ID: 't-id', BX: 't-bx' }[e.part.split(' ')[0]] || 't-team';
    const g = el('article', `group ${part}${e.weight === 1 ? ' key' : ''}`);
    const t0 = secs(e.t), t1 = secs(e.t1 || e.t);
    const ax = el('div', 'axis');
    const tb = el('button', 't', mmss(t0) + `<em>${mmss(t1)}</em>`);
    tb.onclick = () => seek(t0);
    ax.append(el('i', 'dot'), tb);

    const nodes = tag(el('div', 'nodes'), e.thread);
    const root = el('div', 'card root');
    root.dataset.t0 = t0; root.dataset.t1 = t1;
    root.onclick = ev => { if (!ev.target.closest('button')) seek(t0); };
    const head = el('div', 'node-head');
    head.append(el('h3', null, esc(e.title)), el('span', 'part', esc(e.part)),
      el('span', 'who', e.who.join(' · ')), anchor(e.t));
    root.append(head);
    if (e.points) {
      const ul = el('ul', 'pts');
      e.points.forEach(p => ul.append(el('li', null, p)));
      root.append(ul);
    }
    if (e.quote) {
      const q = el('button', 'quote', `<em>원문 ${mmss(secs(e.quote.t))} · ${esc(e.quote.who)}</em>“${esc(e.quote.text)}”`);
      q.onclick = () => seek(secs(e.quote.t));
      root.append(q);
    }
    nodes.append(root);

    (e.turns || []).forEach(t => {
      const [cls, label] = EDGE[t.stance] || EDGE.open;
      nodes.append(el('div', `edge ${cls}`, `<span>${label}</span>`));
      nodes.append(el('div', `sub s-${t.stance}`,
        `<b class="k">${STANCE[t.stance] || t.stance}</b><i>${esc(t.who)}</i> · ${t.text}`));
    });
    if (e.result) {
      const ecls = e.result.status === 'decided' ? 'e-support'
                 : e.result.status === 'conditional' ? 'e-change' : 'e-derive';
      nodes.append(el('div', `edge ${ecls}`, `<span>${ST[e.result.status]}</span>`));
      nodes.append(el('div', `state s-${e.result.status}`,
        `<b>${ST[e.result.status]}</b><span>${esc(e.result.text)}</span>`));
    }
    g.append(ax, nodes); w.append(g);
  });

  w.append(el('div', 'sec', '<h2>협업 갭</h2><span>같은 말을 서로 다르게 이해했던 지점</span>'));
  d.gaps.forEach(gp => {
    const c = tag(el('article', 'gap card'), gp.thread);
    c.append(el('div', 'tag', esc(gp.tag)), el('h3', null, esc(gp.title)));
    const ats = el('div', 'mmeta');
    gp.at.forEach(t => ats.append(anchor(t)));
    c.append(ats);
    const sw = el('div', 'gsteps');
    gp.steps.forEach(s => {
      const st = el('div', `gstep s-${s.stance}`);
      st.append(el('h4', null, esc(s.h)), el('div', 'src', `${esc(s.who)} · ${STANCE[s.stance] || ''}`),
        el('blockquote', null, '“' + esc(s.quote) + '”'));
      if (s.note) st.append(el('p', null, esc(s.note)));
      sw.append(st);
    });
    c.append(sw, el('div', 'cause', `<b>원인 추측</b> · ${esc(gp.cause)}`));
    w.append(c);
  });

  w.append(el('div', 'sec', '<h2>다음 행동</h2><span>이 회의가 다음 회의로 넘기는 것</span>'));
  const tw = el('div', 'tasks card');
  d.actions.forEach(a => {
    const r = el('div', 'task');
    r.append(el('b', null, esc(a.owner)), el('span', null, esc(a.desc)), el('em', null, esc(a.when)));
    tw.append(r);
  });
  w.append(tw, el('p', 'notice', esc(d.notice)));
}

function setFilter(id, btn, step) {
  filter = id;
  document.querySelectorAll('.th').forEach(x => x.classList.remove('on'));
  document.body.classList.toggle('filtered', !!id);
  document.querySelectorAll('.nodes, .gap, .oc').forEach(x =>
    x.classList.toggle('dim', !!id && x.dataset.thread !== id));
  if (id) { btn.classList.add('on'); if (step && step.t) seekTo(secs(step.t)); }
}

/* ---------- 왼쪽 아래: 원문 ---------- */
function renderTranscript() {
  const w = $('#tr'); w.textContent = '';
  TRANS.forEach((s, i) => {
    const d = el('div', 'seg'); d.id = 'seg' + i;
    const color = avatar[s.s] || '#5f6b7a';
    const av = el('span', 'av', esc(s.s.slice(0, 1)));
    av.style.setProperty('--c', color);
    const body = el('div');
    const role = meta.people[s.s] ? `<span class="role">${meta.people[s.s].part}</span>` : '';
    body.append(el('div', 'seg-h', `<b>${esc(s.s)}</b>${role}<time>${mmss(s.t)}</time>`));
    s.l.forEach(line => body.append(el('p', null, esc(line))));
    d.append(av, body);
    d.onclick = () => seek(s.t);
    w.append(d);
  });
  applySearch();
}
$('#q').oninput = applySearch;
function applySearch() {
  const q = $('#q').value.trim(), segs = $('#tr').children;
  if (!q) {
    [...segs].forEach((d, i) => { d.hidden = false; d.classList.remove('hit'); paint(d, TRANS[i], null); });
    $('#qn').textContent = ''; return;
  }
  let n = 0;
  [...segs].forEach((d, i) => {
    const hit = TRANS[i].l.some(l => l.includes(q)) || TRANS[i].s.includes(q);
    d.hidden = !hit; d.classList.toggle('hit', hit);
    if (hit) { n++; paint(d, TRANS[i], q); }
  });
  $('#qn').textContent = `${n}건`;
}
function paint(d, seg, q) {
  const ps = d.querySelectorAll('p');
  seg.l.forEach((line, i) => { ps[i].innerHTML = q ? esc(line).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(line); });
}

/* ---------- 오디오 ---------- */
function seek(t) { seekTo(t); if (audioOK) au.play().catch(() => {}); }
function seekTo(t) {
  t = Math.max(0, t);
  if (audioOK) au.currentTime = t;
  mark(t, true);
  if (innerWidth <= 900) showTab('src');
}
$('#pp').onclick = () => { if (audioOK) au.paused ? au.play() : au.pause(); };
au.onplay = () => $('#pp').textContent = '❚❚';
au.onpause = () => $('#pp').textContent = '▶';
au.onerror = () => { audioOK = false; document.body.classList.add('noaudio');
  $('#now').textContent = '음성 파일이 없는 배포입니다 · 원문과 회의록만 연결됩니다'; };
$('#rate').onclick = () => {
  const rs = [1, 1.25, 1.5, 2], r = rs[(rs.indexOf(au.playbackRate) + 1) % 4];
  au.playbackRate = r; $('#rate').textContent = r.toFixed(2).replace(/0$/, '') + '×';
};
$('#bar').onclick = e => {
  const b = e.currentTarget.getBoundingClientRect();
  seekTo(((e.clientX - b.left) / b.width) * (au.duration || DATA.m.durationSec));
};
$('#follow').onclick = e => e.currentTarget.classList.toggle('on');
au.ontimeupdate = () => mark(au.currentTime, false);

function mark(t, force) {
  const d = au.duration || DATA.m.durationSec;
  $('#fill').style.width = (t / d * 100) + '%';
  $('#cur').textContent = mmss(t);
  let lo = 0, hi = SEGN.length - 1, i = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (SEGN[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
  if (i !== curSeg || force) {
    const prev = document.getElementById('seg' + curSeg); if (prev) prev.classList.remove('cur');
    curSeg = i;
    const now = document.getElementById('seg' + i);
    if (now) {
      now.classList.add('cur');
      if ($('#follow').classList.contains('on') || force)
        now.scrollIntoView({ block: 'center', behavior: force ? 'auto' : 'smooth' });
      if (audioOK) $('#now').textContent = `${TRANS[i].s} · ${TRANS[i].l[0] || ''}`;
    }
    document.querySelectorAll('.card.root').forEach(c =>
      c.classList.toggle('playing', t >= +c.dataset.t0 && t < +c.dataset.t1));
  }
}

/* ---------- 모바일 탭 ---------- */
function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.col').forEach(c => c.classList.toggle('show', c.id === name));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function offsets() {
  const r = document.documentElement.style;
  r.setProperty('--top', document.querySelector('.top').offsetHeight + 'px');
  const t = document.querySelector('.tabs');
  if (getComputedStyle(t).display !== 'none') r.setProperty('--tabs', t.offsetHeight + 'px');
}
addEventListener('resize', offsets); offsets();
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && audioOK) { e.preventDefault(); au.paused ? au.play() : au.pause(); }
  if (e.key === 'ArrowLeft') seekTo((au.currentTime || 0) - 5);
  if (e.key === 'ArrowRight') seekTo((au.currentTime || 0) + 5);
});
</script>
</body>
</html>
