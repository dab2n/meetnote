<!doctype html>
<meta charset="utf-8">
<title>meetnote</title>
<style>
  * { box-sizing:border-box; }
  :root { color-scheme:dark; --r:22px; }
  html, body { margin:0; }
  body {
    padding:13px 14px; color:#fff; overflow:hidden;
    font:12px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .6s cubic-bezier(.22,1,.36,1);
    background:
      radial-gradient(66% 76% at 16% 0%,   #4ade9a 0%, rgba(74,222,154,0) 62%),
      radial-gradient(72% 82% at 98% 16%,  #17a06a 0%, rgba(23,160,106,0) 60%),
      radial-gradient(92% 96% at 58% 110%, #0a5f47 0%, rgba(10,95,71,0) 70%),
      #0c2a20;
  }
  body.rec {
    background:
      radial-gradient(66% 76% at 14% 0%,   #ff8a70 0%, rgba(255,138,112,0) 62%),
      radial-gradient(72% 82% at 98% 18%,  #e63946 0%, rgba(230,57,70,0) 58%),
      radial-gradient(92% 96% at 54% 112%, #6d1b26 0%, rgba(109,27,38,0) 70%),
      #2b0f12;
  }
  body.done {
    background:
      radial-gradient(66% 76% at 12% 0%,   #8fcbff 0%, rgba(143,203,255,0) 62%),
      radial-gradient(72% 82% at 98% 16%,  #4b7bec 0%, rgba(75,123,236,0) 58%),
      radial-gradient(94% 98% at 62% 112%, #ffb37a 0%, rgba(255,179,122,0) 68%),
      #14203a;
  }

  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1 { margin:0; font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  #meta { display:flex; align-items:center; gap:7px; }
  #timer { font:590 15px/1 "SF Pro Text", -apple-system, system-ui, sans-serif;
           font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  #srv { width:6px; height:6px; border-radius:999px; background:#30d158;
         box-shadow:0 0 7px rgba(48,209,88,.85); transition:background .3s; }
  #srv.off { background:#ff6b6b; box-shadow:0 0 7px rgba(255,107,107,.85); }

  /* 유리: 반투명 + 뒤 그라디언트 blur + 위쪽 하이라이트 */
  .glass {
    background:rgba(255,255,255,.13);
    backdrop-filter:blur(26px) saturate(190%);
    -webkit-backdrop-filter:blur(26px) saturate(190%);
    border:.5px solid rgba(255,255,255,.30);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.45), 0 6px 20px rgba(0,0,0,.32);
  }
  button {
    width:100%; border-radius:999px; color:#fff; font:inherit; cursor:pointer;
    padding:10px 13px; font-weight:530; letter-spacing:-.01em;
    display:flex; align-items:center; gap:10px;
    transition:background .2s, transform .18s cubic-bezier(.22,1,.36,1);
  }
  button:hover { background:rgba(255,255,255,.23); }
  button:active { transform:scale(.96); }
  .bulb { width:23px; height:23px; border-radius:999px; flex:0 0 23px;
          display:grid; place-items:center; font-size:15px; line-height:1; }

  #rec { background:rgba(255,255,255,.12); margin-bottom:7px; }
  #rec .bulb { background:#ff4d4d; box-shadow:0 0 0 .5px rgba(255,255,255,.5), 0 2px 9px rgba(255,0,0,.5); }
  #add { background:rgba(255,255,255,.09); font-size:11.5px; }
  #add .bulb { background:#30d158; color:#04240f; font-size:16px; font-weight:400;
               box-shadow:0 0 0 .5px rgba(255,255,255,.45), 0 2px 9px rgba(48,209,88,.5); }
  #stop { background:rgba(255,255,255,.17); justify-content:center; }

  #wave { display:flex; align-items:center; justify-content:center; gap:5px;
          height:34px; margin:0 0 9px; }
  #wave i { width:4px; height:4px; border-radius:999px; background:rgba(255,255,255,.92);
            box-shadow:0 0 9px rgba(255,255,255,.5);
            transition:height .13s cubic-bezier(.22,1,.36,1); }

  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:7px; }
  .row button { padding:9px 2px; border-radius:var(--r); font-size:10px; line-height:1.3;
                font-weight:500; display:block; text-align:center; }
  .row .ico { display:block; font-size:15px; margin-bottom:3px; }

  .hint { margin:0 0 8px; font-size:10.5px; opacity:.66; }
  .name { margin:0 0 8px; font-size:11px; opacity:.92; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; }
  .link { border:0; background:0; box-shadow:none; backdrop-filter:none; opacity:.6;
          font-size:10.5px; padding:4px; justify-content:center; }
  .link:hover { background:rgba(255,255,255,.1); opacity:.95; }
  .err { color:#ffd0cb; font-size:10.5px; white-space:pre-wrap; margin:0 0 7px; }
  .hidden { display:none; }
  body.drag::after {
    content:"놓으면 추가됩니다"; position:fixed; inset:6px; border-radius:var(--r);
    border:1.5px dashed rgba(255,255,255,.7); background:rgba(0,0,0,.36);
    display:grid; place-items:center; font-size:11px;
  }
</style>

<header><h1>meetnote</h1><span id="meta"><span id="timer"></span><span id="srv"></span></span></header>

<div id="idle">
  <button id="rec" class="glass"><span class="bulb"></span>녹음 시작</button>
  <button id="add" class="glass"><span class="bulb">+</span>회의 파일 (mp3 · txt)</button>
</div>
<div id="recording" class="hidden">
  <div id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button id="stop" class="glass">■&nbsp; 정지</button>
  <p class="hint" id="miconly"></p>
  <button class="link hidden" id="fix">권한 열기 →</button>
</div>
<div id="ready" class="hidden">
  <p class="name" id="fname"></p>
  <div class="row">
    <button class="glass" data-t="figjam"><span class="ico">🗺️</span>FigJam</button>
    <button class="glass" data-t="ppt"><span class="ico">📊</span>PPT</button>
    <button class="glass" data-t="word"><span class="ico">📄</span>Word</button>
  </div>
  <button class="link" data-r="1">↩︎ 취소</button>
</div>
<div id="sending" class="hidden"><p class="hint">보내는 중…</p></div>
<div id="sent" class="hidden">
  <p class="hint">✅ 정리 중입니다.<br>끝나면 데스크탑에서 자동으로 열립니다.</p>
  <button class="link" data-r="1">↩︎ 처음으로</button>
</div>
<div id="error" class="hidden">
  <p class="err" id="errmsg"></p><button class="link" data-r="1">↩︎ 처음으로</button>
</div>

<script>
const SERVER = "http://127.0.0.1:8787";
const PANELS = ["idle", "recording", "ready", "sending", "sent", "error"];
const BG = { recording: "rec", ready: "done", sending: "done", sent: "done", error: "done" };
const $ = (id) => document.getElementById(id);
const nat = (t, extra = {}) => window.webkit?.messageHandlers?.pin?.postMessage({ t, ...extra });

// documentElement.scrollHeight는 뷰포트 높이 밑으로 안 내려간다. body 실제 높이를 쓴다.
const fit = () => nat("fit", { h: Math.ceil(document.body.offsetHeight) });

function show(state, extra) {
  PANELS.forEach((p) => $(p).classList.toggle("hidden", p !== state));
  document.body.className = BG[state] || "";
  if (state !== "recording") { $("timer").textContent = ""; paint(0); }
  if (state === "recording") {
    $("miconly").textContent = extra || "";
    $("fix").classList.toggle("hidden", !extra);
  }
  if (state === "ready") $("fname").textContent = extra || "";
  if (state === "error") $("errmsg").textContent = extra || "알 수 없는 오류";
  fit();
}

// 네이티브가 부른다
window.native_state = show;
window.native_time = (s) =>
  ($("timer").textContent = `${String((s / 60) | 0).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`);
const bars = [...document.querySelectorAll("#wave i")];
const SHAPE = [.4, .68, .9, 1, .9, .68, .4];
const paint = (l) => bars.forEach((b, i) => (b.style.height = `${Math.round(4 + (l || 0) * .3 * SHAPE[i])}px`));
window.native_level = paint;

$("rec").onclick = () => nat("rec");
$("stop").onclick = () => nat("stop");
$("add").onclick = () => nat("pick");
$("fix").onclick = () => nat("settings");
let dropped = null;   // 끌어다 놓은 파일. 경로를 알 수 없어 바이트로 올린다.

async function doExport(target) {
  if (!dropped) return nat("export", { target });
  show("sending");
  try {
    const ext = (dropped.name.split(".").pop() || "mp3").toLowerCase();
    const r = await fetch(`${SERVER}/upload?target=${target}&ext=${ext}`,
      { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: dropped });
    if (!r.ok) throw new Error(`서버 오류 ${r.status}`);
    show("sent");
  } catch (err) { show("error", err.message); }
}

document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => doExport(b.dataset.t)));
document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => { dropped = null; nat("reset"); }));

document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drag"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("drag");
  const f = e.dataTransfer.files[0];
  if (!f) return;
  dropped = f;
  show("ready", f.name);
});

const ping = () => fetch(`${SERVER}/health`).then(() => true).catch(() => false)
  .then((ok) => $("srv").classList.toggle("off", !ok));
ping(); setInterval(ping, 5000);
show("idle");
</script>
