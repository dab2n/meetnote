<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>meetnote</title>
<style>
/* 폰트 — 모바일 앱과 같은 SF Pro +KR. 파일은 넣지 않고 설치된 것을 쓴다 */
@font-face{font-family:SFKR;font-weight:400;src:local("SF Pro +KR Display Regular"),local("SFProKR-Regular")}
@font-face{font-family:SFKR;font-weight:500;src:local("SF Pro +KR Display Medium"),local("SFProKR-Medium")}
@font-face{font-family:SFKR;font-weight:600;src:local("SF Pro +KR Display Semibold"),local("SFProKR-Semibold")}
@font-face{font-family:SFKR;font-weight:700;src:local("SF Pro +KR Display Bold"),local("SFProKR-Bold")}
:root{
  --bg:#fcfcfe; --card:#f2f5fa; --card2:#f5f6f8; --chip:#e4eaf2; --line:#dee0e6; --line2:#d7dff1;
  --ink:#050a0a; --ink2:#3b3b3b; --navy:#2d3b48; --dim:#757575; --dim2:#a3a3a3; --dark:#222a2a;
  --blue:#4b87e9; --red:#e0443e; --amber:#d9892b; --green:#2f9e5b; --violet:#8a6fd1; --grey:#8d9299;
  --ease:cubic-bezier(.3,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
/* 피그마 383:12875 는 1152 폭에 그려졌다. 창이 더 넓으면 레이아웃 전체를 그 비율로 키워
   어떤 창에서도 디자인과 같은 규격으로 보이게 한다 (--zoom 은 app.js 가 창 너비로 정한다) */
:root{--vh:calc(100vh / var(--zoom,1));--vw:calc(100vw / var(--zoom,1))}
body{zoom:var(--zoom,1)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 SFKR,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
[hidden]{display:none!important}
svg{display:block;flex:none}
.tap{transition:transform .15s,opacity .15s}.tap:active{transform:scale(.97);opacity:.8}

/* ---------- 뼈대: 왼쪽 사이드바 + 본문 ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px 18px;border-right:1px solid #eef0f4;background:var(--bg)}
.proj{position:relative}
.proj>button{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;font-size:22px;font-weight:600;letter-spacing:-.48px;max-width:100%}
.proj>button:hover{background:var(--card)}
.proj>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu{position:absolute;z-index:30;top:46px;left:4px;width:236px;padding:6px;border-radius:16px;background:#fff;
  box-shadow:0 0 0 1px rgba(40,39,51,.06),0 18px 40px rgba(40,39,51,.14);animation:pop .22s var(--ease)}
.pmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.pmenu button:hover{background:var(--card)}
.pmenu button.on{background:var(--chip);color:var(--navy);font-weight:600}
.pmenu i{font-style:normal;font-size:12px;color:var(--dim2)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:44px;color:var(--dim);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--card)}
.nav a.on{background:var(--chip);color:var(--navy);font-weight:600}
.slist{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:2px;scrollbar-width:none}
.slist h6{font-size:12px;font-weight:500;color:var(--dim2);padding:0 12px 6px}
.slist a{display:block;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink2)}
.slist a:hover{background:var(--card)}
.slist a.on{background:var(--card);color:var(--ink);font-weight:600}
.slist a b{display:block;font-weight:inherit;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist a time{font-size:11.5px;color:var(--dim2)}
.new{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;background:var(--dark);color:#fff;font-weight:600;text-decoration:none}
.new:hover{background:var(--ink)}
main{min-width:0;padding:34px 40px 140px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- 공통 조각 ---------- */
.h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.3}
.sub{margin-top:6px;color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sec{margin-top:40px}
.sec>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec>header h2{font-size:16px;font-weight:500;color:var(--dim);letter-spacing:-.16px}
.sec>header h2 b{margin-left:6px;color:var(--ink2);font-weight:600}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills:empty{display:none}          /* 칩이 하나도 없을 때 빈 줄이 자리를 먹지 않게 */
.pills button{height:32px;padding:0 14px;border-radius:99px;color:var(--dim2);font-size:13px;font-weight:500}
.pills button:hover{color:var(--ink2)}
.pills button.on{background:var(--chip);color:var(--navy);font-weight:600}
.kd{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:var(--dark);color:#fff;font-size:11.5px;font-weight:600}
.kd+.kd{background:var(--chip);color:var(--navy)}
.st{font-size:11.5px;font-weight:600;white-space:nowrap;font-style:normal}
.st.decision{color:var(--blue)} .st.conditional{color:var(--amber)} .st.open{color:var(--grey)}
.empty{padding:26px;border-radius:16px;background:var(--card2);color:var(--dim2);text-align:center;font-size:13px}

/* 캘린더 — 회의 일정과 마감 기한을 한 달 판에 (모바일 하단바 calendar 탭) */
.cal>header{margin-bottom:16px}
.cnav{display:flex;align-items:center;gap:6px}
.cnav b{min-width:104px;text-align:center;font-size:15px;font-weight:600;color:var(--ink)}
.cnav button{width:32px;height:32px;border-radius:99px;background:var(--card);color:var(--navy);font-size:16px;line-height:1}
.cnav button:hover{background:var(--chip)}
.cnav .tdy{width:auto;padding:0 13px;font-size:13px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:112px;gap:6px;
  padding:16px;border-radius:24px;background:var(--panel);box-shadow:0 0 0 1px #eef0f4}   /* 모든 날이 같은 규격 */
.cgrid .ch{padding:2px 4px 6px;font-size:12px;font-weight:600;color:var(--dim2);text-align:center}
.cgrid .ch.sun{color:#d9776b}
.cd{height:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:7px 7px 8px;overflow:hidden;
  border-radius:14px;background:var(--card2,#fafbfd);text-align:left;transition:background .18s,box-shadow .18s}
.cd:hover{background:var(--card)}
.cd.out{background:transparent;pointer-events:none}
.cd em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink2)}
.cd.sun em{color:#d9776b}
.cd.today em{display:inline-grid;place-items:center;width:22px;height:22px;margin:-2px 0 1px -2px;border-radius:50%;
  background:var(--dark);color:#fff}
.cd.on{background:#eaf1ff;box-shadow:inset 0 0 0 1.5px #b8d0f8}
.cd .pill{flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 6px;border-radius:6px;
  font-size:10.5px;font-weight:500;letter-spacing:-.2px}
.cd .pill.pmeet{background:#e2ecff;color:#2b5aa8}
.cd .pill.pdue{background:#fdeadf;color:#a8572b}
.cd .more{font-size:10px;color:var(--dim2);padding-left:2px}
.cday{margin-top:18px}
.cday h3{margin-bottom:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.cday h3 i{margin-left:6px;font-style:normal;color:var(--dim2);font-weight:500}
.crow{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;margin-bottom:8px;text-decoration:none;color:inherit;
  border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px #eef0f4;text-align:left;transition:background .18s}
.crow:hover{background:var(--card)}
.crow i{flex:none;padding:3px 9px;border-radius:99px;font-style:normal;font-size:11.5px;font-weight:600}
.crow.cmeet i{background:#e2ecff;color:#2b5aa8}
.crow.cdue i{background:#fdeadf;color:#a8572b}
.crow b{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow time,.crow .ow{flex:none;font-size:12.5px;color:var(--dim2)}
.crow .ow{font-weight:600;color:var(--navy)} .crow .ow.none{font-weight:500;color:var(--dim2)}
@media (max-width:760px){.cgrid{grid-auto-rows:78px}.cd .pill{display:none}}

/* 할 일 카드 — 모바일 홈 '나의 할 일'의 방사형 그라데이션 */
/* 가로 스크롤 상자라 넘치는 것을 자른다 — 카드가 떠오를 때 그림자가 잘리지 않게 안쪽 여백을
   그림자만큼 주고, 같은 크기의 음수 바깥 여백으로 자리를 되돌린다 */
.todos{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:20px 24px 26px;margin:-20px -24px -26px;scrollbar-width:none}
/* 가로로 흐르는 줄은 오른쪽 끝에서 뚝 끊기지 않게 흐려지며 빠진다. 끝까지 밀면 흐림도 사라진다 */
@property --fade{syntax:'<length>';inherits:false;initial-value:56px}
.todos,.prog{--fade:56px;animation:fadeoff linear both;animation-timeline:scroll(self x);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - var(--fade)),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - var(--fade)),transparent)}
@keyframes fadeoff{to{--fade:0px}}
.todo{scroll-snap-align:start;height:224px;display:flex;flex-direction:column;justify-content:space-between;padding:20px;border-radius:24px;
  border:1.5px solid rgba(255,255,255,.2);text-align:left;transition:transform .25s var(--ease),box-shadow .25s}
.todo:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(40,39,51,.1)}
.todo .top{display:flex;justify-content:space-between;align-items:flex-start;min-height:28px;font-size:12px;font-weight:500;color:var(--ink2)}
.todo .due{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:600}
.todo .top em{font-style:normal;color:rgba(5,10,10,.45)}
.todo{cursor:pointer}
.tool{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;border:.6px solid #fff;box-shadow:0 1px 4px rgba(40,39,51,.12);transition:transform .2s var(--ease)}
.tool:hover{transform:scale(1.12)}
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mt{display:flex;gap:4px;margin-top:4px}
.mt a{display:grid;place-items:center;width:40px;height:32px;border-radius:9px;transition:background .2s}
.mt a:hover{background:var(--card)}
.mt a.on{background:var(--dark)}
.mt img{width:20px;height:20px}
.meis{display:inline-flex;align-items:center;gap:5px}
.avi{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;color:#fff;font-size:11px;font-weight:600;flex:none;box-shadow:0 0 0 1.5px #fff}
.stk{display:inline-flex;margin-right:6px}.stk .avi+.avi{margin-left:-8px}
.tg{margin:0 0 12px}
.tg button{display:inline-flex;align-items:center;height:44px;padding:0 14px 0 8px;color:var(--dim2)}
.tg button:not(.on) .stk{opacity:.5}
.tg button.on{background:var(--card);color:var(--ink2);font-weight:500}
.cs .c .by{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:4px}
img.av{object-fit:cover}
.todo h3{margin-top:14px;font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.todo .bt{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;margin:0 -8px -4px;border-radius:10px;font-size:12px;font-weight:500;color:var(--ink2);text-align:left}
.todo .bt:hover{background:rgba(255,255,255,.5)}
.todo .bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.todo .bt i{font-style:normal;white-space:nowrap}
.todo .bt svg{margin-left:auto}
.g0{background:radial-gradient(60% 60% at 50% 40%,#87d1ff 0%,#aedeff 49%,#d6ebff 98%)}
.g1{background:radial-gradient(55% 55% at 50% 50%,#d8be49 0%,#e5d872 50%,#f1f29a 100%)}
.g2{background:radial-gradient(85% 70% at 50% 45%,#43bde6 25%,#5ec9ea 39%,#79d5ee 52%,#afecf5 79%,#fefde7 97%)}
.g3{background:radial-gradient(85% 70% at 50% 45%,#ff9e80 25%,#ffb696 45%,#ffd2ba 65%,#ffe8d6 82%,#fef8ec 97%)}
.g4{background:radial-gradient(80% 70% at 50% 46%,#cad9df 62%,#ece4e4 87%,#fdf3e6 100%)}
.g5{background:radial-gradient(80% 70% at 50% 46%,#d6d0e8 62%,#e8e2f0 87%,#f8f3fa 100%)}
.own{font-style:normal;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:600}
.own.none{background:transparent;border:1px dashed rgba(5,10,10,.2);color:rgba(5,10,10,.5);font-weight:500}

/* 리스트 카드 — 회의·안건 */
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border-radius:16px;background:var(--card);text-align:left;text-decoration:none;color:inherit;transition:background .2s}
.row:hover{background:var(--chip)}
.row .tx{flex:1;min-width:0}
.row .meta{font-size:12.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.row .meta i{font-style:normal;color:var(--dim2)}
.row h3{margin-top:4px;font-size:16px;font-weight:500;letter-spacing:-.2px}
.row p{margin-top:2px;font-size:13px;color:var(--dim)}
.row .nw{font-size:13px;font-weight:600;color:var(--blue)}
.row .cm{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
/* 진행 상황 칩 — 모바일 홈과 같은 모습 */
.prog{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px -2px 0;scrollbar-width:none}
.pch{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--card);
  font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap}
.pch:hover{background:var(--chip)}
/* 팀 피드 카드 */
.row.fd{align-items:flex-start;padding:18px 20px;border-radius:18px}
.row.fd .meta{align-items:center;gap:8px;font-size:12px}
.row.fd h3{margin-top:7px;font-size:15.5px;font-weight:600;line-height:1.5;letter-spacing:-.2px;white-space:normal}
.row.fd p{margin-top:5px;font-size:13.5px;line-height:1.55;color:var(--dim);white-space:normal}
.row.fd .cm{align-self:flex-start;margin-top:2px;padding:4px 10px;border-radius:99px;background:#fff;font-size:11.5px;font-weight:600}
.grid2.fold>:nth-child(n+7){display:none}
.more{margin-top:10px;width:100%;height:44px;border-radius:14px;background:var(--card2);color:var(--dim);font-size:13px;font-weight:500}
.more:hover{background:var(--chip);color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.grp+.grp{margin-top:28px}
.grp h4{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.grp h4 i{font-style:normal;font-weight:500;color:var(--dim2)}

/* ---------- 회의 페이지 ---------- */
.mhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:2px;margin:-6px 0 12px -8px;padding:6px 8px;border-radius:10px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{background:var(--card)}
.player{display:flex;align-items:center;gap:8px;height:44px;padding:4px 16px 4px 4px;border-radius:99px;background:linear-gradient(90deg,#e4eaf2,#f5f8ff);min-width:260px}
.player button{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(40,39,51,.1)}
.player time{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.player .bar{flex:1;height:3px;border-radius:2px;background:#d4dbe6;position:relative;cursor:pointer}
.player .bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--dark)}
.tabs{margin-top:22px;display:flex;align-items:center;gap:10px}
.mgrid{margin-top:18px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;align-items:start}
.mgrid.wide{grid-template-columns:0 minmax(0,1fr);gap:0;transition:grid-template-columns .35s var(--ease),gap .35s;
  --h:calc(var(--vh) - var(--top,240px));grid-auto-rows:var(--h);align-items:stretch}   /* 원문과 맵이 같은 높이로 화면에 꼭 맞는다 */
.mgrid.wide .tr{position:static;height:var(--h)}
.mgrid.wide .map{height:var(--h)}      /* 카드와 그 안의 맵을 딱 같은 높이로 — 아래가 희게 남지 않게 */
body.mapview main{padding-bottom:24px;overflow:hidden}
body.mapview{overflow:hidden}
.mgrid.wide.open{grid-template-columns:clamp(260px,24vw,320px) minmax(0,1fr);gap:14px}   /* 맵이 좁아지지 않게 원문은 얇게 */
.mgrid.wide:not(.open) .tr{width:0;min-width:0;padding:0;overflow:hidden;opacity:0;pointer-events:none;box-shadow:none}
.mgrid.wide .tr{transition:opacity .3s}
.mapwrap{position:relative}
.only-narrow{display:none}
.mgrid.solo{grid-template-columns:minmax(0,1fr)}
/* 요약 시트 — 모바일 요약 모달의 그라데이션 */
.sheet{border-radius:24px;padding:28px 28px 30px;background:#fff;box-shadow:0 0 0 1px #eef0f4,0 8px 24px rgba(40,39,51,.05)}
.sheet h5{font-size:16px;font-weight:600;letter-spacing:-.16px;margin-bottom:12px}
.sheet hr{border:0;border-top:1px solid #eef0f4;margin:26px 0}
.brief p{font-size:16px;line-height:1.65;color:var(--ink2)}
.brief .kinds{display:flex;gap:4px;margin-bottom:10px}
.focus{margin-top:14px;display:grid;gap:2px}
.focus button{display:flex;align-items:baseline;gap:10px;padding:7px 10px;margin:0 -10px;border-radius:10px;text-align:left;font-size:13.5px}
.focus button:hover{background:var(--card)}
.focus b{font-size:11.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.focus span{flex:1}
.brief .line{font-size:17px;font-weight:600;line-height:1.6;letter-spacing:-.2px}
.brief .story{margin-top:12px;display:grid;gap:9px}
.brief .story p{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.sheet h5 em{margin-left:6px;font-style:normal;font-size:12px;font-weight:500;color:var(--dim)}
.groups{display:grid;gap:22px}
.gp{padding:18px 18px 20px;border-radius:24px;background:color-mix(in srgb, var(--c, #c7d3e4) 26%, #fff)}
.gp h6{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.gp h6 i{display:grid;place-items:center;min-width:32px;height:32px;padding:0 10px;border-radius:10px;background:var(--c,#c7d3e4);color:var(--ink);font-style:normal;font-size:13px;font-weight:700}
.gp h6 b{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--dim2)}
.gp+.gp{border-top:0}
.iss{position:relative;padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(255,255,255,.6),0 2px 10px rgba(40,39,51,.04)}
.iss+.iss{margin-top:10px}
/* 쟁점 문장 — 이 카드에서 가장 크고 진하게, 왼쪽에 색 막대 */
.peek{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:99px;
  background:#fff;color:var(--navy);font-size:12px;font-weight:600;box-shadow:0 0 0 1px rgba(40,39,51,.06);opacity:.85}
.peek:hover{opacity:1;box-shadow:0 0 0 1px rgba(40,39,51,.16)}
.qq{cursor:pointer;padding-left:14px;padding-right:96px;border-left:3px solid var(--c,#c7d3e4)}
.qq h4{font-size:18px;font-weight:700;line-height:1.5;letter-spacing:-.3px}
.qq:hover h4{text-decoration:underline;text-decoration-color:rgba(5,10,10,.18);text-underline-offset:4px}
.qm{margin-top:5px;display:flex;gap:10px;font-size:11.5px;color:var(--dim2)}
.qm time{font-variant-numeric:tabular-nums}
.flow{margin-top:12px;display:grid;gap:8px;padding-left:17px}
.flow p{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.75;color:var(--ink2);cursor:pointer;padding:4px 8px;margin:-4px -8px;border-radius:10px}
.flow p:hover{background:#fff}
.flow p span{flex:1}
.flow p time{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.flow p:hover time{opacity:1}
.res{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb, var(--c, #c7d3e4) 34%, #fff);display:grid;gap:3px;cursor:pointer}
.res:hover{box-shadow:0 0 0 1px rgba(40,39,51,.12)}
.res em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.res b{font-size:15px;font-weight:600;line-height:1.55;letter-spacing:-.2px}
.res.none{color:var(--dim)}
.fx{margin-top:10px;display:flex;gap:6px;align-items:center}
.cmb{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:99px;font-size:12px;color:var(--dim);background:rgba(255,255,255,.75)}
.cmb:hover{background:#fff;color:var(--ink2)}
.tlist{display:grid;gap:2px}
.tlist button{display:flex;align-items:baseline;gap:10px;padding:9px 10px;margin:0 -10px;border-radius:10px;text-align:left}
.tlist button:hover{background:var(--card)}
.tlist span{flex:1;font-size:14.5px;font-weight:500}
.tlist .own{background:#fff;font-size:11.5px}
.tlist time{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.carry{display:grid;gap:6px}
.carry div{display:flex;gap:10px;font-size:14px} .carry i{font-style:normal;font-size:11.5px;color:var(--dim2);white-space:nowrap;margin-top:2px}

/* 원문 */
.tr{position:sticky;top:20px;height:var(--h,calc(100vh - 40px));display:flex;flex-direction:column;border-radius:24px;background:#fff;box-shadow:0 0 0 1px #eef0f4}
.mgrid.solo .tr{position:static;height:auto;box-shadow:none;background:transparent}
.trh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid #f0f2f6}
.trh h5{font-size:14px;font-weight:600;flex:1}
.srch{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:99px;background:var(--card);flex:1;max-width:260px}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13px}
.srch i{font-style:normal;font-size:11.5px;color:var(--dim2);white-space:nowrap}
.segs{flex:1;overflow:auto;padding:8px 16px 40px;scrollbar-width:thin}
.mgrid.solo .segs{padding:8px 0 40px}
.seg{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;transition:opacity .3s}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:#fff}
.seg .who{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.seg .who button{font-size:12.5px;font-weight:400;color:var(--dim2);font-variant-numeric:tabular-nums}
.seg .who button:hover{color:var(--blue)}
.seg p{font-size:14px;line-height:1.6;color:var(--ink2)}
.seg.now .who button{color:var(--blue);font-weight:600}
.segs.dim .seg:not(.src){opacity:.35}
/* 쟁점을 누르면 그 구간이 왼쪽→오른쪽으로 칠해진다 — 모바일과 같은 그라데이션 */
.seg.src p{background-image:linear-gradient(90deg,#2f6bd8 24%,#3f9bc4 64%,#6f7fdc),linear-gradient(#3b3b3b,#3b3b3b);background-repeat:no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep .8s var(--ease) both}
@keyframes sweep{from{background-size:0% 100%,100% 100%}to{background-size:100% 100%,100% 100%}}
/* 하이라이트는 연한 하늘 — 형광 노랑은 쓰지 않는다 */
mark{background:#dcecff;color:inherit;border-radius:2px}
mark.on{background:#bfdcff;box-shadow:0 0 0 1.5px #bfdcff}
mark.ev{background:linear-gradient(transparent 55%,#bfdcff 55%);box-shadow:none}
.map{height:var(--h,calc(100vh - 210px));min-height:360px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px #eef0f4;background:#fff}
.map iframe{width:100%;height:100%;border:0}

/* 댓글 시트 — 웹에서는 오른쪽에서 */
.dim-bg{position:fixed;inset:0;z-index:50;background:rgba(5,10,10,.18);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.cs{position:fixed;z-index:51;top:12px;right:12px;bottom:12px;width:min(420px,calc(var(--vw) - 24px));display:flex;flex-direction:column;border-radius:24px;
  background:linear-gradient(180deg,#e4eaf2 0%,#e4eaf2 70%,#fdf8f8 100%);box-shadow:0 20px 50px rgba(40,39,51,.18);animation:slide .4s var(--ease) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.cs header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 6px;font-size:15px;font-weight:600}
.cs .ctx{padding:6px 22px 16px}
.cs .ctx small{font-size:12px;color:var(--dim)} .cs .ctx h3{margin-top:2px;font-size:18px;font-weight:600;letter-spacing:-.3px}
.cs .ctx a{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--blue);text-decoration:none}
.cs .list{flex:1;overflow:auto;padding:0 22px;display:grid;align-content:start;gap:8px}
.cs .c{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;position:relative}
.cs .c time{display:block;margin-top:2px;font-size:11.5px;color:var(--dim2)}
.cs .c button{position:absolute;top:8px;right:10px;color:var(--dim2);font-size:12px}
.cs form{display:flex;gap:8px;padding:14px 16px 16px}
.cs form input{flex:1;height:44px;padding:0 16px;border-radius:99px;border:0;background:#fff;outline:none;font-size:14px}
.cs form button{height:44px;padding:0 18px;border-radius:99px;background:var(--dark);color:#fff;font-weight:600}

/* ---------- AI 물어보기 — 전원 버튼 대신 떠 있는 입력줄 + ⌘K ---------- */
.spark{background:linear-gradient(135deg,#4b87e9,#9de3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.ask{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.92));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:grow .75s var(--ease) both;overflow:auto}
.ask.out{animation:grow .4s var(--ease) reverse both}
@keyframes grow{from{clip-path:circle(0 at var(--px) var(--py));opacity:.6}to{clip-path:circle(150vmax at var(--px) var(--py));opacity:1}}
.ask .in{max-width:720px;margin:0 auto;padding:12vh 24px 80px;animation:rise .45s .25s var(--ease) both}
.ask .scope{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.ask .scope b{color:var(--navy);font-weight:600}
.ask .x{position:fixed;top:20px;right:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);box-shadow:0 1px 6px rgba(40,39,51,.1)}
.ask form{margin-top:14px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 22px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px rgba(75,135,233,.18),0 10px 30px rgba(75,135,233,.12)}
.ask form input{flex:1;min-width:0;height:44px;border:0;outline:none;font-size:18px;font-weight:500;background:none}
.ask form input::placeholder{color:var(--dim2)}
.ask .mic,.ask .go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ask .mic{color:var(--dim)} .ask .mic:hover{background:var(--card)}
.ask .mic.on{color:#fff;background:var(--blue);box-shadow:0 0 0 0 rgba(75,135,233,.45);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(75,135,233,0)}}
.ask .go{background:var(--dark);color:#fff}
.ask .ans{margin-top:34px}
.ask .qq{font-size:13px;color:var(--dim2)}
.ask .aa{margin-top:8px;font-size:19px;font-weight:500;line-height:1.7;letter-spacing:-.3px;white-space:pre-wrap}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--blue);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.think{display:flex;gap:5px;margin-top:14px}.think i{width:7px;height:7px;border-radius:50%;background:#9fb4d6;animation:bob 1.2s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bob{30%{transform:translateY(-4px);opacity:1}0%,60%,100%{opacity:.4}}
.cites{margin-top:22px;display:grid;gap:8px}
.cites h6{font-size:12px;font-weight:500;color:var(--dim2)}
.cite{display:grid;gap:4px;padding:14px 16px;border-radius:16px;background:rgba(242,245,250,.9);text-align:left;animation:rise .4s var(--ease) both}
.cite:hover{background:var(--chip)}
.cite small{font-size:12px;color:var(--dim)} .cite small b{color:var(--ink2);font-weight:600}
.cite p{font-size:14px;color:var(--ink2)}
.warn{margin-top:20px;padding:14px 16px;border-radius:14px;background:#fff6e6;color:#8a5a12;font-size:13.5px}


/* ---------- 사용성 테스트(UT) — ?ut 로 켠다 ----------
   진행에 필요한 것(참여자 등록 · 태스크 고르기 · 시나리오)은 전체를 덮는 한 겹 안에만 있다.
   화면 위쪽 작은 막대만 늘 떠 있다 — 들머리의 두 버튼, 태스크가 도는 동안에는 지금 태스크. */
.uttop{position:fixed;z-index:80;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:min(520px,86vw);
  height:30px;padding:0 14px 0 8px;border-radius:99px;background:rgba(250,250,250,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 10px rgba(0,0,0,.08);opacity:1}
.uttop i{flex:none;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--navy);font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.uttop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:500;color:var(--ink2)}
.uttop.idle{opacity:1;padding-right:6px}
.uttop button{flex:none;height:22px;padding:0 11px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--navy);
  background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(40,39,51,.08)}
.uttop button:hover{background:#fff}
.uttop button.on,.uttop button.on:hover{background:var(--dark);color:#fff;box-shadow:none}
/* 진행 레이어 — 모바일처럼 흰 블러가 위에서 내려와 덮는다 */
.utcover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(253,248,248,.78));animation:coverDown .8s var(--ease) both}
.utcover.stay{animation:none}
.utcover.out{animation:coverUp .8s var(--ease) both}
@keyframes coverDown{from{clip-path:inset(0 0 100% 0 round 0 0 40px 40px)}to{clip-path:inset(0 0 0 0)}}
@keyframes coverUp{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0 round 0 0 40px 40px)}}
.utc{display:grid;gap:14px;justify-items:center;width:min(560px,92vw);padding:0 24px;text-align:center;animation:rise .5s .2s var(--ease) both}
.utcover[data-mode="scenario"] .utc{animation-delay:.55s}
.utc span{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--dim)}
.utc h3{font-size:20px;font-weight:600;letter-spacing:-.3px}
.utc p{font:600 22px/1.6 SFKR,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;letter-spacing:-.3px;white-space:pre-line}
.utc>button{margin-top:10px;height:52px;padding:0 28px;border-radius:14px;background:var(--dark);color:#fff;font-size:16px;font-weight:600}
.utc>button.gh2{margin-top:0;height:46px;background:rgba(255,255,255,.8);color:var(--navy);box-shadow:0 0 0 1px rgba(40,39,51,.08);font-size:15px}
.utc>button.gh2:hover{background:#fff}
.utc>i{font-style:normal;font-size:13px;color:var(--dim2)}
.utc>a{margin-top:2px;font-size:12.5px;color:var(--dim2);text-decoration:none}
.utc>a:hover{color:var(--dim)}
.utlist{width:100%;display:grid;gap:6px;margin-top:4px}
.utlist button{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.75);text-align:left;
  font:500 15px/1.45 SFKR,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;letter-spacing:-.2px;color:var(--ink);
  box-shadow:0 0 0 1px rgba(40,39,51,.05)}
.utlist button:hover{background:#fff;box-shadow:0 0 0 1px rgba(40,39,51,.12),0 6px 18px rgba(40,39,51,.08)}
.utlist i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--chip);font-style:normal;font-size:11.5px;font-weight:600;color:var(--navy)}
.utlist span{flex:1}
.utlist em{font-style:normal;font-size:12px;font-weight:600;color:#2f9e5b}
.utrow{margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:12.5px;color:var(--dim2)}
.utrow .gh{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.7);font-size:12.5px;color:var(--navy);font-weight:500}
.utrow .gh:hover{background:#fff}
#utform{width:100%;display:grid;gap:8px;margin-top:2px}
#utform input{height:46px;padding:0 14px;border-radius:12px;border:1px solid transparent;background:#fff;font-size:15px;outline:none;text-align:center}
#utform input:focus{border-color:var(--dark)}
#utform button{margin-top:4px;height:50px;border-radius:14px;background:var(--dark);color:#fff;font-size:15px;font-weight:600}
/* ---------- 좁은 화면: 모바일처럼 좌상단 프로젝트 · 하단 떠 있는 내비 ---------- */
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border:0;padding:14px 12px 0;gap:0}
  .side .nav,.side .slist,.side .new{display:none}
  main{padding:14px 16px 150px}
  .mgrid{grid-template-columns:1fr}
  .mgrid:not(.solo) .tr{display:none}
  .only-narrow{display:inline-flex}
  .sheet{padding:22px 18px;border-radius:20px}
  .bnav{display:flex;position:fixed;z-index:40;left:16px;right:16px;bottom:18px;align-items:center;justify-content:space-between}
  .bnav nav{display:flex;padding:4px;border-radius:99px;background:rgba(250,250,250,.6);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:0 0 12px rgba(0,0,0,.12)}
  .bnav nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;border-radius:44px;color:#2d3b48;text-decoration:none;font-size:10px;font-weight:600;text-transform:uppercase;opacity:.45}
  .bnav nav a.on{background:var(--chip);opacity:1}
  .bnav .fab{width:52px;height:52px;border-radius:26px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:20px}
  .h1{font-size:24px}
  .todos{grid-auto-columns:220px}
  .map{height:calc(100vh - 230px)}
}

/* ===================================================================
   2026 레이아웃 — 피그마 218:5340 (상단바 · 아이콘 레일 · 회의 화면)
   =================================================================== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  height:46px;padding:14px 20px 10px;background:#fff;border-bottom:.6px solid #bfbfbf}
.topbar .tl{display:flex;align-items:baseline;gap:10px;min-width:0}
.topbar .brand{font-size:18px;font-weight:400;letter-spacing:-.72px;line-height:1.4;color:#000}
.topbar .proj{position:relative}
.topbar .proj>button{display:flex;align-items:center;gap:2px;padding:2px 6px;border-radius:8px;
  font-size:12px;font-weight:500;letter-spacing:-.12px;color:#757575;max-width:220px}
.topbar .proj>button:hover{background:var(--card)}
.topbar .proj>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .pmenu{top:30px;left:0}
.topbar .tacts{display:flex;align-items:center;gap:12px}
.topbar .noti{display:grid;place-items:center;width:24px;height:24px;border-radius:99px;background:#f3f6fe}
.topbar .me .avi{width:28px;height:28px;box-shadow:none}

.app{grid-template-columns:65px minmax(0,1fr);min-height:calc(100vh - 46px)}
.side{width:65px;height:calc(100vh - 46px);top:46px;gap:17.6px;padding:16px 16px 40px;
  background:#f5f8ff;border-right:.8px solid #eef0f4}
.nav{gap:1.6px}
.nav a{width:32px;height:32px;padding:0;gap:0;border-radius:88px;justify-content:center;color:#757575}
.nav a span{display:none}
.nav a:hover{background:#e9effa}
.nav a.on{background:transparent;color:#2d3b48}
.nav a.on svg path,.nav a.on svg circle{stroke:currentColor}
.slist{display:none}
.new{width:32px;height:32px;min-height:32px;padding:0;border-radius:88px;font-size:0;
  background:radial-gradient(165% 165% at 50% 50%,#222a2a 74.8%,#3b464b 87.4%,#54626c 100%);
  box-shadow:0 3px 12px rgba(0,0,0,.43)}
.new:hover{background:radial-gradient(165% 165% at 50% 50%,#2c3636 74.8%,#45525a 87.4%,#5d6c78 100%)}
.new span{display:none}
.new:before{content:"";flex:none;width:8px;height:8px;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><path d='M.7 4.7a.7.7 0 0 1 0-1.4h6.6a.7.7 0 0 1 0 1.4H.7zM4 8a.7.7 0 0 1-.7-.7V.7a.7.7 0 0 1 1.4 0v6.6A.7.7 0 0 1 4 8z'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><path d='M.7 4.7a.7.7 0 0 1 0-1.4h6.6a.7.7 0 0 1 0 1.4H.7zM4 8a.7.7 0 0 1-.7-.7V.7a.7.7 0 0 1 1.4 0v6.6A.7.7 0 0 1 4 8z'/></svg>") center/contain no-repeat;
  background:#fff}

main{padding:0;background:#fff}
.wrap{max-width:none;margin:0;padding:24px 20px 120px}
body.meeting .wrap{padding:0}

/* ---------- 회의 머리말 ---------- */
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:24px 20px 16px;border-bottom:1px solid var(--line)}
.mt-title{display:flex;align-items:center;gap:8px}
.mt-title h1{font-size:20px;font-weight:700;letter-spacing:-.48px;line-height:1.3;color:var(--ink)}

.mt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0 0 20px;

.mt-act{display:flex;align-items:center;gap:12px;color:#222a2a}

.mt-act button:hover{opacity:1}

.mcontent{display:grid;grid-template-columns:357px minmax(0,1fr);flex:1;min-height:0}
.mcontent .tr{position:relative;top:0;display:flex;flex-direction:column;min-height:0;height:auto;
  padding:12px 0 0 20px;border-radius:0;background:#fff;box-shadow:none}
.mcontent .trh{padding:4px 12.8px 12px;border:0}
.mcontent .trh h5{font-size:14px;font-weight:500;letter-spacing:-.42px;line-height:1.3}
.mcontent .srch{height:28px;max-width:150px;display:none}
.mcontent .tr.find .srch{display:flex}
.mcontent .segs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;
  padding:0 8px 104px 4px;scrollbar-width:thin}
.mcontent .segs::-webkit-scrollbar{width:4px}
.mcontent .segs::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:2.5px}
.mcontent .seg{gap:8px;padding:8px;border-radius:11.2px;grid-template-columns:24px minmax(0,1fr)}
.mcontent .seg .av{width:24px;height:24px;font-size:11px}
.mcontent .seg-h b,.mcontent .who{font-size:14px;font-weight:500;letter-spacing:-.112px;color:var(--ink)}
.mcontent .who button,.mcontent .seg-h time{font-size:10px;letter-spacing:-.096px;color:var(--dim2)}
.mcontent .seg p{font-size:12px;line-height:1.6;letter-spacing:-.24px;color:var(--ink2)}
.playdock{position:absolute;left:0;right:0;bottom:0;z-index:5;filter:drop-shadow(0 -20px 18px #fff)}
.playdock .track{position:relative;height:6px;background:var(--card);cursor:pointer}
.playdock .track i{position:absolute;inset:0 auto 0 0;width:10%;background:#c5d1e8}
.playdock .prow{display:flex;align-items:center;justify-content:space-between;
  padding:12px 12px 20px;background:#fff}
.playdock time{font-size:10px;letter-spacing:-.112px;color:var(--dim);font-variant-numeric:tabular-nums}
.playdock button{width:32px;height:32px;border-radius:50%}

.mcontent .pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:.8px solid var(--line)}
.mtabs2{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:0 12px;
  border-bottom:.8px solid var(--line)}
.mtabs2 button{padding:4px 4px 12px;font-size:14px;font-weight:400;letter-spacing:-.42px;line-height:1.3;color:var(--dim2)}
.mtabs2 button:hover{color:var(--ink2)}
.mtabs2 button.on{font-weight:600;color:var(--ink);box-shadow:inset 0 -1.2px 0 var(--ink)}
.mcontent #mbody{flex:1;min-height:0;overflow:auto;padding:16px 16px 20px}
body.mapview .mcontent #mbody{overflow:hidden;display:flex}
.mcontent .map{height:100%;flex:1;border-radius:20px;border:1px solid #f0f0f0;overflow:hidden;box-shadow:none}
.mcontent .sheet{box-shadow:none;border-radius:0;padding:0 4px 40px}

/* ---------- 안건 카드 — 플로우 맵의 검정 쟁점 카드와 같은 꼴 (map.html .node.issue) ---------- */
.aiss{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:18px 20px 20px;
  border-radius:20px;background:#161919;color:#fff;text-decoration:none}
.aiss .k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;letter-spacing:-.13px}
.aiss .k:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.aiss h3{font-size:15.5px;font-weight:500;line-height:1.5;letter-spacing:-.16px;color:#fff}
.aiss .foot{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:#a7adad}
a.aiss:hover{background:#232828}

/* ---------- 안건의 변화 — 주차마다 무엇이 어떻게 바뀌었고, 무엇이 흐름을 돌렸나 ---------- */
.achg{flex:none;display:flex;align-items:stretch;gap:10px;min-height:0}
.achg .aiss{flex:none;width:252px;padding:14px 16px 16px;border-radius:16px}
.achg .aiss h3{font-size:14px;line-height:1.45}
.asteps{flex:1;min-width:0;display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.asteps::-webkit-scrollbar{height:4px}
.asteps::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:2.5px}
.astep{flex:none;width:236px;display:flex;flex-direction:column;gap:3px;padding:12px 14px;
  border-radius:16px;background:var(--card);text-align:left}
.astep:hover{background:var(--chip)}
.astep .hd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.astep .hd b{font-weight:600;color:var(--ink2)}
.astep strong{font-size:13.5px;font-weight:600;line-height:1.45;letter-spacing:-.2px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.astep .turn{margin-top:2px;font-size:11.5px;line-height:1.45;color:var(--dim);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.astep .turn i{font-style:normal;color:var(--dim2)}
.asteps .arw{flex:none;align-self:center;color:var(--dim2);font-size:12px}

/* ---------- 안건별 — 전체 과정 플로우 맵. 원문은 카드를 누를 때까지 열리지 않는다 ---------- */
.mcontent.agenda{grid-template-columns:0 minmax(0,1fr);transition:grid-template-columns .35s var(--ease)}
.mcontent.agenda>.tr{width:0;min-width:0;padding:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s}
.mcontent.agenda.srcon{grid-template-columns:357px minmax(0,1fr)}
.mcontent.agenda.srcon>.tr{width:auto;padding:12px 0 0 20px;opacity:1;pointer-events:auto}
.srcx{width:20px;height:20px;border-radius:50%;color:var(--dim);font-size:15px;line-height:1}
.srcx:hover{background:var(--card);color:var(--ink)}

/* 좁은 화면 — 원문은 따로 한 탭 */
@media (max-width:900px){

  body.tab-src .mcontent .pane{display:none}
  .mcontent.agenda.srcon{grid-template-columns:minmax(0,1fr)}
  .mcontent.agenda.srcon>.tr{display:flex;padding:12px 12px 0}
  .mcontent.agenda.srcon>.pane{display:none}
}
@media (min-width:901px){ .only-narrow{display:none} }

.mguide{flex:none;margin:0;padding-left:15px;list-style:disc;
  font-size:10px;font-weight:500;line-height:1.4;color:#a4a4a4}
.mguide li::marker{font-size:9px}
body.mapview .mcontent #mbody{display:flex;flex-direction:column;gap:16px}

/* ===================================================================
   셸 — 피그마 219:13297 (레일 68 · 상단바 60 · 회의 화면)
   =================================================================== */
/* 레일이 열리고 닫힐 때 — 폭·칸·글자가 한 박자(.3초)로 같이 늘었다 줄어든다 */
/* 레일 폭 자체를 애니메이션한다 — 칸(grid)과 레일이 같은 값을 보고 한 몸으로 늘어난다 */
/* @property 를 모르는 브라우저(구형 사파리 등)에서는 --lnb 가 아예 없어 레일과 본문 그리드가 통째로 무너진다 */
:root{--lnb:68px}
@property --lnb{syntax:"<length>";inherits:true;initial-value:68px}
:root{--lnbt:.3s;--lnbe:cubic-bezier(.32,.72,0,1)}
body{transition:--lnb var(--lnbt) var(--lnbe)}
body.lnb{--lnb:185px}
.app{display:grid;grid-template-columns:var(--lnb,68px) minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);
  height:var(--vh);min-height:0;max-width:1440px;margin:0 auto}   /* 1152 규격의 1.25배까지만 벌린다 */
.side{grid-row:1/3;position:static;width:var(--lnb,68px);height:var(--vh);
  display:flex;flex-direction:column;align-items:flex-start;gap:17.6px;overflow:hidden;
  padding:24px 16px 40px 18px;background:#f5f8ff;border-right:.8px solid #eef0f4}
.side .top{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:24px;
  transition:width var(--lnbt) var(--lnbe)}
.side .brand{flex:none;display:flex;align-items:center;justify-content:center;height:18px;padding:0;line-height:0;background:none;border:0;cursor:pointer}
.side .brand img{display:block;height:15.714px;width:auto}
.side .brand .sym{width:24px;height:24px}
.side .brand .mark{display:none}                       /* 접힘: 심볼 · 펼침: 워드마크 */
body.lnb .side .brand .sym{display:none}
body.lnb .side .brand .mark{display:block}
.side .fold{flex:none;width:0;height:18px;padding:0;background:none;border:0;cursor:pointer;overflow:hidden;
  opacity:0;transform:scale(.8);pointer-events:none;
  transition:width var(--lnbt) var(--lnbe),opacity .18s,transform var(--lnbt) var(--lnbe)}
.side .fold:hover{opacity:1}
.side .fold img{display:block;width:18px;height:18px}
.nav a,.new{transition:width var(--lnbt) var(--lnbe),background .18s,border-radius var(--lnbt) var(--lnbe)}
/* 접혔을 때는 숨은 글자와의 간격(8px)이 아이콘을 왼쪽으로 밀어낸다 — 간격을 없애야 정가운데 */
body:not(.lnb) .nav a,body:not(.lnb) .new{gap:0}
.nav a span,.new span{display:block;overflow:hidden;white-space:nowrap;
  max-width:0;opacity:0;font-size:11.2px;font-weight:400;letter-spacing:-.112px;line-height:1.5;color:#757575;
  transition:max-width var(--lnbt) var(--lnbe),opacity .2s}
body.lnb .side .top{width:151px;justify-content:space-between}
body.lnb .side .fold{width:18px;opacity:.75;transform:none;pointer-events:auto}
body.lnb .nav{width:151px}
body.lnb .nav a{width:151px;height:32px;justify-content:flex-start;border-radius:12px}
body.lnb .nav a span{max-width:110px;opacity:1}
body.lnb .nav a.on{background:#e4eaf2;color:#3b3b3b}
body.lnb .nav a.on span{font-weight:500;color:#3b3b3b}
body.lnb .new{width:151px;height:34px;border-radius:12px;gap:8px;font-size:11.2px;
  background:radial-gradient(115.1% 98.4% at 50% 37.9%,#222a2a 48.3%,#3b464b 74.1%,#54626c 100%)}
body.lnb .new:hover{background:radial-gradient(115.1% 98.4% at 50% 37.9%,#2c3636 48.3%,#45525a 74.1%,#5d6c78 100%)}
body.lnb .new span{max-width:110px;opacity:1;font-weight:600;letter-spacing:-.112px;line-height:1.5;color:#fcfcfe}
.nav{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.nav a{width:34px;height:34px;padding:0 8px;gap:8px;border-radius:50%;justify-content:center;color:#878ea3}
.nav a svg{width:18px;height:18px}
.nav a:hover{background:#e9effa;color:#2d3b48}
.nav a.on{background:transparent;color:#222a2a}
.slist{display:none}
.new{flex:none;margin-top:auto;width:34px;height:34px;min-height:34px;padding:0;border-radius:88px;font-size:0;
  background:radial-gradient(51.6% 51.6% at 50% 50%,#222a2a 74.8%,#3b464b 87.4%,#54626c 100%);
  box-shadow:0 3px 12px rgba(0,0,0,.43)}
.new:hover{background:radial-gradient(51.6% 51.6% at 50% 50%,#2c3636 74.8%,#45525a 87.4%,#5d6c78 100%)}

.topbar{grid-column:2;position:static;display:flex;align-items:center;justify-content:flex-end;
  height:auto;padding:16px 20px 16px 26px;background:#fcfcfe;border-bottom:1px solid #dee0e6}
.topbar .tacts{display:flex;align-items:center;gap:12px}
.topbar .noti{display:grid;place-items:center;width:24px;height:24px;border-radius:84.857px;background:#f3f6fe}
.topbar .me .avi{width:30px;height:30px;box-shadow:none}

main{grid-column:2;min-width:0;min-height:0;overflow:auto;padding:0;background:#fff}
body.meeting main{overflow:hidden}
/* 아무리 줄여도 안 담기는 창 — 높이를 창에 묶지 않고 아래로 흐르게 둔다 */
body.tight .app{height:auto;min-height:var(--vh)}
body.tight .side{position:sticky;top:0;height:var(--vh)}

.mcontent{height:auto;flex:1;min-height:0}

/* 홈 제목이 곧 프로젝트 전환 */
.hproj{position:relative}
.hproj>.h1{display:flex;align-items:center;gap:4px;border-radius:10px;
  padding:6px 8px;margin-left:-8px}   /* 누를 자리는 두되 글자는 다른 줄과 같은 선(88)에 */
.hproj>.h1 svg{color:var(--dim2)}
.hproj .pmenu{top:calc(100% + 6px);left:0}

.mt-meta{padding:8px 0 0 20px;gap:8px;font-size:10px;letter-spacing:-.112px;line-height:1.3;color:#757575}
.mt-meta span+span:before{content:"";display:inline-block;width:2px;height:2px;margin-right:8px;
  border-radius:50%;background:currentColor;vertical-align:middle}
.mtop{border-bottom:1px solid #dee0e6}
.mt-act button[disabled]{opacity:.35}
.playdock button[disabled]{opacity:.4;cursor:default}

   원문 따라 읽기 — 카드를 누르면 그 발언으로 흘러가 재생되고,
   지금 말하는 어절에 상자가 따라붙는다 (발표 장표 30번)
   =================================================================== */
.segs{position:relative;z-index:0}   /* 발언·하이라이트의 z-index 를 이 안에 가둔다 — 재생 도크를 덮지 않게 */
.seg{position:relative;z-index:2}
.hl-row,.hl-word{position:absolute;pointer-events:none;opacity:0;
  transition:opacity .35s cubic-bezier(.22,1,.36,1)}
.hl-row{left:0;right:0;z-index:0;background:#f6f7fa;border-radius:14px;
  transition:top .5s cubic-bezier(.22,1,.36,1),height .5s cubic-bezier(.22,1,.36,1),opacity .35s cubic-bezier(.22,1,.36,1)}
.hl-word{z-index:1;background:#e4eaf2;border-radius:4px;
  transition:left .26s cubic-bezier(.22,1,.36,1),top .26s cubic-bezier(.22,1,.36,1),
             width .26s cubic-bezier(.22,1,.36,1),height .26s cubic-bezier(.22,1,.36,1),
             opacity .35s cubic-bezier(.22,1,.36,1)}
.hl-row.on,.hl-word.on{opacity:1}
@media (prefers-reduced-motion:reduce){.hl-row,.hl-word{transition:opacity .01s}}

/* ================= 1. 데이터 ================= */
const D = { index: [], projects: [], maps: {}, trans: {}, alias: null };
/* 이름을 바꾸면 조사도 새 이름에 맞춰 고친다 (일여는 → 하린은) */
const reEsc = escRe;
const JOSA = [['으로', '로'], ['이랑', '랑'], ['이라', '라'], ['이에요', '예요'], ['이었', '였'], ['은', '는'], ['이', '가'], ['을', '를'], ['과', '와'], ['아', '야']];
/* 받침이 있으면 은·이·을·으로. 영문으로 끝나면 읽을 때 모음으로 끝나는 쪽이 자연스럽다(Project → 프로젝트) */
const hasJong = s => { const c = s.charCodeAt(s.length - 1);
  return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : false; };
function aliasRules(cfg) {
  const keep = (cfg.keep || []).slice().sort((a, b) => b.length - a.length);
  const pairs = Object.entries(cfg.aliases || {}).sort((a, b) => b[0].length - a[0].length);
  const tail = JOSA.flat().sort((a, b) => b.length - a.length).map(reEsc).join('|');
  return { keep, subs: pairs.map(([from, to]) => [new RegExp(reEsc(from) + '(' + tail + ')?', 'g'), to]) };
}
function applyAlias(text, R) {
  if (!R || !R.subs.length) return text;
  const box = [];
  R.keep.forEach(k => { text = text.split(k).join('\u0000' + (box.push(k) - 1) + '\u0000'); });
  R.subs.forEach(([re, to]) => {
    text = text.replace(re, (m, j) => {
      if (!j) return to;
      const pair = JOSA.find(p => p.includes(j));
      return to + (pair ? pair[hasJong(to) ? 0 : 1] : j);
    });
  });
  return text.replace(/\u0000(\d+)\u0000/g, (m, i) => box[+i]);
}
/* 전사문에 나온 실제 이름·브랜드는 화면에 쓰지 않는다 — 불러올 때 바꿔 둔다 (data/people.json) */
const alias = o => (D.alias ? JSON.parse(applyAlias(JSON.stringify(o), D.alias)) : o);
async function getMap(m) {
  if (!D.maps[m.id]) D.maps[m.id] = fetch(enc(m.map), NOCACHE).then(r => r.json()).then(alias);
  return D.maps[m.id];
}
async function getTrans(m) {
  if (!D.trans[m.id]) D.trans[m.id] = getMap(m).then(async map => map.segments
    || alias((await (await fetch(enc(map.meeting.transcript), NOCACHE)).json()).segments));
  return D.trans[m.id];
}
const nfc = x => String(x).normalize('NFC');           /* 맥 파일명은 NFD 로 온다 */
const meetingOf = id => D.index.find(m => nfc(m.id) === nfc(id));
/* 회의 이름 — 프로젝트에 별칭이 있으면 그 이름으로 보여준다 (모바일 디자인과 같게) */
const titleOf = (m, p) => { const t = ((p || CUR.p || {}).titles) || {}; return t[nfc(m.id)] || t[m.id] || m.title; };
const projOf = id => D.projects.find(p => p.meetings.some(x => nfc(x) === nfc(id))) || D.projects[0];
const inProj = p => p.meetings.map(meetingOf).filter(Boolean).sort((a, b) => dkey(b.date) - dkey(a.date));
/* 왼쪽 카드·스레드와 같은 메모 저장소를 쓴다 (map.html 과 공유) */
const notes = id => store.get('mn.local.' + id) || { edits: {}, notes: {} };
const cmts = (id, key) => ((notes(id).notes[key] || {}).cs || []);
function putCmts(id, key, cs) {
  const L = notes(id); L.notes[key] = Object.assign({ rx: {}, cs: [] }, L.notes[key], { cs });
  if (!cs.length && !Object.keys(L.notes[key].rx).length) delete L.notes[key];
  store.set('mn.local.' + id, L);
}

async function boot() {
  try { D.alias = aliasRules(await (await fetch('data/people.json', NOCACHE)).json()); } catch {}
  try { D.index = (await (await fetch('data/index.json', NOCACHE)).json()).meetings || []; } catch {}
  try { D.projects = (await (await fetch('data/projects.json', NOCACHE)).json()).projects || []; } catch {}
  D.projects = D.projects.map(p => ({ ...p, meetings: p.meetings.map(meetingOf).filter(Boolean).map(m => m.id) }));
  const known = new Set(D.projects.flatMap(p => p.meetings));
  const rest = D.index.filter(m => !known.has(m.id)).map(m => m.id);
  if (rest.length) D.projects.push({ id: 'etc', name: '기타 회의', meetings: rest });
  D.projects = D.projects.filter(p => p.meetings.length);
  addEventListener('hashchange', route);
  route();
}

/* 사용성 테스트 기록용 화면 이름 (ut.js) */
const screenName = () => ASK ? 'ask'

  : CUR.kind === 'agenda' ? 'agenda'

const utNav = () => window.UT && UT.nav(screenName(), CUR.kind === 'meeting' ? CUR.id : '');

/* #/p/<프로젝트>  ·  #/p/<프로젝트>/list  ·  #/p/<프로젝트>/agenda/<안건>  ·  #/m/<회의>/<요약|원문|맵> */
let CUR = {};
function route() {
  const [, kind, a, b, c] = decodeURIComponent(location.hash).split('/');
  let p, page;
  if (kind === 'm' && meetingOf(a)) { p = projOf(a); page = { kind: 'meeting', id: meetingOf(a).id, tab: b || 'sum' }; }
  else {
    p = D.projects.find(x => x.id === a) || D.projects.find(x => x.id === store.get('mn.project')) || D.projects[0];
    page = { kind: b === 'list' ? 'list' : b === 'cal' ? 'cal' : b === 'agenda' ? 'agenda' : 'home',
      mode: b === 'team' ? 'team' : 'my', tid: c };
  }
  if (!p) { $('#view').innerHTML = '<div class="empty">아직 정리된 회의가 없어요. 왼쪽 아래 ＋ 새 회의 정리로 시작하세요.</div>'; return; }
  store.set('mn.project', p.id);
  const same = CUR.p === p && CUR.kind === page.kind && CUR.id === page.id && CUR.mode === page.mode;
  CUR = { p, ...page };
  const full = page.kind === 'meeting' || page.kind === 'agenda';   /* 머리말 + 원문/판 한 화면 */
  document.body.classList.toggle('meeting', full);
  if (!full) document.body.classList.remove('mapview', 'tab-src');
  side();
  if (same && page.kind === 'meeting') return meetingTab(page.tab);

  ({ home, list, cal: calendar, meeting: meetingPage, agenda: agendaPage })[page.kind](p, page);
  if (page.kind === 'agenda') lnbAuto(true);                  /* 판이 넓게 서야 한다 — 맵 탭과 같게 */
  else if (page.kind !== 'meeting') { utNav(); lnbAuto(false); }   /* 회의는 탭이 정해진 뒤 meetingTab 에서 */
}

/* 프로젝트 전환은 홈 제목에 달려 있다 (피그마 상단바에는 프로젝트가 없다) */

/* 나 · 팀 — 모바일 홈처럼 나뉜다. projects.json 의 me · teams 가 있을 때만 */
const avatarOf = (p, name) => (p && p.avatars || {})[name];
/* '발화자 3' 처럼 번호로 불리는 사람은 번호를, 이름이 있으면 머리글자를 — 서로 구분이 되게 */
const inic = n => (/\d$/.test(n) ? String(n).slice(-1) : [...String(n || '?')][0]);
function av(p, name, size = 28) {
  const src = avatarOf(p, name);

}
/* 할 일이 어느 팀 것인가 — 사람 이름, 파트 이름(ID·UX), 전원 */
const teamsOf = (p, owner) => (p.teams || []).filter(t => owner === '전원' || owner === t.part || owner === t.name || t.members.includes(owner));
/* 나의 할 일 = 내 이름 · 전원 · 우리 팀 단위(UX 처럼 파트로 맡긴 것). 같은 팀 다른 사람 이름으로 맡은 건 빼고 */
const isMine = (p, d) => { const t = (p.teams || []).find(x => x.members.includes(p.me));
  return d.owner === p.me || d.owner === '전원' || !!t && (d.owner === t.part || d.owner === t.name); };

  { re: /피그마|figma|레퍼런스|와이어프레임|로고/i, name: 'Figma', url: 'https://www.figma.com/files/',
    logo: '<svg width="10" height="15" viewBox="0 0 38 57"><path fill="#1abcfe" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/><path fill="#0acf83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/><path fill="#ff7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/><path fill="#f24e1e" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/><path fill="#a259ff" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/></svg>' },
  { re: /온라인으로 모여|화상|온라인 회의/, name: 'Google Meet', url: 'https://meet.google.com/',
    logo: '<svg width="15" height="12" viewBox="0 0 20 16"><rect y="2" width="13" height="12" rx="2.5" fill="#00ac47"/><path d="M13 6.5l6-4v11l-6-4z" fill="#00832d"/></svg>' },
  { re: /일정 (잡|정하)|날짜 정하/, name: 'Google Calendar', url: 'https://calendar.google.com/',
    logo: '<svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3" fill="#fff" stroke="#4285f4" stroke-width="1.6"/><path d="M1 5h14" stroke="#4285f4" stroke-width="1.6"/><text x="8" y="13" font-size="7" font-weight="700" text-anchor="middle" fill="#4285f4" font-family="Arial">31</text></svg>' },

const toolOf = d => TOOLS.find(t => t.re.test(d.text));

/* 진행 상황 — 팀원마다 지금 하고 있는 일 한 마디.
   projects.json 의 status 를 쓰고, 없으면 그 사람이 맡은 할 일에서 뒤쪽 핵심만 뽑는다. */
function progress(p, ms, maps) {
  const who = (p.teams || []).flatMap(t => t.members), st = p.status || {}, said = {};
  ms.forEach((m, i) => (maps[i].todos || []).forEach(d => {
    const owner = who.includes(d.owner) ? d.owner : who.includes(d.who) ? d.who : null;
    if (!owner || said[owner]) return;
    const w = d.text.split(/\s+/);
    said[owner] = w.slice(-2).join(' ');
  }));
  return who.map(n => ({ who: n, what: st[n] || said[n] })).filter(x => x.what);
}

/* 급한 것부터 왼쪽으로 — 회의에서 말한 기한을 종류와 날짜로 줄 세운다 */
function dueDays(d) {
  const due = d.due || '';
  let m;
  if (/오늘|당장|바로/.test(due)) return 0;
  if (/내일/.test(due)) return 1;
  if (/모레/.test(due)) return 2;
  if (due.match(/([일월화수목금토])요일/)) return 2.5;
  if ((m = due.match(/(\d+)월\s*(\d+)일/))) return 3 + (+m[1] * 31 + +m[2]) / 400;
  if (/이번 ?주/.test(due)) return 5;
  if (/다음 ?주/.test(due)) return 9;
  if (/다음 회의|다음 시연/.test(due)) return 14;
  return 30;
}
const HURRY = /바로|빠르게|서둘|먼저|급히|당장|우선/;
const rank = d => dueDays(d) - (HURRY.test(d.text + ' ' + (d.ev || '')) ? 3 : 0);
const byUrgent = (a, b) => rank(a) - rank(b) || secs(a.t) - secs(b.t);

/* 홈·회의록이 같은 머리말을 쓴다 — 프로젝트 이름(누르면 전환) + 한 줄 요약 */
const projHead = (p, sub, right) => `<div class="hh"><div><div class="proj hproj">
    <button class="h1 tap" id="pbtn">${esc(p.name)}<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pmenu" id="pmenu" hidden></div></div>
    <div class="sub">${sub}</div></div>${right || ''}</div>`;

async function home(p, page) {
  const ms = inProj(p), maps = await Promise.all(ms.map(getMap));
  if (CUR.p !== p || CUR.kind !== 'home') return;
  const mode = p.me ? page.mode : 'all';
  /* 같은 회의를 두 번 정리한 경우가 있어 같은 할 일은 최근 회의 것 하나만 */
  const seen = new Set();
  const todos = ms.flatMap((m, i) => (maps[i].todos || []).map(d => ({ ...d, m, i })))
    .filter(d => { const k = d.text + '|' + d.owner; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort(byUrgent);                          /* 급한 것부터 왼쪽으로 */
  const all = ms.flatMap((m, i) => maps[i].sections.filter(s => s.resolution).map(s => ({ s, m })));
  const opens = mode === 'team' ? all : all.filter(x => x.s.resolution.kind !== 'decision');
  const v = $('#view');
  const toggle = p.me ? `<div class="mt">
      <a href="#/p/${esc(p.id)}" class="${mode === 'my' ? 'on' : ''}" aria-label="나"><img src="assets/me-${mode === 'my' ? 'on' : 'off'}.svg" alt=""></a>
      <a href="#/p/${esc(p.id)}/team" class="${mode === 'team' ? 'on' : ''}" aria-label="팀"><img src="assets/team-${mode === 'team' ? 'on' : 'off'}.svg" alt=""></a></div>` : '';
  const title = { my: '나의 할 일', team: '할 일', all: '다음 해야 할 일' }[mode];
  v.innerHTML = `
    ${projHead(p, `<span>회의 ${ms.length}개</span><span>최근 ${esc(fdate(ms[0].date))}</span>${p.me ? `<span class="meis">${mode === 'my' ? `${av(p, p.me, 18)}${esc(p.me)} (나)` : `<span class="stk">${p.teams.flatMap(t => t.members).map(n => av(p, n, 18)).join('')}</span>팀 전체`}</span>` : ''}`, toggle)}
    <section class="sec"><header><h2>${title}<b id="tn"></b></h2></header>
      <div class="pills tg" id="ow"></div><div class="todos" id="todos"></div></section>
    ${mode === 'team' ? `<section class="sec"><header><h2>진행 상황</h2></header>
      <div class="prog">${progress(p, ms, maps).map(x => `<span class="pch">${av(p, x.who, 28)}${esc(x.what)}</span>`).join('')}</div></section>` : ''}
    <section class="sec"><header><h2>${mode === 'team' ? '팀 피드' : '미해결 안건'}<b>${opens.length}</b></h2>
      ${mode === 'team' ? `<div class="pills" id="fd"></div>` : ''}</header>
      <div class="grid2" id="opens">${opens.map(({ s, m }, k) => `
        <button class="row tap" data-o="${k}"><div class="tx"><div class="meta">${esc(titleOf(m))}<i>· 논의 ${s.no}</i></div>
          <h3>${esc(s.resolution.title)}</h3></div>
          <span class="st ${s.resolution.kind}">${KO[s.resolution.kind]}</span>
          <span class="cm">${I.cmt}${cmts(m.id, s.no + '-res').length || ''}</span></button>`).join('') || '<div class="empty">모두 결론이 났어요</div>'}</div>
      ${opens.length > 6 ? `<button class="more tap" id="more">${opens.length - 6}개 더 보기</button>` : ''}</section>
    ${mode === 'team' ? '' : `<section class="sec"><header><h2>최근 회의</h2><a class="back" style="margin:0" href="#/p/${esc(p.id)}/list">전체 보기</a></header>
      <div class="rows">${ms.slice(0, 3).map((m, i) => meetRow(m, maps[i], i === 0)).join('')}</div></section>`}`;

  /* 할 일 묶음 — 나: 내 것만 / 팀: 팀 칩으로 고른다 / 설정 없는 프로젝트: 담당자 칩 */
  let groups;
  if (mode === 'my') groups = [{ key: 'me', list: todos.filter(d => isMine(p, d)) }];
  else if (mode === 'team') {
    groups = p.teams.map(t => ({ key: t.name, chip: `<span class="stk">${t.members.map(n => av(p, n)).join('')}</span>${esc(t.name)}`, list: todos.filter(d => teamsOf(p, d.owner).includes(t)) }));
    const rest = todos.filter(d => !teamsOf(p, d.owner).length);
    if (rest.length) groups.push({ key: 'rest', chip: '담당 미정', list: rest });
  } else {
    const owners = [...new Set(todos.map(d => d.owner).filter(Boolean))];
    groups = [{ key: '', chip: '전체', list: todos }, ...owners.map(o => ({ key: o, chip: esc(o), list: todos.filter(d => d.owner === o) }))];
  }
  projMenu();
  const myTeam = (p.teams || []).find(t => t.members.includes(p.me));
  let cur = store.get('mn.group.' + p.id + mode);
  if (!groups.some(g => g.key === cur)) cur = mode === 'team' && myTeam ? myTeam.name : groups[0].key;
  const draw = () => {
    const g = groups.find(x => x.key === cur), list = g.list;
    $('#tn').textContent = list.length;
    $('#ow').innerHTML = groups.length > 1 ? groups.map(x => `<button class="${x.key === cur ? 'on' : ''}" data-w="${esc(x.key)}">${x.chip}</button>`).join('') : '';
    $('#todos').innerHTML = list.map((d, k) => todoCard(d, k)).join('') || '<div class="empty">정리된 할 일이 없어요</div>';
    $('#todos').onclick = e => {
      if (e.target.closest('.tool')) return;                 /* 로고는 도구를 연다 */
      const c = e.target.closest('[data-k]'); if (!c) return;
      const d = list[+c.dataset.k]; openEvidence(d.m.id, d.ev, d.who, d.t);   /* 이 할 일이 나온 자리로 */
    };
  };
  $('#ow').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; cur = b.dataset.w; store.set('mn.group.' + p.id + mode, cur); draw();
    utAct(cur === 'Team UX' ? 'team-ux' : 'group', cur + ' 할 일'); };
  draw();
  /* 팀 피드 — 확정 · 조건부 · 미결로 걸러 본다 */
  let kind = '';
  const feed = () => {
    const hit = (k, x) => k === 'decision' ? x.s.resolution.kind === 'decision' : x.s.resolution.kind !== 'decision';
    const list = opens.filter(x => !kind || hit(kind, x));
    $('#opens').innerHTML = list.map(({ s, m }) => {
      const iss = s.nodes.find(n => n.kind === 'issue'), nc = cmts(m.id, s.no + '-res').length;
      return `<button class="row fd tap" data-o="${opens.findIndex(y => y.s === s && y.m === m)}">
        <div class="tx">
          <div class="meta"><span class="st ${s.resolution.kind === 'decision' ? 'decision' : 'open'}">${s.resolution.kind === 'decision' ? '확정' : '미결'}</span>${esc(titleOf(m))}<i>· ${esc(s.t)}</i></div>
          <h3>${esc(s.title)}</h3>
          <p>${esc(s.resolution.title)}</p>
        </div>
        <span class="cm">${I.cmt}${nc || '의견'}</span></button>`;
    }).join('') || '<div class="empty">해당하는 안건이 없어요</div>';
    if ($('#fd')) $('#fd').innerHTML = [['', '전체'], ['decision', '확정'], ['open', '미결']]
      .map(([k, t]) => `<button class="${k === kind ? 'on' : ''}" data-f="${k}">${t} ${k ? opens.filter(x => hit(k, x)).length : opens.length}</button>`).join('');
    bindOpens();
    const mm = $('#more');
    if (mm) mm.hidden = list.length <= 6;
    $('#opens').classList.toggle('fold', list.length > 6 && !$('#opens').dataset.all);
  };
  if ($('#fd')) $('#fd').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; kind = b.dataset.f; delete $('#opens').dataset.all; feed(); };
  const more = $('#more');
  if (more) { $('#opens').classList.add('fold'); more.onclick = () => { $('#opens').dataset.all = '1'; $('#opens').classList.remove('fold'); more.hidden = true; }; }
  if (mode === 'team') feed();
  /* 모바일처럼 — 나의 홈에서는 안건을 누르면 그 회의로, 팀 홈에서는 의견을 남긴다 */
  function bindOpens() {
    v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const { s, m } = opens[+b.dataset.o];
      mode === 'my' ? go(`#/m/${m.id}/sum/${s.no}`) : commentSheet(m, s, () => home(p, page));
    });
  }
  bindOpens();
}
/* 좌상단 마감 기한 · 우상단 업무 도구 · 좌하단은 이 할 일이 나온 자리(눌러서 원문으로) */
const todoCard = (d, k) => { const t = toolOf(d);
  return `<div class="todo tap g${k % 6}" data-k="${k}">
  <div><div class="top"><span class="due">${esc(d.due || '다음 회의까지')}</span>
    ${t ? `<a class="tool" href="${t.url}" target="_blank" rel="noopener" title="${esc(t.name)} 열기">${t.logo}</a>` : ''}</div>
  <h3>${esc(d.text)}</h3></div>
  <button class="bt" data-src="${k}" title="이 말이 나온 자리로"><span>${esc(titleOf(d.m))}</span><i>· ${esc(d.t)}</i>${I.arrow}</button></div>`; };
const meetRow = (m, map, isNew) => `<a class="row tap" href="#/m/${esc(m.id)}"><div class="tx">
  <div class="meta">${esc(fdate(m.date))}<i>•</i>${esc(dur(m.duration))}${(map && map.brief && map.brief.kind || []).map(k => `<i>· ${esc(k)}</i>`).join('')}</div>

/* ================= 3-2. 캘린더 — 회의 일정과 마감 기한 ================= */
/* 할 일의 마감은 "수요일 저녁" · "6월 20일" 처럼 말한 그대로 적혀 있다.
   그 말이 나온 회의 날짜를 기준으로 실제 날짜를 잡는다. 못 잡으면 '날짜 미정'으로 따로 모은다. */
const dparts = d => String(d || '').split('.').map(Number);
const ymd = dt => `${dt.getFullYear()}.${dt.getMonth() + 1}.${dt.getDate()}`;
const WD = '일월화수목금토';
function dueDate(due, from, nextMeet) {
  const [y, mo, dd] = dparts(from);
  if (!y) return null;
  const base = new Date(y, mo - 1, dd), add = n => { const x = new Date(base); x.setDate(x.getDate() + n); return x; };
  let m;
  if (/오늘|당장|바로/.test(due)) return base;
  if (/모레/.test(due)) return add(2);
  if (/내일/.test(due)) return add(1);
  if ((m = due.match(/([일월화수목금토])요일/))) {                 /* 그 회의 다음에 오는 그 요일 */
    const want = WD.indexOf(m[1]), gap = (want - base.getDay() + 7) % 7;
    return add(gap || 7);
  }
  if ((m = due.match(/(\d{1,2})월\s*(\d{1,2})일/))) {
    const t = new Date(y, +m[1] - 1, +m[2]);
    if (t < base) t.setFullYear(y + 1);
    return t;
  }
  if (/이번 ?주/.test(due)) return add((5 - base.getDay() + 7) % 7 || 5);      /* 그 주 금요일 */
  if (/다음 ?주/.test(due)) return add(((5 - base.getDay() + 7) % 7 || 7) + 7);
  if (/다음 회의|다음 시연/.test(due) && nextMeet) { const [a, b, c] = dparts(nextMeet); return new Date(a, b - 1, c); }
  return null;
}
let CALV = null;                               /* 보고 있는 달 · 고른 날 */
async function calendar(p) {
  const ms = inProj(p), maps = await Promise.all(ms.map(getMap));
  if (CUR.p !== p || CUR.kind !== 'cal') return;
  const older = [...ms].sort((a, b) => dkey(a.date) - dkey(b.date));      /* 오래된 순 */
  const items = [], undated = [], seen = new Set();
  older.forEach((m, i) => {
    const [y, mo, dd] = dparts(m.date);
    if (y) items.push({ t: 'meet', d: new Date(y, mo - 1, dd), title: titleOf(m, p), m });
    const map = maps[ms.indexOf(m)], next = older[i + 1];
    (map.todos || []).forEach(d => {
      const k = d.text + '|' + d.owner;
      if (seen.has(k)) return;
      seen.add(k);
      const at = dueDate(d.due || '', m.date, next && next.date);
      (at ? items : undated).push({ t: 'todo', d: at, title: d.text, owner: d.owner, due: d.due, todo: d, m });
    });
  });
  const key = dt => `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
  const byDay = {};
  items.forEach(x => (byDay[key(x.d)] = byDay[key(x.d)] || []).push(x));
  Object.values(byDay).forEach(l => l.sort((a, b) => (a.t === 'meet' ? 0 : 1) - (b.t === 'meet' ? 0 : 1)));   /* 회의 먼저 */

  const now = new Date(), today = key(now);
  const near = items.filter(x => x.d >= new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    .sort((a, b) => a.d - b.d);
  if (!CALV) { const f = near[0] ? near[0].d : now; CALV = { y: f.getFullYear(), m: f.getMonth(), sel: key(f) }; }

  const draw = () => {
    const first = new Date(CALV.y, CALV.m, 1), last = new Date(CALV.y, CALV.m + 1, 0);
    const cells = [];
    for (let i = 0; i < first.getDay(); i++) cells.push(null);
    for (let d = 1; d <= last.getDate(); d++) cells.push(new Date(CALV.y, CALV.m, d));
    while (cells.length % 7) cells.push(null);
    const selList = byDay[CALV.sel] || [];
    const [sy, sm, sd] = CALV.sel.split('-').map(Number);
    const row = x => x.t === 'meet'
      ? `<a class="crow cmeet" href="#/m/${esc(x.m.id)}"><i>회의</i><b>${esc(x.title)}</b><time>${esc(x.m.duration || '')}</time></a>`
      : `<button class="crow cdue tap" data-ev="${esc(x.m.id)}" data-t="${esc(x.todo.t)}" data-w="${esc(x.todo.who || '')}"
           data-q="${esc(x.todo.ev || '')}"><i>마감</i><b>${esc(x.title)}</b>
           <span class="ow${x.owner ? '' : ' none'}">${esc(x.owner || '담당 미정')}</span></button>`;
    $('#view').innerHTML = `
      <section class="sec cal">
        <header><h2>캘린더</h2>
          <div class="cnav"><button class="tap" data-mv="-1" aria-label="지난달">‹</button>
            <b>${CALV.y}년 ${CALV.m + 1}월</b>
            <button class="tap" data-mv="1" aria-label="다음달">›</button>
            <button class="tap tdy" data-mv="0">오늘</button></div>
        </header>
        <div class="cgrid">
          ${[...WD].map((w, i) => `<span class="ch${i === 0 ? ' sun' : ''}">${w}</span>`).join('')}
          ${cells.map(d => {
            if (!d) return '<span class="cd out"></span>';
            const k = key(d), list = byDay[k] || [];
            const cls = ['cd', k === today ? 'today' : '', k === CALV.sel ? 'on' : '', d.getDay() === 0 ? 'sun' : ''].join(' ');
            return `<button class="${cls}" data-d="${k}"><em>${d.getDate()}</em>
              ${list.slice(0, 2).map(x => `<span class="pill ${x.t === 'meet' ? 'pmeet' : 'pdue'}">${esc(x.t === 'meet' ? x.title : x.title)}</span>`).join('')}
              ${list.length > 2 ? `<span class="more">+${list.length - 2}</span>` : ''}</button>`;
          }).join('')}
        </div>
        <div class="cday">
          <h3>${sy}.${String(sm + 1).padStart(2, '0')}.${String(sd).padStart(2, '0')} ${WD[new Date(sy, sm, sd).getDay()]}</h3>
          ${selList.length ? selList.map(row).join('') : '<div class="empty">이 날에는 잡힌 일정이 없어요</div>'}
        </div>
        ${undated.length ? `<div class="cday undated"><h3>날짜 미정 <i>${undated.length}</i></h3>
          ${undated.map(x => `<button class="crow cdue tap" data-ev="${esc(x.m.id)}" data-t="${esc(x.todo.t)}"
            data-w="${esc(x.todo.who || '')}" data-q="${esc(x.todo.ev || '')}"><i>${esc(x.due || '기한 없음')}</i>
            <b>${esc(x.title)}</b><span class="ow${x.owner ? '' : ' none'}">${esc(x.owner || '담당 미정')}</span></button>`).join('')}</div>` : ''}
      </section>`;
    const v = $('#view');
    v.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const mv = +b.dataset.mv;
      if (!mv) { CALV = { y: now.getFullYear(), m: now.getMonth(), sel: today }; }
      else { const d = new Date(CALV.y, CALV.m + mv, 1); CALV.y = d.getFullYear(); CALV.m = d.getMonth(); }
      draw();
    });
    v.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { CALV.sel = b.dataset.d; draw(); });
    v.querySelectorAll('[data-q]').forEach(b => b.onclick = () => openEvidence(b.dataset.ev, b.dataset.q, b.dataset.w, b.dataset.t));
  };
  draw();
}

/* ================= 4. 회의록 — 최신순 · 안건별 ================= */
async function list(p) {
  const ms = inProj(p), maps = await Promise.all(ms.map(getMap));
  if (CUR.p !== p || CUR.kind !== 'list') return;
  let by = store.get('mn.by') || 'new';
  const v = $('#view');
  CUR.by = by;
  const draw = () => {
    let body;
    CUR.by = by;
    if (by === 'new') body = `<div class="rows">${ms.map((m, i) => meetRow(m, maps[i], i === 0)).join('')}</div>`;
    else {
      const ts = tracksOf(p, ms, maps);
      body = ['open', 'conditional', 'decision'].map(k => {
        const g = ts.filter(t => t.state === k);
        return g.length ? `<div class="grp"><h4><span class="st ${k}">${KO[k]}</span><i>${g.length}</i></h4><div class="grid2">${g.map(t =>
          `<a class="row tap" href="#/p/${esc(p.id)}/agenda/${esc(t.id)}"><div class="tx">
            <div class="meta">${esc(t.name)}<i>· ${t.span.map(m => esc(titleOf(m, p))).join(' → ')}</i><i>· 논의 ${t.secs.length}개</i></div>
            <h3>${esc(t.issue)}</h3><p>${esc(t.tail)}</p></div></a>`).join('')}</div></div>` : '';
      }).join('') || '<div class="empty">아직 안건이 없어요</div>';
    }
    v.innerHTML = `${projHead(p, `<span>회의 ${ms.length}개</span><span>최근 ${esc(fdate(ms[0].date))}</span>`)}
      <div class="pills" style="margin-top:26px" id="by"><button class="${by === 'new' ? 'on' : ''}" data-b="new">최신순</button><button class="${by === 'agenda' ? 'on' : ''}" data-b="agenda">안건별</button></div>
      <div style="margin-top:16px">${body}</div>`;
    projMenu();
    $('#by').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; by = b.dataset.b; store.set('mn.by', by); draw(); utNav(); };
  };
  draw();
}

/* 안건 축 — 주차와 상관없이 한 안건이 프로젝트 전체에서 어떻게 바뀌어 왔는가.
   projects.json 의 agenda 에 축을 적어 두었으면 그대로, 없으면 논의 묶음(group) 이름으로 모은다 */
function tracksOf(p, ms, maps) {
  const byId = {}; ms.forEach((m, i) => byId[nfc(m.id)] = { m, map: maps[i] });
  const pick = (mid, no) => { const g = byId[nfc(mid)];
    const sec = g && (g.map.sections || []).find(s => s.no === no);
    return sec ? { m: g.m, sec } : null; };
  const out = [];
  if ((p.agenda || []).length) p.agenda.forEach(t => {
    const secs = t.secs.map(r => { const i = r.lastIndexOf('#');
      return pick(r.slice(0, i), +r.slice(i + 1)); }).filter(Boolean);
    if (secs.length) out.push({ id: t.id, name: t.name, issue: t.issue, secs, refs: t.secs });
  });
  else [...ms].reverse().forEach(m => (byId[nfc(m.id)].map.sections || []).forEach(sec => {   /* 오래된 회의부터 */
    const name = sec.group || sec.title;
    let t = out.find(x => x.name === name);
    if (!t) out.push(t = { id: 'g' + (out.length + 1), name, secs: [], refs: [] });
    t.secs.push({ m, sec }); t.refs.push(m.id + '#' + sec.no);
  }));
  /* 축의 '지금'은 가장 나중 논의의 상태다 — 목록은 그 상태로 묶인다 */
  out.forEach(t => {
    const last = t.secs[t.secs.length - 1], r = last.sec.resolution || {};
    t.state = r.kind || 'open';
    t.tail = r.title || '결론 없이 넘어갔어요';
    t.span = [...new Set(t.secs.map(x => x.m.id))].map(id => t.secs.find(x => x.m.id === id).m);
    /* 안건 카드에 적히는 말은 플로우 맵의 검정 쟁점 카드와 같아야 한다.
       적어 둔 쟁점이 없으면 첫 논의의 쟁점 카드를 그대로 쓴다 */
    const i0 = (t.secs[0].sec.nodes || []).find(n => n.kind === 'issue');
    t.issue = t.issue || (i0 && i0.title) || t.name;
    t.secs.forEach(x => { x.turn = turnOf(x.sec); });
  });
  return out;
}
/* 흐름을 돌린 말 — 결론이 그렇게 나게 만든 한 마디 */
const TURNW = { con: 3, concern: 2, condition: 1 };
const TURNKO = { con: '반론', concern: '우려', condition: '조건', pro: '근거', position: '주장' };
function turnOf(sec) {
  const r = sec.resolution || {}, from = r.from || [];
  /* 미결은 결론 시각이 논의 머리에 찍혀 있다 — 그럴 때는 논의가 끝난 시각까지 본다 */
  const rt = r.t && r.kind !== 'open' ? secs(r.t) : secs(sec.t1 || '9:59:59');
  /* 미결 표시 노드는 결론을 다시 적은 것이라 계기가 될 수 없다 */
  const cand = (sec.nodes || []).filter(n => n.kind !== 'issue' && n.kind !== 'open' && secs(n.t) <= rt);
  const late = (a, b) => secs(a.t) - secs(b.t);
  /* 맞선 말·발목을 잡은 말이 있으면 그것이 계기다 — 흐름을 돌린 마지막 한 마디 */
  const held = cand.filter(n => TURNW[n.kind]).sort((a, b) => TURNW[a.kind] - TURNW[b.kind] || late(a, b)).pop();
  if (held) return held;
  /* 맞선 말이 없으면 결론이 딛고 선 근거 — 그 중 처음 나온 말이 흐름을 만든 말이다 */
  return cand.filter(n => n.kind === 'pro' && from.includes(n.parent)).sort(late)[0]
    || cand.filter(n => from.includes(n.id)).sort(late).pop()
    || cand[cand.length - 1] || null;
}
