<!doctype html><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 260px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, system-ui, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 14px; letter-spacing: -.01em; }
  button { width: 100%; padding: 9px; margin-bottom: 6px; border: 1px solid #0002; border-radius: 7px;
           background: #f6f6f7; font: inherit; cursor: pointer; }
  button:hover { background: #ececee; }
  #rec { background: #e03131; border-color: #c92a2a; color: #fff; }
  #pip { background: #364fc7; border-color: #2b3f9e; color: #fff; }
  #stop { background: #212529; border-color: #000; color: #fff; }
  #timer { font-variant-numeric: tabular-nums; font-size: 22px; margin: 4px 0 10px; }
  .hint { color: #888; font-size: 11px; margin: 8px 0 4px; }
  .err { color: #c92a2a; font-size: 11px; white-space: pre-wrap; }
  .hidden { display: none; }
  @media (prefers-color-scheme: dark) {
    button { background: #2a2a2c; border-color: #fff2; color: #eee; }
    button:hover { background: #363638; }
  }
</style>
<h1>meetnote</h1>
<button id="pip">🖥 데스크탑에 띄우기</button>
<div id="idle">
  <button id="rec">● 이 탭 녹음 시작</button>
  <p class="hint">회의 중인 탭(Meet/Zoom 웹)에서 눌러야 소리가 잡힙니다.<br>mp3 파일 테스트는 CLI로: <code>python meetnote.py x.mp3</code></p>
</div>
<div id="recording" class="hidden">
  <div id="timer">00:00</div>
  <button id="stop">■ 정지</button>
</div>
<div id="ready" class="hidden">
  <p class="hint">어디로 정리할까요?</p>
  <button data-t="figjam">🗺️ FigJam 도식</button>
  <button data-t="ppt">📊 PowerPoint</button>
  <button data-t="word">📄 Word</button>
  <button id="again">↩︎ 다시 녹음</button>
</div>
<div id="sending" class="hidden"><p>보내는 중…</p></div>
<div id="sent" class="hidden">
  <p>✅ 처리 중입니다.<br>끝나면 데스크탑에서 자동으로 열립니다.</p>
  <button id="again2">↩︎ 처음으로</button>
</div>
<div id="error" class="hidden">
  <p class="err" id="errmsg"></p>
  <button id="again3">↩︎ 처음으로</button>
</div>
<script src="popup.js"></script>
