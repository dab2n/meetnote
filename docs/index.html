<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>meetnote — 회의 전개 시각화</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f2f2f3; --panel:#fff; --line:#e3e3e6; --line2:#eeeef0;
  --ink:#17181c; --ink2:#42444b; --dim:#8b8e96;
  --blue:#2f6bdd; --green:#1c7a4e; --red:#c53f2d; --gray:#9aa0a8; --gold:#e2562a;
  --rail:380px; --top:52px; --player:0px;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}

/* ---------- 상단 ---------- */
.top{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:14px;font-weight:800;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--dim);font-weight:600}
.file{font-size:12.5px;color:var(--dim);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:650;color:var(--ink2);border:1px solid var(--line)}
.tbtn:hover{background:#f7f7f8}
.tbtn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.prog .track{width:110px;height:3px;border-radius:99px;background:var(--line)}
.prog .fillp{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .25s}
body.idle .prog,body.idle .only-run{display:none}

/* ---------- 본문 ---------- */
main{position:fixed;top:var(--top);left:0;right:0;bottom:var(--player);
  display:grid;grid-template-columns:var(--rail) 9px minmax(0,1fr)}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rz{position:relative;display:grid;place-items:center;cursor:col-resize;background:var(--bg)}
.rz:before{content:"";width:3px;height:40px;border-radius:99px;background:#d6d7da}
.rz:hover:before{background:var(--dim)}

.rhead{padding:11px 13px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.rhead h2{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--dim)}
.search{flex:1;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;background:#f3f3f5}
.search input{width:100%;font-size:12.5px}
.search input::placeholder{color:var(--dim)}
#qn{font-size:11px;color:var(--dim);white-space:nowrap}
#tr{flex:1;overflow:auto;padding:6px 8px 40px}

.seg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 9px;border-radius:11px;cursor:pointer}
.seg:hover{background:#f6f6f8}
.seg.cur{background:#eef3fe}
.seg.cur .seg-h time{color:var(--blue)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:750;color:#fff;background:var(--c)}
.seg-h{display:flex;align-items:baseline;gap:6px}
.seg-h b{font-size:13.5px;font-weight:750}
.seg-h time{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.seg p{font-size:13.5px;line-height:1.62;color:var(--ink2);margin-top:3px}
.seg mark{background:#ffe9a8;color:inherit;border-radius:3px}
.seg.node-of{box-shadow:inset 2px 0 0 var(--gold)}

/* ---------- 캔버스 ---------- */
.stage{position:relative;overflow:hidden;background:var(--bg);touch-action:none}
.stage.grab{cursor:grabbing}
#cv{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:1.6px;opacity:0;transition:opacity .35s}
#edges path.on{opacity:1}
#edges text{font:600 10.5px var(--font);opacity:0;transition:opacity .35s}
#edges text.on{opacity:1}
.e-support{stroke:var(--green)}                     .l-support{fill:var(--green)}
.e-oppose{stroke:var(--red);stroke-dasharray:6 5}   .l-oppose{fill:var(--red)}
.e-propose{stroke:var(--blue)}                      .l-propose{fill:var(--blue)}
.e-ask{stroke:var(--gray);stroke-dasharray:2 4}     .l-ask{fill:var(--gray)}
.e-decide{stroke:var(--gold)}                       .l-decide{fill:var(--gold)}
.e-flow{stroke:#c8c9ce;stroke-width:2px}
.e-converge{stroke:var(--gold);stroke-width:2px}
.e-openconv{stroke:#b6b9bf;stroke-dasharray:2 4}

.node{position:absolute;width:224px;padding:11px 13px;border-radius:14px;background:var(--panel);
  border:1.5px solid var(--line);cursor:pointer;opacity:0;transform:scale(.94);
  transition:opacity .32s,transform .32s,box-shadow .18s}
.node.in{opacity:1;transform:none}
.node:hover{box-shadow:0 3px 14px rgba(20,22,28,.13)}
.node h4{font-size:13.5px;font-weight:750;line-height:1.42;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node p{margin-top:5px;font-size:12px;line-height:1.55;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .m{margin-top:7px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.node .m .d{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;font-weight:750;color:#fff;background:var(--c,#9aa0a8)}
.node .tag{margin-left:auto;font-size:10px;font-weight:750;padding:1px 6px;border-radius:99px}

.node.topic{width:250px;background:var(--ink);border-color:var(--ink);color:#fff}
.node.topic h4{font-size:15px;font-weight:800}
.node.topic p,.node.topic .m{color:rgba(255,255,255,.62)}
.node.topic .no{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-bottom:4px}

.node.concl{width:250px;background:var(--gold);border-color:var(--gold);color:#fff;
  box-shadow:0 4px 18px rgba(226,86,42,.26)}
.node.concl h4{font-size:14.5px;font-weight:800}
.node.concl p,.node.concl .m{color:rgba(255,255,255,.8)}
.node.concl .tag{background:rgba(255,255,255,.24);color:#fff}

.node.open{width:250px;background:#ebebee;border:1.5px dashed #bcbfc5;color:#5f636b}
.node.open h4{font-size:14px;font-weight:750}
.node.open p,.node.open .m{color:#83878f}
.node.open .tag{background:rgba(0,0,0,.06);color:#6d727a}

.node.decide{border-color:var(--gold)}
.node.decide .tag{background:rgba(226,86,42,.12);color:var(--gold)}

.node.support{border-color:var(--green)}
.node.support .tag{background:rgba(28,122,78,.12);color:var(--green)}
.node.oppose{border-color:var(--red);border-style:dashed}
.node.oppose .tag{background:rgba(197,63,45,.12);color:var(--red)}
.node.propose{border-color:var(--blue)}
.node.propose .tag{background:rgba(47,107,221,.12);color:var(--blue)}
.node.ask{border-color:var(--gray);border-style:dotted}
.node.ask .tag{background:rgba(154,160,168,.16);color:#6d727a}
.node.live{box-shadow:0 0 0 3px rgba(23,24,28,.12)}
.node.playing{box-shadow:0 0 0 3px rgba(47,107,221,.3)}

.far .node p,.far .node .m{display:none}
.veryfar .node h4{-webkit-line-clamp:1}

/* ---------- 범례 · 줌 ---------- */
.legend{position:absolute;left:14px;top:12px;z-index:6;display:flex;flex-wrap:wrap;gap:5px 12px;
  padding:8px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.legend b{font-weight:650}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}
.zoom{position:absolute;right:14px;bottom:14px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;
  border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.zoom button{width:28px;height:28px;border-radius:7px;font-size:14px;color:var(--dim)}
.zoom button:hover{background:#f2f2f4;color:var(--ink)}
.zoom .lv{width:44px;text-align:center;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.zoom .fit{width:auto;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--ink2)}

/* ---------- 드롭존 ---------- */
.drop{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:var(--bg)}
body.idle .drop,.drop.over{display:grid}
.drop.over{background:#eaf0fd}
.dz{width:min(560px,86vw);text-align:center;padding:44px 34px;border-radius:20px;
  border:1.5px dashed #c9cbd1;background:var(--panel)}
.drop.over .dz{border-color:var(--blue)}
.dz h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.dz .sub{margin-top:9px;font-size:13.5px;line-height:1.7;color:var(--dim)}
.dz .btns{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dz .big{height:38px;padding:0 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700}
.dz .ghost{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink2)}
.dz .note{margin-top:16px;font-size:11.5px;color:#a7aab1}

/* ---------- 토스트 ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--player) + 22px);transform:translate(-50%,14px);z-index:30;
  max-width:88vw;padding:11px 16px;border-radius:12px;background:var(--ink);color:#fff;
  font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  box-shadow:0 6px 24px rgba(20,22,28,.24)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast em{font-style:normal;color:rgba(255,255,255,.62);font-weight:600;margin-left:8px}

/* ---------- 플레이어 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:22;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--panel);border-top:1px solid var(--line)}
body.noaudio .player{display:none}
.player #pp{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.bar{flex:1;height:4px;border-radius:99px;background:var(--line);cursor:pointer}
.bar .fill{height:100%;width:0;border-radius:99px;background:var(--ink)}
.tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.now{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--dim)}

/* ---------- 모바일 ---------- */
.tabs{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;bottom:calc(var(--player) + 48px)}
  .rail,.rz{display:none}
  body.tab-src .rail{display:flex}
  body.tab-src .stage{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:var(--player);height:48px;z-index:21;
    background:var(--panel);border-top:1px solid var(--line)}
  body.idle .tabs{display:none}
  .tabs button{flex:1;font-size:12.5px;font-weight:700;color:var(--dim)}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
  .legend{left:8px;top:8px;right:8px;font-size:10.5px}
  .file,.top .brand i{display:none}
  .now{display:none}
}
</style>
</head>
<body class="idle noaudio">

<header class="top">
  <span class="brand">meetnote <i>· 회의 전개</i></span>
  <span class="file" id="fname"></span>
  <span class="sp"></span>
  <span class="prog"><span class="track"><span class="fillp" id="fillp"></span></span><span id="pn">0 / 0</span></span>
  <button class="tbtn only-run" id="pause">❚❚ 일시정지</button>
  <button class="tbtn only-run" id="speed">2×</button>
  <button class="tbtn only-run" id="replay">↻ 다시</button>
  <button class="tbtn pri" id="newfile">＋ 파일</button>
</header>

<main>
  <aside class="rail" id="src">
    <div class="rhead">
      <h2>원문</h2>
      <label class="search">🔎<input id="q" placeholder="발언 검색"></label>
      <span id="qn"></span>
    </div>
    <div id="tr"></div>
  </aside>
  <div class="rz" id="rzx"></div>
  <section class="stage" id="vp">
    <div class="legend">
      <span><i style="border-color:#2f6bdd"></i><b>제안</b></span>
      <span><i style="border-color:#1c7a4e"></i><b>동의</b></span>
      <span><i style="border-color:#c53f2d;border-top-style:dashed"></i><b>반대·우려</b></span>
      <span><i style="border-color:#9aa0a8;border-top-style:dotted"></i><b>질문·미결</b></span>
      <span><span class="sw" style="background:#17181c"></span><b>주제</b></span>
      <span><span class="sw" style="background:#e2562a"></span><b>결론</b></span>
      <span><span class="sw" style="background:#ebebee;border:1px dashed #bcbfc5"></span><b>미결</b></span>
    </div>
    <div id="cv"><svg id="edges"></svg></div>
    <div class="zoom">
      <button id="zout">−</button><span class="lv" id="zlv">100%</span><button id="zin">＋</button>
      <button class="fit" id="zfit">전체 보기</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="graph" class="on">노드</button>
  <button data-tab="src">원문</button>
</nav>

<div class="player">
  <button id="pp">▶</button>
  <span class="tm" id="cur">0:00</span>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <span class="tm" id="dur">0:00</span>
  <span class="now" id="now"></span>
</div>

<div class="drop" id="drop">
  <div class="dz">
    <h1>회의 파일을 놓으세요</h1>
    <p class="sub">텍스트 기록(.txt)을 넣으면 논의가 시간 순서대로 노드로 펼쳐집니다.<br>
      음성(.m4a·.mp3)을 함께 넣으면 노드·원문이 재생 위치에 연결됩니다.</p>
    <div class="btns">
      <button class="big" id="pick">파일 선택</button>
      <button class="ghost" id="sample">예시 회의로 보기</button>
    </div>
    <p class="note">파일은 브라우저 안에서만 처리되고 어디에도 올라가지 않습니다.</p>
  </div>
</div>
<input type="file" id="fi" multiple accept=".txt,.json,audio/*" hidden>
<div class="toast" id="toast"></div>
<audio id="au" preload="metadata"></audio>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const d = document.createElement(t); if (c) d.className = c; if (h != null) d.innerHTML = h; return d; };
const svgEl = (t, a) => { const n = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const esc = s => (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const mmss = t => { t = Math.max(0, Math.round(t)); const h = t / 3600 | 0, m = (t % 3600) / 60 | 0, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const secs = s => s.split(':').reverse().reduce((a, v, i) => a + (+v) * [1, 60, 3600][i], 0);

const OX = 300, OY = 1000;          /* 캔버스 원점 오프셋 (음수 좌표 방지) */
const au = $('#au');
let TRANS = [], SEGN = [], NODES = [], EDGES = [], bounds = { x0: 0, y0: 0, w: 1, h: 1 };
let view = { x: 0, y: 0, z: .8 }, curSeg = -1, audioOK = false, avatar = {};

/* ================= 1. 파싱 ================= */
const RE_HEAD = /^(\S{1,10})\s+((?:\d{1,2}:)?\d{1,2}:\d{2})\s*$/;
function parseTxt(text) {
  const segs = []; let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/^﻿/, '').trim();
    const m = line.match(RE_HEAD);
    if (m) { cur = { t: secs(m[2]), s: m[1], l: [] }; segs.push(cur); return; }
    if (!line || !cur) return;
    cur.l.push(line);
  });
  const out = [];                    /* 같은 사람이 이어 말하면 한 덩어리로 */
  segs.forEach(s => {
    const p = out[out.length - 1];
    if (p && p.s === s.s && s.t - p.t < 30) p.l.push(...s.l); else out.push(s);
  });
  return out;
}

/* ================= 2. 논의 구조 뽑기 ================= */
const DECIDE = /(하기로|하는 걸로|가는 걸로|가져가는 걸로|확정|결론적|정리하면|결정|합의|그렇게 하죠|그렇게 합시다|하면 될 것 같|하는 게 맞|잡고 가|로 가죠|정하자|정합시다|픽스)/;
const RULES = [
  ['decide',  DECIDE],
  ['oppose',  /(반대|걱정|우려|위험|문제가|애매|어려울|안 될|안될|힘들|아닌 것 같|별로|무리|그건 좀|안 맞)/],
  ['support', /(맞아|맞습니다|맞죠|동의|좋아|좋습니다|좋은데|괜찮|찬성|저도|그게 낫|공감)/],
  ['propose', /(어때|어떨까|제안|하면 좋겠|하는 게 좋|해야 될 것 같|해보면|가져가면|넣으면|바꾸면|이렇게 하면)/],
  ['ask',     /(뭐예요|뭔가요|어떻게|왜 |인가요|일까요|맞나요|있나요|되나요|\?)/],
];
const STANCE_KO = { decide: '정리', oppose: '반대', support: '동의', propose: '제안', ask: '질문' };

const classify = text => (RULES.find(([, re]) => re.test(text)) || ['ask'])[0];
const tokens = s => (s.match(/[가-힣]{2,}|[A-Za-z]{3,}/g) || [])
  .map(w => w.replace(/(입니다|습니다|에서|으로|하고|한테|까지|부터|이랑|는데|라고|해서|이고|에게|하는|이런|그런|같은|것도|것을)$/, ''))
  .filter(w => w.length > 1);
const sentences = t => t.split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(Boolean);

/* 말버릇 문장을 피하고 내용이 담긴 문장을 고른다 */
function keyIdx(ss) {
  let best = 0, bs = -1e9;
  ss.forEach((s, i) => {
    let sc = tokens(s).length * 2 + Math.min(s.length, 110) / 10;
    if (s.length < 14) sc -= 14;
    if (/^(네|응|어|음|아|그쵸|맞아|맞습니다|아니|그러니까|그래서|근데)[ ,.]/.test(s)) sc -= 4;
    if (i === 0) sc += 1;
    if (sc > bs) { bs = sc; best = i; }
  });
  return best;
}
/* 그 발언에서 실제로 태도를 드러낸 문장을 고른다 */
const RE_OF = Object.fromEntries(RULES);
function pickBy(text, re, max) {
  const ss = sentences(text);
  const hit = ss.filter(s => re.test(s) && s.length > 12);
  const pool = hit.length ? hit : ss;
  const s = pool[keyIdx(pool)] || text;
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}
function keyText(text, max, more) {
  const ss = sentences(text);
  if (!ss.length) return text.slice(0, max);
  const i = keyIdx(ss);
  const pick = more ? ss.slice(i + 1).join(' ') || ss.slice(0, i).join(' ') : ss[i];
  return pick.length > max ? pick.slice(0, max - 1) + '…' : pick;
}

function build(segs) {
  const turns = segs.map((s, i) => {
    const text = s.l.join(' ');
    return { i, t: s.t, who: s.s, text, len: text.length, tk: new Set(tokens(text)), stance: classify(text) };
  }).filter(x => x.len > 14);
  if (turns.length < 5) return { nodes: [], edges: [] };

  turns.forEach(x => {
    let sc = Math.min(x.len, 700) / 55;
    if (x.stance === 'decide') sc += 6;
    if (x.stance === 'oppose') sc += 4;
    if (x.stance === 'propose') sc += 3;
    if (x.stance === 'support') sc += 1.5;
    if (x.len < 45) sc -= 3;
    x.score = sc;
  });

  /* 주제 경계 — 앞 6턴에 없던 어휘가 몰리는 긴 발언 */
  const cand = turns.map((x, i) => {
    if (i === 0) return { i, v: 1e9 };
    const prev = new Set();
    for (let j = Math.max(0, i - 6); j < i; j++) turns[j].tk.forEach(w => prev.add(w));
    let hit = 0; x.tk.forEach(w => { if (prev.has(w)) hit++; });
    return { i, v: (1 - hit / Math.max(6, x.tk.size)) * Math.min(1, x.len / 260) };
  }).sort((a, b) => b.v - a.v);

  const span = turns[turns.length - 1].t - turns[0].t;
  const want = Math.max(3, Math.min(9, Math.round(span / 560)));
  const bnd = [0], minGap = Math.max(90, span / (want + 2));
  for (const c of cand) {
    if (bnd.length >= want) break;
    if (bnd.every(b => Math.abs(turns[b].t - turns[c.i].t) > minGap && Math.abs(b - c.i) > 4)) bnd.push(c.i);
  }
  bnd.sort((a, b) => a - b);

  const nodes = [], edges = [];
  const add = o => { o.id = nodes.length; nodes.push(o); return o; };
  let prev = null;

  bnd.forEach((b, bi) => {
    const end = bi + 1 < bnd.length ? bnd[bi + 1] : turns.length;
    const chunk = turns.slice(b, end), head = chunk[0];
    const topic = add({ kind: 'topic', no: bi + 1, t: head.t, who: head.who,
      title: keyText(head.text, 40), body: '', turn: head });
    if (prev) edges.push({ a: prev, b: topic, kind: 'flow' });

    /* 결론은 논의 후반부에서 찾는다 */
    const rest = chunk.slice(1);
    const tail = rest.slice(Math.floor(rest.length * .45));
    const concl = [...tail].reverse().find(x => DECIDE.test(x.text) && x.len > 50)
      || [...rest].reverse().find(x => DECIDE.test(x.text) && x.len > 60);

    const k = Math.max(2, Math.min(4, Math.round(rest.length / 8)));
    const picked = rest.filter(x => x !== concl)
      .sort((p, q) => q.score - p.score).slice(0, k).sort((p, q) => p.t - q.t);

    let last = null; const made = [];
    picked.forEach(x => {
      const parent = (last && (x.stance === 'support' || x.stance === 'oppose')) ? last : topic;
      const n = add({ kind: 'op', stance: x.stance, t: x.t, who: x.who,
        title: pickBy(x.text, RE_OF[x.stance], 42), body: keyText(x.text, 90, true), turn: x, parent, root: topic });
      edges.push({ a: parent, b: n, kind: x.stance, label: STANCE_KO[x.stance] });
      parent.hasChild = true; made.push(n); last = n;
    });

    const leaves = made.filter(n => !n.hasChild);
    const c = concl
      ? add({ kind: 'concl', t: concl.t, who: concl.who, root: topic, turn: concl,
          title: pickBy(concl.text, DECIDE, 44), body: keyText(concl.text, 90, true) })
      : add({ kind: 'open', root: topic, turn: made.length ? made[made.length - 1].turn : head,
          t: (made.length ? made[made.length - 1] : topic).t,
          who: (made.length ? made[made.length - 1] : topic).who,
          title: '결론 없이 넘어간 주제', body: '' });
    (leaves.length ? leaves : [topic]).forEach(n =>
      edges.push({ a: n, b: c, kind: concl ? 'converge' : 'openconv' }));
    topic.concl = c; prev = c;
  });

  nodes.sort((a, b) => a.t - b.t || a.id - b.id);
  return { nodes, edges };
}

/* ================= 3. 배치 ================= */
const COL = 300, ROWCOLS = 14, ROWGAP = 1150, SLOT = [-170, 170, -340, 340, -510, 510];
function layout(nodes) {
  const occ = {};
  let col = 0, row = 0;
  const place = (n, c, ly) => {
    const key = row + ':' + c, used = occ[key] || (occ[key] = []);
    while (used.some(u => Math.abs(u - ly) < 140)) ly += 140;
    used.push(ly);
    n.col = c; n.row = row; n.ly = ly; n.x = c * COL; n.y = ly + row * ROWGAP;
  };
  nodes.filter(n => n.kind === 'topic').forEach(topic => {
    if (col > ROWCOLS) { row++; col = 0; }        /* 가로로 너무 길어지면 다음 줄로 */
    place(topic, col, 0);
    let maxCol = col, ci = 0;
    nodes.filter(n => (n.kind === 'op') && n.root === topic).forEach(n => {
      const c = n.parent.col + 1;
      place(n, c, n.parent === topic ? SLOT[ci++ % SLOT.length] : n.parent.ly + 140);
      maxCol = Math.max(maxCol, c);
    });
    if (topic.concl) place(topic.concl, ++maxCol, 0);
    col = maxCol + 1;
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  nodes.forEach(n => {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + 252); y1 = Math.max(y1, n.y + 132);
  });
  bounds = { x0: x0 + OX - 70, y0: y0 + OY - 70, w: x1 - x0 + 140, h: y1 - y0 + 140 };
}

/* ================= 4. 그리기 ================= */
function render(g) {
  const cv = $('#cv'), sv = $('#edges');
  [...cv.children].forEach(c => { if (c !== sv) c.remove(); });
  sv.textContent = '';

  g.nodes.forEach(n => {
    const d = el('div', 'node ' + (n.kind === 'op' ? n.stance : n.kind));
    d.style.left = (n.x + OX) + 'px'; d.style.top = (n.y + OY) + 'px';
    const tag = n.kind === 'concl' ? '<span class="tag">결론</span>'
      : n.kind === 'open' ? '<span class="tag">미결</span>'
      : n.kind === 'op' ? `<span class="tag">${STANCE_KO[n.stance]}</span>` : '';
    d.innerHTML = (n.kind === 'topic' ? `<div class="no">주제 ${n.no}</div>` : '')
      + `<h4>${esc(n.title)}</h4>`
      + (n.body ? `<p>${esc(n.body)}</p>` : '')
      + `<div class="m"><span class="d" style="--c:${avatar[n.who] || '#9aa0a8'}">${esc(n.who.slice(0, 1))}</span>`
      + `${esc(n.who)} · ${mmss(n.t)}${tag}</div>`;
    d.onclick = () => {
      NODES.forEach(o => o.dom.classList.remove('live'));
      d.classList.add('live'); seek(n.t);
    };
    n.dom = d; cv.append(d);
  });

  g.edges.forEach(e => {
    const A = e.a, B = e.b;
    const ax = A.x + OX + A.dom.offsetWidth, ay = A.y + OY + A.dom.offsetHeight / 2;
    const bx = B.x + OX, by = B.y + OY + B.dom.offsetHeight / 2;
    let d;
    if (bx < ax) {                                   /* 줄바꿈 — 오른쪽 끝에서 다음 줄 왼쪽으로 */
      const m = (ay + by) / 2;
      d = `M ${ax} ${ay} C ${ax + 140} ${ay}, ${ax + 140} ${m}, ${ax} ${m} L ${bx} ${m} C ${bx - 140} ${m}, ${bx - 140} ${by}, ${bx} ${by}`;
    } else {
      const dx = Math.max(46, Math.abs(bx - ax) * .55);
      d = `M ${ax} ${ay} C ${ax + dx} ${ay}, ${bx - dx} ${by}, ${bx} ${by}`;
    }
    e.path = svgEl('path', { d, class: 'e-' + e.kind });
    sv.append(e.path);
    if (e.label) {
      e.text = svgEl('text', { x: (ax + bx) / 2, y: (ay + by) / 2 - 7, class: 'l-' + e.kind, 'text-anchor': 'middle' });
      e.text.textContent = e.label; sv.append(e.text);
    }
  });
  sv.style.width = (bounds.x0 + bounds.w + 300) + 'px';
  sv.style.height = (bounds.y0 + bounds.h + 300) + 'px';
  NODES = g.nodes; EDGES = g.edges;
}

/* ================= 5. 시간순 전개 ================= */
let timer = null, step = 0, speed = 2, paused = false;
function play() {
  clearTimeout(timer);
  if (paused) return;
  if (step >= NODES.length) return done();
  const n = NODES[step++];
  n.dom.classList.add('in');
  EDGES.forEach(e => {
    if (e.b === n && e.a.dom.classList.contains('in')) {
      e.path.classList.add('on'); if (e.text) e.text.classList.add('on');
    }
  });
  NODES.forEach(o => o.dom.classList.remove('live'));
  n.dom.classList.add('live');
  ensureVisible(n);
  $('#fillp').style.width = (step / NODES.length * 100) + '%';
  $('#pn').textContent = `${step} / ${NODES.length}`;
  timer = setTimeout(play, (n.kind === 'concl' || n.kind === 'open' ? 1150 : n.kind === 'topic' ? 950 : 640) / speed);
}
function done() {
  NODES.forEach(o => o.dom.classList.remove('live'));
  const t = NODES.filter(n => n.kind === 'topic').length;
  const c = NODES.filter(n => n.kind === 'concl').length;
  const o = NODES.filter(n => n.kind === 'open').length;
  toast(`✓ 회의 전개 정리 완료<em>주제 ${t} · 의견 ${NODES.length - t - c - o} · 결론 ${c} · 미결 ${o}</em>`, 5600);
  fit(false);
}
function toast(html, ms) {
  const t = $('#toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
$('#pause').onclick = e => {
  paused = !paused; e.currentTarget.textContent = paused ? '▶ 이어보기' : '❚❚ 일시정지';
  if (!paused) play();
};
$('#speed').onclick = e => { speed = { 1: 2, 2: 4, 4: 1 }[speed]; e.currentTarget.textContent = speed + '×'; };
$('#replay').onclick = () => {
  clearTimeout(timer); step = 0; paused = false; $('#pause').textContent = '❚❚ 일시정지';
  NODES.forEach(n => n.dom.classList.remove('in', 'live', 'playing'));
  EDGES.forEach(e => { e.path.classList.remove('on'); if (e.text) e.text.classList.remove('on'); });
  fit(true); play();
};

/* ================= 6. 팬 · 줌 ================= */
const vp = $('#vp'), cv = $('#cv');
function apply() {
  cv.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  $('#zlv').textContent = Math.round(view.z * 100) + '%';
  cv.classList.toggle('far', view.z < .5);
  cv.classList.toggle('veryfar', view.z < .28);
}
function zoomAt(cx, cy, nz) {
  nz = Math.min(1.6, Math.max(.08, nz));
  view.x = cx - (cx - view.x) * (nz / view.z);
  view.y = cy - (cy - view.y) * (nz / view.z);
  view.z = nz; apply();
}
function fit(initial) {
  const r = vp.getBoundingClientRect(), padT = 78, padB = 62, padX = 26;
  const aw = r.width - padX * 2, ah = r.height - padT - padB;
  if (initial && NODES.length) {
    view.z = .8;
    const n = NODES[0];
    view.x = padX + 30 - (n.x + OX) * view.z;
    view.y = padT + ah / 2 - (n.y + OY + 55) * view.z;
  } else {
    view.z = Math.max(.08, Math.min(1, Math.min(aw / bounds.w, ah / bounds.h)));
    view.x = padX - bounds.x0 * view.z + (aw - bounds.w * view.z) / 2;
    view.y = padT - bounds.y0 * view.z + (ah - bounds.h * view.z) / 2;
  }
  apply();
}
function ensureVisible(n) {
  const r = vp.getBoundingClientRect();
  const sx = (n.x + OX) * view.z + view.x, sy = (n.y + OY) * view.z + view.y;
  const w = n.dom.offsetWidth * view.z, h = n.dom.offsetHeight * view.z;
  const mx = Math.min(190, r.width * .22), my = Math.min(130, r.height * .2);
  let need = false;
  if (sx < mx) { view.x += mx - sx; need = true; } else if (sx + w > r.width - mx) { view.x -= sx + w - (r.width - mx); need = true; }
  if (sy < my) { view.y += my - sy; need = true; } else if (sy + h > r.height - my) { view.y -= sy + h - (r.height - my); need = true; }
  if (need) { cv.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)'; apply(); setTimeout(() => cv.style.transition = '', 520); }
}
function centerOn(n) {
  const r = vp.getBoundingClientRect();
  view.x = r.width / 2 - (n.x + OX + 112) * view.z;
  view.y = r.height / 2 - (n.y + OY + 55) * view.z;
  cv.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)'; apply();
  setTimeout(() => cv.style.transition = '', 380);
}
$('#zin').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.z * 1.25); };
$('#zout').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.z / 1.25); };
$('#zfit').onclick = () => fit(false);

let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.node,.zoom,.legend')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, id: e.pointerId };
  vp.setPointerCapture(e.pointerId); vp.classList.add('grab');
});
vp.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); apply();
});
['pointerup', 'pointercancel'].forEach(ev => vp.addEventListener(ev, () => { drag = null; vp.classList.remove('grab'); }));
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  if (e.ctrlKey || e.metaKey) zoomAt(cx, cy, view.z * Math.exp(-e.deltaY / 220));
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });
const pts = new Map();
vp.addEventListener('pointerdown', e => pts.set(e.pointerId, e));
vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  if (pts.size === 2) {
    drag = null;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (vp._pd) { const r = vp.getBoundingClientRect();
      zoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, view.z * d / vp._pd); }
    vp._pd = d;
  }
});
['pointerup', 'pointercancel'].forEach(ev => vp.addEventListener(ev, e => { pts.delete(e.pointerId); if (pts.size < 2) vp._pd = 0; }));

/* ================= 7. 원문 ================= */
const AVCOLOR = ['#2f7d63', '#4a6da8', '#8a5a86', '#a8703c', '#5f6b7a', '#3f7d8a'];
function renderTranscript() {
  const w = $('#tr'); w.textContent = '';
  const marked = new Set(NODES.map(n => n.turn && n.turn.i));
  TRANS.forEach((s, i) => {
    const d = el('div', 'seg'); d.id = 'seg' + i;
    if (marked.has(i)) d.classList.add('node-of');
    const av = el('span', 'av', esc(s.s.slice(0, 1)));
    av.style.setProperty('--c', avatar[s.s] || '#5f6b7a');
    const body = el('div');
    body.append(el('div', 'seg-h', `<b>${esc(s.s)}</b><time>${mmss(s.t)}</time>`));
    s.l.forEach(line => body.append(el('p', null, esc(line))));
    d.append(av, body);
    d.onclick = () => seek(s.t);
    w.append(d);
  });
  applySearch();
}
$('#q').oninput = applySearch;
function applySearch() {
  const q = $('#q').value.trim(), segs = $('#tr').children;
  if (!q) {
    [...segs].forEach((d, i) => { d.hidden = false; paint(d, TRANS[i], null); });
    $('#qn').textContent = ''; return;
  }
  let n = 0;
  [...segs].forEach((d, i) => {
    const hit = TRANS[i].l.some(l => l.includes(q)) || TRANS[i].s.includes(q);
    d.hidden = !hit; if (hit) { n++; paint(d, TRANS[i], q); }
  });
  $('#qn').textContent = n + '건';
}
function paint(d, seg, q) {
  const ps = d.querySelectorAll('p');
  seg.l.forEach((line, i) => { ps[i].innerHTML = q ? esc(line).split(esc(q)).join(`<mark>${esc(q)}</mark>`) : esc(line); });
}

/* ================= 8. 오디오 ================= */
function seek(t) { seekTo(t); if (audioOK) au.play().catch(() => {}); }
function seekTo(t) {
  t = Math.max(0, t);
  if (audioOK) au.currentTime = t;
  mark(t, true);
}
$('#pp').onclick = () => { if (audioOK) au.paused ? au.play() : au.pause(); };
au.onplay = () => $('#pp').textContent = '❚❚';
au.onpause = () => $('#pp').textContent = '▶';
au.onloadedmetadata = () => {
  $('#dur').textContent = mmss(au.duration);
  audioOK = true; document.body.classList.remove('noaudio'); offsets();
};
$('#bar').onclick = e => {
  const b = e.currentTarget.getBoundingClientRect();
  seekTo((e.clientX - b.left) / b.width * (au.duration || 0));
};
au.ontimeupdate = () => mark(au.currentTime, false);
function mark(t, force) {
  const d = au.duration || (TRANS.length ? TRANS[TRANS.length - 1].t + 30 : 1);
  $('#fill').style.width = (t / d * 100) + '%';
  $('#cur').textContent = mmss(t);
  let lo = 0, hi = SEGN.length - 1, i = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (SEGN[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
  if (i === curSeg && !force) return;
  const prev = document.getElementById('seg' + curSeg); if (prev) prev.classList.remove('cur');
  curSeg = i;
  const now = document.getElementById('seg' + i);
  if (now) {
    now.classList.add('cur');
    now.scrollIntoView({ block: 'center', behavior: force ? 'auto' : 'smooth' });
    $('#now').textContent = `${TRANS[i].s} · ${TRANS[i].l[0] || ''}`;
  }
  let hitNode = null;
  NODES.forEach(n => {
    const on = n.turn && n.turn.i === i;
    n.dom.classList.toggle('playing', on);
    if (on) hitNode = n;
  });
  if (hitNode && hitNode.dom.classList.contains('in')) centerOn(hitNode);
}

const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); take([...e.dataTransfer.files]); });
$('#pick').onclick = () => $('#fi').click();
$('#newfile').onclick = () => document.body.classList.add('idle');
$('#fi').onchange = e => take([...e.target.files]);
$('#sample').onclick = async () => {
  const j = await (await fetch('data/2026-06-15.transcript.json')).json();
  start(j.segments, '예시 · NEWTON 통합 회의 2026.06.15', 'audio/2026-06-15.m4a');
};

async function take(files) {
  const txt = files.find(f => /\.(txt|json)$/i.test(f.name));
  const snd = files.find(f => /^audio\//.test(f.type) || /\.(m4a|mp3|wav|aac|ogg)$/i.test(f.name));
  if (!txt) {
    toast(snd ? '음성만으로는 내용을 읽지 못합니다 · 기록 txt를 함께 넣어주세요' : '.txt 기록 파일을 넣어주세요', 4200);
    return;
  }
  const raw = await txt.text();
  let segs;
  try {
    segs = /\.json$/i.test(txt.name) ? (JSON.parse(raw).segments || JSON.parse(raw)) : parseTxt(raw);
  } catch { segs = null; }
  if (!segs || segs.length < 5) { toast('발언을 읽지 못했습니다 · “이름 00:00” 형식인지 확인해주세요', 4200); return; }
  start(segs, txt.name, snd ? URL.createObjectURL(snd) : null);
}

function start(segs, name, audioSrc) {
  TRANS = segs; SEGN = segs.map(s => s.t); curSeg = -1;
  avatar = {}; [...new Set(segs.map(s => s.s))].forEach((p, i) => avatar[p] = AVCOLOR[i % AVCOLOR.length]);
  $('#fname').textContent = name;

  const g = build(segs);
  if (!g.nodes.length) { toast('구조를 만들 만한 논의를 찾지 못했습니다', 3600); return; }
  layout(g.nodes);
  document.body.classList.remove('idle');
  drop.classList.remove('over');
  render(g);
  renderTranscript();

  audioOK = false; document.body.classList.add('noaudio'); offsets();
  if (audioSrc) {
    au.src = audioSrc;
    au.onerror = () => { audioOK = false; document.body.classList.add('noaudio'); offsets(); };
  }
  clearTimeout(timer); step = 0; paused = false; $('#pause').textContent = '❚❚ 일시정지';
  fit(true);
  toast(`발언 ${segs.length}개에서 논의 구조를 찾았습니다 · 시간 순으로 펼칩니다`, 3000);
  setTimeout(play, 700);
}

(function resizer() {
  const h = $('#rzx'), root = document.documentElement.style;
  const saved = localStorage.getItem('mn.rail'); if (saved) root.setProperty('--rail', saved);
  h.addEventListener('pointerdown', e => {
    h.setPointerCapture(e.pointerId);
    const mv = ev => { const w = Math.min(680, Math.max(260, ev.clientX));
      root.setProperty('--rail', w + 'px'); localStorage.setItem('mn.rail', w + 'px'); };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  });
  h.addEventListener('dblclick', () => { root.setProperty('--rail', '380px'); localStorage.removeItem('mn.rail'); });
})();
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('tab-src', b.dataset.tab === 'src');
});
function offsets() {
  document.documentElement.style.setProperty('--player',
    document.body.classList.contains('noaudio') ? '0px' : '56px');
}
addEventListener('resize', () => apply());
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); audioOK ? (au.paused ? au.play() : au.pause()) : $('#pause').click(); }
  if (e.key === 'ArrowLeft') seekTo((au.currentTime || 0) - 5);
  if (e.key === 'ArrowRight') seekTo((au.currentTime || 0) + 5);
});
offsets();
</script>
</body>
