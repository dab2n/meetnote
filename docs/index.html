let HITS = [], HIT = 0;
function bindTrans() {
  const q = $('#q'), box = $('#segs');
  box.onclick = e => {
    const b = e.target.closest('[data-seek]'); if (!b) return;
    const i = M.segs.findIndex(g => g.t === +b.dataset.seek);
    if (i >= 0) readFrom(i); else seek(+b.dataset.seek);
  };
  const run = () => {
    clearMarks();
    const v = q.value.trim(); HITS = []; HIT = 0;
    if (v) {
      const re = new RegExp(v.split(/\s+/).map(escRe).join('\\s*'), 'gi');
      const split = new RegExp(`(${re.source})`, 'gi');
      box.querySelectorAll('p').forEach(p => {
        const t = p.textContent; if (!t.match(re)) return;
        p.innerHTML = t.split(split).map((x, i) => i % 2 ? `<mark>${esc(x)}</mark>` : esc(x)).join('');
        HITS.push(...p.querySelectorAll('mark'));
      });
    }
    $('#qn').textContent = v ? (HITS.length ? `1/${HITS.length}` : '없음') : '';
    jump();
  };
  const jump = () => { HITS.forEach((h, i) => h.classList.toggle('on', i === HIT)); if (HITS[HIT]) HITS[HIT].scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  q.oninput = run;
  q.onkeydown = e => { if (e.key === 'Enter' && HITS.length) { HIT = (HIT + (e.shiftKey ? HITS.length - 1 : 1)) % HITS.length; $('#qn').textContent = `${HIT + 1}/${HITS.length}`; jump(); } };
}
function clearMarks() {
  const box = $('#segs'); if (!box) return;
  box.classList.remove('dim');
  box.querySelectorAll('.seg.src').forEach(s => s.classList.remove('src'));
  box.querySelectorAll('mark').forEach(mk => { const p = mk.parentNode; p.textContent = p.textContent; });
  if (typeof WSEG !== 'undefined' && WSEG >= 0) { WSEG = -1; WI = -1; }   /* 검색이 글을 다시 쓰면 어절 상자는 다음 틱에 새로 입힌다 */
}
const narrow = () => matchMedia('(max-width:860px)').matches;
/* 쟁점을 누르면 그 논의 구간이 원문에서 칠해진다 */
function pickSection(s, scroll, at) {
  if (!s) return;
  if (narrow() && scroll && CUR.kind !== 'agenda' && !$('.mgrid.solo')) { go(`#/m/${M.m.id}/src`); setTimeout(() => pickSection(s, true, at), 80); return; }
  clearMarks();
  const a = secs(s.t), b = secs(s.t1), box = $('#segs');
  let first = null, want = null;
  M.segs.forEach((g, i) => {
    if (g.t >= a && g.t < b) { const el = box.children[i]; el.classList.add('src'); first = first || el;
      if (at != null && g.t <= at) want = el; }
  });
  box.classList.add('dim');
  const go_ = want || first;
  if (go_) go_.scrollIntoView({ block: at != null ? 'center' : 'start', behavior: 'smooth' });
}
/* 노드·할 일을 누르면 그 사람이 한 말의 그 구절만 짚는다 */
function showEv(ev, who, t) {
  if (narrow() && CUR.kind !== 'agenda' && !$('.mgrid.solo')) { PENDING = { ev, who, t }; go(`#/m/${M.m.id}/src`); return; }
  clearMarks();
  const re = ev && new RegExp(ev.trim().split(/\s+/).map(escRe).join('\\s+'));
  const near = secs(t);
  const cand = M.segs.map((g, i) => [g, i]).filter(([g]) => (!who || g.s === who) && re && g.l.some(l => re.test(l)))
    .sort((x, y) => Math.abs(x[0].t - near) - Math.abs(y[0].t - near));
  if (!cand.length) { const i = M.segs.findIndex(g => g.t >= near); if (i >= 0) { LASTEV = i; $('#segs').children[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); } return false; }
  const [g, i] = cand[0], li = g.l.findIndex(l => re.test(l));
  LASTEV = i;
  const p = $('#segs').children[i].querySelector(`p[data-li="${li}"]`);
  const m = re.exec(g.l[li]);
  p.innerHTML = esc(g.l[li].slice(0, m.index)) + `<mark class="ev">${esc(m[0])}</mark>` + esc(g.l[li].slice(m.index + m[0].length));
  p.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return true;
}
let PENDING = null, LASTEV = -1;      /* showEv 가 마지막으로 짚은 발언 — 따라 읽기가 여기서 출발한다 */
function openEvidence(id, ev, who, t) { PENDING = { ev, who, t }; go(`#/m/${id}/${narrow() ? 'src' : 'sum'}`); }

/* ===================================================================
   원문 따라 읽기 (발표 장표 30번)
   카드 누름 → 원문이 그 발언으로 흘러감 → 거기서부터 재생 → 어절 상자가 따라감
   =================================================================== */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* cubic-bezier 를 그대로 쓴다 — 스크롤은 CSS 로 길이를 못 정해서 손으로 민다 */
const bez = (x1, y1, x2, y2) => {
  const cx = t => 3 * (1 - t) ** 2 * t * x1 + 3 * (1 - t) * t * t * x2 + t ** 3;
  const cy = t => 3 * (1 - t) ** 2 * t * y1 + 3 * (1 - t) * t * t * y2 + t ** 3;
  return x => { let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 18; i++) { if (cx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return cy(t); };
};
const EASE_SCROLL = bez(.55, 0, .1, 1);

let WORDS = null,        /* 발언마다 [{text, li, a, b}] */
    WSEG = -1, WI = -1,  /* 지금 어절을 입힌 발언 · 그 안의 어절 */
    WRAF = 0, WFOLLOW = true, WSCROLLING = false;

/* 어절 시각 — STT 에 단어 타임스탬프가 없어서 발언 구간을 글자 수로 나눠 어림한다.
   근사치다. STT 가 단어 타임스탬프를 주면 여기만 그 값으로 갈아끼우면 된다 */
function buildWords() {
  const segs = M.segs;
  const end = secs(M.map.meeting.duration) || (segs[segs.length - 1].t + 30);
  WORDS = segs.map((g, i) => {
    const a = g.t, b = i + 1 < segs.length ? segs[i + 1].t : end;
    const ws = [];
    g.l.forEach((l, li) => l.split(/\s+/).forEach(w => { if (w) ws.push({ text: w, li }); }));
    const total = ws.reduce((n, w) => n + w.text.length, 0) || 1;
    let acc = 0;
    ws.forEach(w => { w.a = a + (b - a) * acc / total; acc += w.text.length; w.b = a + (b - a) * acc / total; });
    return ws;
  });
}
/* 어절 <span> 은 지금 재생 중인 발언에만 입힌다 — 전사가 길어도 DOM 이 무겁지 않고
   검색·근거 하이라이트가 쓰는 p.innerHTML 과 부딪히지 않는다 */
function wrapSeg(i) {
  if (WSEG === i) return;
  if (WSEG >= 0) unwrapSeg(WSEG);
  const el = $('#segs') && $('#segs').children[i]; if (!el || !M.segs[i]) return;
  let wi = 0;
  M.segs[i].l.forEach((l, li) => {
    const p = el.querySelector(`p[data-li="${li}"]`); if (!p) return;
    p.innerHTML = l.split(/(\s+)/).map(tok =>
      tok.trim() ? `<span class="wd" data-w="${wi++}">${esc(tok)}</span>` : esc(tok)).join('');
  });
  WSEG = i; WI = -1;
}
function unwrapSeg(i) {
  const el = $('#segs') && $('#segs').children[i];
  if (el && M.segs[i]) M.segs[i].l.forEach((l, li) => {
    const p = el.querySelector(`p[data-li="${li}"]`); if (p) p.textContent = l;
  });
  if (WSEG === i) { WSEG = -1; WI = -1; }
}
function hlBox(cls) {
  const box = $('#segs'); if (!box) return null;
  let b = box.querySelector('.' + cls);
  if (!b) { b = document.createElement('i'); b.className = cls; box.append(b); }
  return b;
}
function hideHl() {
  ['hl-row', 'hl-word'].forEach(c => { const b = $('#segs') && $('#segs').querySelector('.' + c); if (b) b.classList.remove('on'); });
  if (WSEG >= 0) unwrapSeg(WSEG);
}
const atOrBefore = (arr, t, key) => {            /* 시간순이라 이진 탐색 */
  let lo = 0, hi = arr.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m][key] <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
};
function syncWords(t) {
  const box = $('#segs'); if (!box || !WORDS) return;
  const i = atOrBefore(M.segs, t, 't');
  if (i < 0) return hideHl();
  const seg = box.children[i]; if (!seg || !seg.classList.contains('seg')) return;
  if (i !== WSEG) {
    wrapSeg(i);
    const row = hlBox('hl-row');
    row.style.top = seg.offsetTop + 'px'; row.style.height = seg.offsetHeight + 'px';
    row.classList.add('on');
    if (WFOLLOW && !WSCROLLING) seg.scrollIntoView({ block: 'nearest', behavior: REDUCE ? 'auto' : 'smooth' });
  }
  const ws = WORDS[i] || [];
  const wi = Math.max(0, atOrBefore(ws, t, 'a'));
  if (wi === WI) return;
  const span = seg.querySelector(`.wd[data-w="${wi}"]`); if (!span) return;
  WI = wi;
  const br = box.getBoundingClientRect(), sr = span.getBoundingClientRect();
  const w = hlBox('hl-word');
  w.style.left = (sr.left - br.left + box.scrollLeft - 2) + 'px';
  w.style.top = (sr.top - br.top + box.scrollTop - 1) + 'px';
  w.style.width = (sr.width + 4) + 'px';
  w.style.height = (sr.height + 2) + 'px';
  w.classList.add('on');
}
function wordLoop() {
  WRAF = 0;
  if (!AU || AU.paused) return;
  syncWords(AU.currentTime);
  WRAF = requestAnimationFrame(wordLoop);
}
function startWordLoop() { if (!WRAF) WRAF = requestAnimationFrame(wordLoop); }

/* 원문 목록을 그 발언까지 밀어 준다 — 1.3초, 빠르게 내려가다 부드럽게 선다 */
function scrollToSeg(i, done) {
  const box = $('#segs'), seg = box && box.children[i];
  if (!seg) return done && done();
  const to = Math.max(0, Math.min(box.scrollHeight - box.clientHeight, seg.offsetTop - 20));
  const from = box.scrollTop;
  if (REDUCE || Math.abs(to - from) < 4) { box.scrollTop = to; return done && done(); }
  const t0 = performance.now(), D = 1300;
  WSCROLLING = true;
  (function step(now) {
    const k = Math.min(1, (now - t0) / D);
    box.scrollTop = from + (to - from) * EASE_SCROLL(k);
    if (k < 1) requestAnimationFrame(step);
    else { WSCROLLING = false; done && done(); }
  })(performance.now());
}
/* 카드를 눌렀을 때 — 그 발언으로 흘러가 거기서부터 듣는다 */
function readFrom(i) {
  if (!WORDS) buildWords();
  WFOLLOW = true;
  scrollToSeg(i, () => {
    seekTo(M.segs[i].t, true);
    syncWords(M.segs[i].t + .01);
  });
}
/* 재생 중에 손으로 굴리면 따라가기를 멈춘다 */
addEventListener('wheel', e => { if (e.target.closest && e.target.closest('#segs')) WFOLLOW = false; }, { passive: true });
addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#segs')) WFOLLOW = false; });

/* ---------- 음성 (있을 때만) ---------- */
let AU = null;
/* 음성 파일이 있으면 그걸 틀고, 없으면 가상 시계를 돌린다.
   어느 쪽이든 재생 버튼·시간·진행 막대·원문 따라 읽기는 똑같이 움직인다 */
let VC = null, VT = 0, VDUR = 0;
const nowTime = () => AU ? AU.currentTime : VT;
const isPlaying = () => AU ? !AU.paused : !!VC;
function paintPlay() {
  const pp = $('#pp'); if (!pp) return;
  pp.innerHTML = isPlaying() ? I.pause32 : I.play32;
  pp.setAttribute('aria-label', isPlaying() ? '일시정지' : '재생');
}
function paintTime() {
  const t = nowTime(), dur = AU ? (AU.duration || VDUR) : VDUR;
  if ($('#pt')) $('#pt').textContent = mmss(t);
  if ($('#pb i')) $('#pb i').style.width = (dur ? t / dur * 100 : 0) + '%';
  const box = $('#segs'); if (!box) return;
  let k = -1; for (let i = 0; i < M.segs.length && M.segs[i].t <= t; i++) k = i;
  box.querySelectorAll('.seg.now').forEach(x => x.classList.remove('now'));
  if (k >= 0 && box.children[k]) box.children[k].classList.add('now');
}
function vcStop() { clearInterval(VC); VC = null; paintPlay(); }
function vcStart() {
  if (VC) return;
  if (!WORDS) buildWords();
  VC = setInterval(() => {
    VT += .1;
    if (VT >= VDUR) { VT = VDUR; vcStop(); }
    paintTime(); syncWords(VT);
  }, 100);
  paintPlay();
}
function playPause() {
  if (AU) { AU.paused ? AU.play().catch(() => {}) : AU.pause(); return; }
  VC ? vcStop() : vcStart();
}
function seekTo(t, play) {
  if (AU) { AU.currentTime = t; if (play) AU.play().catch(() => {}); return; }
  VT = Math.max(0, Math.min(VDUR, t));
  paintTime(); syncWords(VT);
  if (play) vcStart();
}
function audio(map) {
  if (AU) { AU.pause(); AU = null; }
  vcStop(); VT = 0;
  cancelAnimationFrame(WRAF); WRAF = 0; WORDS = null; WSEG = -1; WI = -1; WFOLLOW = true;
  VDUR = secs(map.meeting.duration) || 0;
  $('#pp').disabled = false;                       /* 음성이 없어도 원문은 따라 읽을 수 있다 */
  $('#pp').onclick = playPause;
  $('#pb').onclick = e => { const r = e.currentTarget.getBoundingClientRect();
    seekTo((e.clientX - r.left) / r.width * (AU ? (AU.duration || VDUR) : VDUR), isPlaying()); };
  paintPlay(); paintTime();
  if (!map.meeting.audio) return;                  /* 가상 시계로 간다 */
  const a = AU = new Audio(enc(map.meeting.audio)); a.preload = 'metadata';
  a.onerror = () => { if (a === AU) { AU = null; paintPlay(); } };   /* 못 읽으면 가상 시계로 내려앉는다 */
  a.ontimeupdate = paintTime;
  a.onplay = a.onpause = () => { paintPlay(); if (!a.paused) { if (!WORDS) buildWords(); startWordLoop(); } };
}
function seek(t) { seekTo(t, true); }

/* ---------- 의견 시트 (미해결 안건) ---------- */
function commentSheet(m, s, after) {
  const key = s.no + '-res', me = CUR.p && CUR.p.me;
  const bg = document.createElement('div'); bg.className = 'dim-bg';
  const sh = document.createElement('aside'); sh.className = 'cs';
  const close = () => { bg.remove(); sh.remove(); removeEventListener('keydown', onk); after && after(); };
  const onk = e => { if (e.key === 'Escape') close(); };
  const draw = () => {
    const cs = cmts(m.id, key);
    sh.innerHTML = `<header>의견<button aria-label="닫기">${I.x}</button></header>
      <div class="ctx"><small>${esc(titleOf(m))} · 논의 ${s.no} · <span class="st ${s.resolution.kind}">${KO[s.resolution.kind]}</span></small><h3>${esc(s.resolution.title)}</h3>
        <a href="#/m/${esc(m.id)}/sum/${s.no}">회의에서 보기 →</a></div>
      <div class="list">${cs.map((c, i) => `<div class="c">${me ? `<b class="by">${av(CUR.p, me, 22)}나</b>` : ''}${esc(c.text)}<time>${esc(c.at)}</time><button data-d="${i}">지우기</button></div>`).join('') || '<div class="empty" style="background:rgba(255,255,255,.5)">아직 의견이 없어요</div>'}</div>
      <form><input placeholder="의견 남기기" autofocus><button>남기기</button></form>`;
    sh.querySelector('header button').onclick = close;
    sh.querySelector('.ctx a').onclick = close;
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const x = cmts(m.id, key); x.splice(+b.dataset.d, 1); putCmts(m.id, key, x); draw(); });
    sh.querySelector('form').onsubmit = e => {
      e.preventDefault(); const v = e.target.querySelector('input').value.trim(); if (!v) return;
      putCmts(m.id, key, [...cmts(m.id, key), { text: v, at: new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) }]);
      utAct('comment', `의견 등록: ${v.slice(0, 30)}`);
      draw();
    };
    sh.querySelector('input').focus();
  };
  bg.onclick = close; addEventListener('keydown', onk);
  document.body.append(bg, sh); draw();
  utAct('comment-open', `${s.resolution.title} 의견창`);
}

/* 근거로 가기 — 할 일의 출처, 요약·물어보기의 인용, 플로우 맵 카드가 모두 이 길로 들어온다.
   원문이 그 발언으로 흘러가 거기서부터 듣고, 어절 상자가 따라간다 */
function gotoEv(d, wait) {
  if (!M) return;
  showSrc(true);
  setTimeout(() => {
    LASTEV = -1;
    if (!(d.ev && showEv(d.ev, d.who, d.t))) {
      const sec = d.no && M.map.sections.find(s => s.no === d.no);
      if (sec) pickSection(sec, false, secs(d.t));
    }
    if (LASTEV < 0) LASTEV = Math.max(0, M.segs.findIndex(g => g.t >= secs(d.t)));
    readFrom(LASTEV);
    if (d.no) utAct('ev' + d.no, `논의 ${d.no} 카드에서 원문으로`);
  }, wait == null ? 360 : wait);
}

/* 플로우 맵(iframe)에서 카드를 누르면 왼쪽 원문을 짚는다 */
addEventListener('message', e => {
  const d = e.data; if (!d || (!M && CUR.kind !== 'agenda')) return;
  if (d.mn === 'ev') { if (CUR.kind === 'agenda') agendaEv(d); else gotoEv(d); }
  if (d.mn === 'follow') follow(d.on);
  if (d.mn === 'view' && d.open) (d.frames || []).forEach(no => utAct('zoom' + no, `플로우 맵에서 논의 ${no} 확대`));
  if (d.mn === 'rate') { FRATE = d.v; if (AU) AU.playbackRate = d.v; }
  if (d.mn === 'seek' && FOLLOW) { if (AU && AU.duration) AU.currentTime = d.t; else FSKIP = d.t; }
});

/* 실시간 따라가기 — 맵이 부르면 회의를 처음부터 틀고 시각을 넘겨 준다.
   음성이 없으면 가상 시계로 빠르게 흘린다 (8배속). */
let FOLLOW = null, FRATE = 2, FSKIP = null;
function follow(on) {
  clearInterval(FOLLOW); FOLLOW = null;
  const send = t => { const f = $('.map iframe'); if (f) f.contentWindow.postMessage({ mn: 't', t }, '*'); };
  if (AU) { AU.pause(); AU.currentTime = 0; }
  if (!on) { send(-1); return; }
  if (AU && AU.duration) {                          /* 음성이 있으면 실제로 듣는다 */
    AU.playbackRate = FRATE;
    AU.play().catch(() => {});
    FOLLOW = setInterval(() => { if (!AU.paused) send(AU.currentTime); }, 200);
  } else {
    let t = 0, end = secs(M.map.meeting.duration || '1:00:00');
    FOLLOW = setInterval(() => {
      if (FSKIP != null) { t = FSKIP; FSKIP = null; }
      t += 0.2 * FRATE * 4; send(t);
      if (t > end) { clearInterval(FOLLOW); FOLLOW = null; }
    }, 200);
  }
}

/* ================= 6. AI 물어보기 ================= */
/* 모바일의 '전원 버튼 길게 누르기' 대신: 화면 아래 떠 있는 입력줄을 누르거나 ⌘K / Ctrl+K.
   흰 블러 막이 누른 자리에서 원형으로 번지는 연출은 그대로 가져온다. 답은 이 맥의 Claude 구독(/ask)으로. */
let ASK = null;
function openAsk(from) {
  if (ASK) return;
  const r = from ? from.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight - 50, width: 0, height: 0 };
  const scope = CUR.kind === 'meeting' ? { label: titleOf(M.m), ms: [M.m] } : { label: `${CUR.p.name} 전체 회의`, ms: inProj(CUR.p) };
  const o = document.createElement('div'); o.className = 'ask';
  o.style.setProperty('--px', (r.left + r.width / 2) + 'px'); o.style.setProperty('--py', (r.top + r.height / 2) + 'px');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  o.innerHTML = `<button class="x" aria-label="닫기">${I.x}</button><div class="in">
    <div class="scope"><b class="spark">✦</b>물어볼 범위 <b>${esc(scope.label)}</b></div>
    <form><input placeholder="무엇이든 물어보세요" autocomplete="off">
      ${SR ? `<button type="button" class="mic" aria-label="말로 묻기">${I.mic}</button>` : ''}<button class="go" aria-label="묻기">${I.up}</button></form>
    ${LOCALSRV ? '' : '<div class="warn">AI 답변은 이 맥에서 연 로컬 주소(127.0.0.1:8787/notes/)에서만 동작해요. 구독 안에서만 돌리기 위해서예요.</div>'}
    <div id="ans"></div></div>`;
  document.body.append(o); ASK = o;
  utAct('ask-open', '물어보기 열기');
  const inp = o.querySelector('input'); setTimeout(() => inp.focus(), 250);
  o.querySelector('.x').onclick = closeAsk;
  o.querySelector('form').onsubmit = e => { e.preventDefault(); const q = inp.value.trim(); if (q) { utAct('ask', `질문: ${q.slice(0, 30)}`); askRun(q, scope); } };
  const mic = o.querySelector('.mic');
  if (mic) mic.onclick = () => {
    const rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true;
    mic.classList.add('on');
    rec.onresult = e => { inp.value = [...e.results].map(x => x[0].transcript).join(''); if (e.results[e.results.length - 1].isFinal) { rec.stop(); o.querySelector('form').requestSubmit(); } };
    rec.onend = rec.onerror = () => mic.classList.remove('on');
    rec.start();
  };
}
function closeAsk() { if (!ASK) return; const o = ASK; ASK = null; o.classList.add('out'); setTimeout(() => o.remove(), 380); }
async function askRun(q, scope) {
  const box = ASK.querySelector('#ans');
  box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="think"><i></i><i></i><i></i></div></div>`;
  if (!LOCALSRV) { box.querySelector('.think').outerHTML = '<div class="aa">여기서는 답할 수 없어요.</div>'; return; }
  try {
    /* 여러 회의를 한 번에 물으면 회의마다 머리말 줄을 끼워 구분한다 */
    const parts = await Promise.all(scope.ms.map(async m => ({ m, segs: await getTrans(m), map: await getMap(m) })));
    const segs = parts.length === 1 ? parts[0].segs : parts.flatMap(x => [{ s: '—', t: 0, l: [`[회의: ${titleOf(x.m)} · ${x.m.date}]`] }, ...x.segs]);
    const map = parts.length === 1 ? parts[0].map : { sections: parts.flatMap(x => x.map.sections.map(s => ({ ...s, title: `[${titleOf(x.m)}] ${s.title}` }))) };
    const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, segments: segs, map }) });
    const a = await r.json();
    if (!r.ok) throw new Error(a.error || r.status);
    if (!ASK) return;
    box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="aa" id="aa"></div><div class="cites" id="ci"></div></div>`;
    utAct('ask-answer', (a.answer || '').slice(0, 40));
    await typeOut($('#aa'), a.answer || '답을 찾지 못했어요.');
    const cites = (a.cites || []).map(c => ({ ...c, m: (parts.find(x => x.segs.some(g => g.s === c.who && g.l.some(l => l.includes(c.quote)))) || parts[0]).m }));
    if (cites.length && ASK) {
      $('#ci').innerHTML = `<h6>근거가 된 발언</h6>` + cites.map((c, i) => `<button class="cite" data-i="${i}" style="animation-delay:${i * 60}ms">
        <small><b>${esc(c.who)}</b> · ${esc(c.t)}${parts.length > 1 ? ` · ${esc(titleOf(c.m))}` : ''}</small><p>“${esc(c.quote)}”</p></button>`).join('');
      $('#ci').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; const c = cites[+b.dataset.i]; closeAsk(); openEvidence(c.m.id, c.quote, c.who, c.t); };
    }
  } catch (e) {
    if (ASK) box.innerHTML = `<div class="ans"><div class="qq">${esc(q)}</div><div class="warn">답을 받지 못했어요 · ${esc(e.message || e)}</div></div>`;
  }
}
function typeOut(el, text) {
  const t0 = performance.now();                        /* 경과 시간으로 글자 수를 정한다 — 탭이 뒤에 있어도 밀리지 않게 */
  return new Promise(res => { const step = () => { if (!ASK) return res();
    const n = Math.min(text.length, Math.floor((performance.now() - t0) / 18));
    el.innerHTML = esc(text.slice(0, n)) + (n < text.length ? '<span class="caret"></span>' : ''); if (n < text.length) setTimeout(step, 18); else res(); }; step(); });
}
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); ASK ? closeAsk() : openAsk($('#fab')); }
  else if (e.key === 'Escape' && ASK) closeAsk();
});

/* 지금 화면에서 '어디가 무엇인지' — 시선 기록을 카드 단위로 읽으려고 자리를 재 둔다 (ut.js) */
function rects() {
  const out = [], Z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zoom')) || 1;
  const put = (k, b, t) => { if (b && b.width > 8) out.push({ k, t, x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) }); };
  const add = (k, el, t) => el && put(k, el.getBoundingClientRect(), t);
  add('화면', document.querySelector('.app'), 'app');
  add('상단바', $('.topbar'), 'bar');
  add('회의 머리말', $('.mtop'), 'bar');
  add('원문', $('.mcontent .tr'), 'panel');
  add('재생바', $('.playdock'), 'bar');
  add('탭', $('.mtabs2'), 'bar');
  add('플로우 맵', $('.mcontent .map'), 'panel');
  const f = $('.map iframe');
  if (f && f.contentDocument) {
    const fr = f.getBoundingClientRect(), d = f.contentDocument;    /* iframe 안은 배율(zoom) 밖이라 Z 를 곱한다 */
    const rel = (k, e, t) => { const b = e.getBoundingClientRect();
      if (b.width < 8 || b.right < 0 || b.left > fr.width / Z) return;
      put(k, { x: fr.x + b.x * Z, y: fr.y + b.y * Z, width: b.width * Z, height: b.height * Z }, t); };
    const lod = d.getElementById('cv') && d.getElementById('cv').classList.contains('lod');
    d.querySelectorAll('.frame').forEach((e, i) => rel('안건 ' + (i + 1), e, 'board'));
    if (!lod) d.querySelectorAll('.node').forEach(e => {
      const t = e.querySelector('h4'); if (t) rel(t.textContent.trim().slice(0, 16), e, 'card');
    });
  }
  return out;
}

/* 디자인 규격(1152×720) 을 창에 맞춰 통째로 키운다 — 모자란 쪽에 맞춰야 아래가 잘리지 않는다.
   무엇보다 먼저 지키는 것: 어떤 창에서도 화면이 다 보인다. 비율은 그 다음이다.
   ① 창이 규격보다 크면 키운다(최대 2배) ② 작으면 줄인다(0.5배까지)
   ③ 0.5 로도 안 담기는 창에서는 줄이기를 멈추고 세로로 흐르게 둔다(body.tight) — 잘리느니 스크롤한다 */
const fitShell = () => {
  const fit = Math.min(innerWidth / 1152, innerHeight / 720);
  const z = Math.max(.5, Math.min(2, fit));
  document.documentElement.style.setProperty('--zoom', z.toFixed(4));
  document.body.classList.toggle('tight', fit < z - .001);
};
fitShell();
addEventListener('resize', fitShell);

/* 왼쪽 레일 접기·펼치기 — 로고를 누른다 (피그마 379:11669 collapsed / 379:11671 expanded) */
/* 플로우 맵에서는 레일을 접어 판을 넓게 쓴다. 맵을 떠나면 원래 상태로 돌려놓는다 */
let LNBWAS = null;
function lnbAuto(on) {
  if (on) { if (LNBWAS === null) LNBWAS = document.body.classList.contains('lnb'); lnb(false, true); }
  else if (LNBWAS !== null) { lnb(LNBWAS, true); LNBWAS = null; }
}
function lnb(open, quiet) {
  document.body.classList.toggle('lnb', open);
  document.body.style.setProperty('--lnb', open ? '185px' : '68px');   /* 폭은 값으로 — 칸과 레일이 한 몸으로 늘어난다 */
  if (!quiet) store.set('mn.lnb', open ? '1' : '');
  const b = $('#lnbt'); if (b) b.setAttribute('aria-label', open ? '메뉴 접기' : '메뉴 펼치기');
}
lnb(store.get('mn.lnb') === '1');
$('#lnbt').onclick = () => lnb(!document.body.classList.contains('lnb'));
$('#lnbf').onclick = () => lnb(false);

boot().then(() => {
  if (window.UT && UT.on) UT.mount({ screen: screenName, ctx: () => (CUR.kind === 'meeting' ? CUR.id : ''), reload: () => { CUR = {}; }, rects });
});
</script>
</body>
</html>
